    // ==================== BREADCRUMB WITH NOTIFICATIONS ====================

    function Breadcrumb({ activeMenu, setActiveMenu, role, user }) {
      const menuLabels = { dashboard: 'Dashboard', menu: 'Menu', orders: 'Orders', promos: 'Promo Codes', combos: 'Combos', daily: 'Daily Summary', reports: 'Reports', users: 'Users', logs: 'Activity Logs', account: 'My Account', about: 'About App' };
      const [notifications, setNotifications] = useState([]);
      const [showDropdown, setShowDropdown] = useState(false);
      const [readIds, setReadIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('food_app_notif_read_' + user.id) || '[]'); } catch(e) { return []; }
      });
      const prevCountRef = useRef(0);
      const bellRef = useRef(null);
      const [dropdownPos, setDropdownPos] = useState({ top: 0, right: 0 });

      const fetchNotifications = async () => {
        try {
          const res = await serverCall('getNotifications', user.id, user.role);
          if (res.success) {
            const newNotifs = res.data;
            if (newNotifs.length > prevCountRef.current && prevCountRef.current > 0) {
              try { if (navigator.vibrate) navigator.vibrate(200); } catch(e) {}
            }
            prevCountRef.current = newNotifs.length;
            setNotifications(newNotifs);
          }
        } catch(e) {}
      };

      useEffect(() => {
        fetchNotifications();
        const interval = setInterval(fetchNotifications, 3000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        try { localStorage.setItem('food_app_notif_read_' + user.id, JSON.stringify(readIds)); } catch(e) {}
      }, [readIds]);

      const unreadCount = notifications.filter(n => !readIds.includes(n.id)).length;

      const getTimeAgo = (isoString) => {
        const seconds = Math.floor((new Date() - new Date(isoString)) / 1000);
        if (seconds < 60) return 'Just now';
        if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
        if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
        return Math.floor(seconds / 86400) + 'd ago';
      };

      const handleMarkAllRead = () => {
        setReadIds(notifications.map(n => n.id));
      };

      const handleNotifClick = (notif) => {
        if (!readIds.includes(notif.id)) {
          setReadIds(prev => [...prev, notif.id]);
        }
        if (notif.link) setActiveMenu(notif.link);
        setShowDropdown(false);
      };

      const toggleDropdown = () => {
        if (!showDropdown && bellRef.current) {
          const rect = bellRef.current.getBoundingClientRect();
          const dropW = Math.min(360, window.innerWidth - 32);
          let rightPos = window.innerWidth - rect.right;
          if (rightPos + dropW > window.innerWidth - 16) rightPos = 16;
          setDropdownPos({ top: rect.bottom + 8, right: Math.max(rightPos, 16) });
        }
        setShowDropdown(!showDropdown);
      };

      return (
        <div className="breadcrumb">
          <a onClick={() => setActiveMenu('dashboard')}><i className="fas fa-home"></i> Home</a>
          <span className="breadcrumb-sep">/</span>
          <span>{menuLabels[activeMenu] || 'Page'}</span>

          <div className="breadcrumb-right">
            <button ref={bellRef} className="notif-bell" onClick={toggleDropdown}>
              <i className="fas fa-bell"></i>
              {unreadCount > 0 && <span className="notif-count">{unreadCount > 99 ? '99+' : unreadCount}</span>}
            </button>

            {showDropdown && ReactDOM.createPortal(
              <React.Fragment>
                <div className="notif-overlay" onClick={() => setShowDropdown(false)}></div>
                <div className="notif-dropdown" style={{ top: dropdownPos.top + 'px', right: dropdownPos.right + 'px' }}>
                  <div className="notif-dropdown-header">
                    <h4><i className="fas fa-bell"></i> Notifications</h4>
                    {unreadCount > 0 && (
                      <button className="notif-mark-read" onClick={handleMarkAllRead}>
                        <i className="fas fa-check-double"></i> Mark all read
                      </button>
                    )}
                  </div>
                  <div className="notif-list">
                    {notifications.length === 0 ? (
                      <div className="notif-empty">
                        <i className="fas fa-bell-slash"></i>
                        <p>No notifications</p>
                      </div>
                    ) : (
                      notifications.map(notif => {
                        const isUnread = !readIds.includes(notif.id);
                        return (
                          <div key={notif.id} className={'notif-item' + (isUnread ? ' unread' : '')} onClick={() => handleNotifClick(notif)}>
                            <div className={'notif-item-icon type-' + notif.type}>
                              <i className={'fas ' + notif.icon}></i>
                            </div>
                            <div className="notif-item-content">
                              <div className="notif-item-title">{notif.title}</div>
                              <div className="notif-item-message">{notif.message}</div>
                              <div className="notif-item-time">{getTimeAgo(notif.timestamp)}</div>
                            </div>
                            {isUnread && <div className="notif-unread-dot"></div>}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </React.Fragment>,
              document.body
            )}
          </div>
        </div>
      );
    }

    // ==================== DASHBOARD VIEW ====================

    function DashboardView({ user }) {
      const [loading, setLoading] = useState(true);
      const [stats, setStats] = useState(null);
      const chartRefs = useRef({});

      useEffect(() => {
        const loadStats = async () => {
          try {
            const result = await serverCall('getDashboardStats', user.id, user.role);
            setLoading(false);
            if (result.success) {
              setStats(result.data);
              if (user.role === 'admin') setTimeout(() => initAdminCharts(result.data), 100);
            } else {
              Swal.fire({ icon: 'error', title: 'Error', text: result.message });
            }
          } catch (err) {
            setLoading(false);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load dashboard stats' });
          }
        };
        loadStats();
        return () => { Object.values(chartRefs.current).forEach(c => { if (c) c.destroy(); }); };
      }, []);

      const initAdminCharts = (data) => {
        Object.values(chartRefs.current).forEach(c => { if (c) c.destroy(); });

        // Top 5 Items bar chart
        if (data.top5Items?.length) {
          const ctx = document.getElementById('top5Chart');
          if (ctx) {
            chartRefs.current.bar = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: data.top5Items.map(d => d.name),
                datasets: [{
                  label: 'Quantity Ordered',
                  data: data.top5Items.map(d => d.qty),
                  backgroundColor: 'rgba(181, 77, 45, 0.7)',
                  borderColor: '#221b18',
                  borderWidth: 2,
                  borderRadius: Number.MAX_VALUE,
                  borderSkipped: false
                }]
              },
              options: {
                responsive: true, maintainAspectRatio: false, indexAxis: 'y',
                plugins: { legend: { display: false }, title: { display: true, text: 'Top 5 Popular Items', color: '#221b18', font: { size: 16, weight: 'bold' } } },
                scales: { x: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: 'rgba(0,0,0,0.1)' } }, y: { grid: { display: false } } }
              }
            });
          }
        }

        // Orders by Type doughnut
        if (data.ordersByType?.length) {
          const ctx2 = document.getElementById('typeChart');
          if (ctx2) {
            chartRefs.current.doughnut = new Chart(ctx2, {
              type: 'doughnut',
              data: {
                labels: data.ordersByType.map(r => r.type.charAt(0).toUpperCase() + r.type.slice(1).replace('_', ' ')),
                datasets: [{
                  data: data.ordersByType.map(r => r.count),
                  backgroundColor: ['#b54d2d', '#d5a242', '#8e361c'],
                  borderColor: '#fff',
                  borderWidth: 2,
                  hoverOffset: 10
                }]
              },
              options: {
                responsive: true, maintainAspectRatio: false, cutout: '60%',
                plugins: {
                  legend: { position: 'bottom', labels: { color: '#4a3f37', padding: 15, usePointStyle: true } },
                  title: { display: true, text: 'Orders by Type', color: '#221b18', font: { size: 16, weight: 'bold' } }
                }
              }
            });
          }
        }

        // Revenue Trend line chart
        if (data.revenueTrend?.length) {
          const ctx3 = document.getElementById('revenueChart');
          if (ctx3) {
            chartRefs.current.line = new Chart(ctx3, {
              type: 'line',
              data: {
                labels: data.revenueTrend.map(d => d.day),
                datasets: [{
                  label: 'Revenue',
                  data: data.revenueTrend.map(d => d.revenue),
                  borderColor: '#b54d2d',
                  backgroundColor: 'rgba(181, 77, 45, 0.1)',
                  fill: true,
                  tension: 0.4,
                  pointBackgroundColor: '#221b18',
                  pointRadius: 5,
                  pointHoverRadius: 7
                }]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, title: { display: true, text: 'Revenue Trend (Last 7 Days)', color: '#221b18', font: { size: 16, weight: 'bold' } } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.1)' } }, x: { grid: { display: false } } }
              }
            });
          }
        }
      };

      if (loading) {
        const cardCount = user.role === 'admin' ? 8 : user.role === 'chef' ? 3 : 4;
        return <div><div className="dashboard-grid-3">{[...Array(cardCount)].map((_, i) => <DashboardCardSkeleton key={i} />)}</div>{user.role === 'admin' && <div className="dashboard-grid-3"><ChartSkeleton /><ChartSkeleton /><ChartSkeleton /></div>}</div>;
      }

      // Sparkline SVG helper
      const Sparkline = ({ color }) => (
        <div className="stat-card-spark">
          <svg viewBox="0 0 60 30" fill="none"><path d="M0 25 C10 22, 15 10, 20 15 S30 28, 35 12 S45 5, 50 18 S55 22, 60 10" stroke={color} strokeWidth="2.5" fill="none" strokeLinecap="round" /></svg>
        </div>
      );

      if (user.role === 'admin') {
        return (
          <div>
            <div className="dashboard-grid-6">
              <div className="stat-card">
                <div className="stat-card-icon icon-green"><i className="fas fa-dollar-sign"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{formatPrice(stats?.totalRevenue || 0)}</div><div className="stat-card-label">Total Revenue</div></div>
                <Sparkline color="#2e7d32" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon icon-orange"><i className="fas fa-users"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.todayOrders || 0}</div><div className="stat-card-label">Today's Orders</div></div>
                <Sparkline color="#e65100" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon icon-teal"><i className="fas fa-shopping-bag"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.totalOrders || 0}</div><div className="stat-card-label">Total Orders</div></div>
                <Sparkline color="#00838f" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon icon-blue"><i className="fas fa-clock"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.pendingOrders || 0}</div><div className="stat-card-label">Pending Orders</div></div>
                <Sparkline color="#1565c0" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon icon-purple"><i className="fas fa-hamburger"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.totalMenuItems || 0}</div><div className="stat-card-label">Menu Items</div></div>
                <Sparkline color="#6a1b9a" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon icon-red"><i className="fas fa-motorcycle"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.activeRiders || 0}</div><div className="stat-card-label">Active Riders</div></div>
                <Sparkline color="#c62828" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: '#e8f5e9', color: '#1b5e20'}}><i className="fas fa-cash-register"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{formatPrice(stats?.todayRevenue || 0)}</div><div className="stat-card-label">Today's Revenue</div></div>
                <Sparkline color="#1b5e20" />
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: '#e3f2fd', color: '#0d47a1'}}><i className="fas fa-calendar-week"></i></div>
                <div className="stat-card-info"><div className="stat-card-value">{stats?.weekOrders || 0}</div><div className="stat-card-label">This Week's Orders</div></div>
                <Sparkline color="#0d47a1" />
              </div>
              {stats?.lowStockCount > 0 && (
                <div className="stat-card" style={{borderLeft: '3px solid #e65100'}}>
                  <div className="stat-card-icon" style={{background: '#fff3e0', color: '#e65100'}}><i className="fas fa-exclamation-triangle"></i></div>
                  <div className="stat-card-info"><div className="stat-card-value" style={{color: '#e65100'}}>{stats.lowStockCount}</div><div className="stat-card-label">Low Stock Items</div></div>
                  <Sparkline color="#e65100" />
                </div>
              )}
            </div>

            <div className="dashboard-grid-3">
              <div className="chart-card">
                <div className="chart-container"><canvas id="revenueChart"></canvas></div>
              </div>
              <div className="chart-card">
                <div className="chart-container"><canvas id="top5Chart"></canvas></div>
              </div>
              <div className="chart-card">
                <div className="chart-container"><canvas id="typeChart"></canvas></div>
              </div>
            </div>
          </div>
        );
      }

      if (user.role === 'chef') {
        return (
          <div>
            <div className="dashboard-grid-3">
              <div className="stat-card"><div className="stat-card-icon icon-orange"><i className="fas fa-bell"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.waitingOrders || 0}</div><div className="stat-card-label">Waiting Orders</div></div><Sparkline color="#e65100" /></div>
              <div className="stat-card"><div className="stat-card-icon icon-purple"><i className="fas fa-fire"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.preparingCount || 0}</div><div className="stat-card-label">Preparing Now</div></div><Sparkline color="#6a1b9a" /></div>
              <div className="stat-card"><div className="stat-card-icon icon-green"><i className="fas fa-check-double"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.completedToday || 0}</div><div className="stat-card-label">Completed Today</div></div><Sparkline color="#2e7d32" /></div>

      // Rider
      return (
        <div>
          <div className="dashboard-grid-4">
            <div className="stat-card"><div className="stat-card-icon icon-navy"><i className="fas fa-clipboard-list"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.assignedOrders || 0}</div><div className="stat-card-label">Assigned Orders</div></div><Sparkline color="#221b18" /></div>
            <div className="stat-card"><div className="stat-card-icon icon-orange"><i className="fas fa-shipping-fast"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.outForDelivery || 0}</div><div className="stat-card-label">Out for Delivery</div></div><Sparkline color="#e65100" /></div>
            <div className="stat-card"><div className="stat-card-icon icon-green"><i className="fas fa-check-circle"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.deliveredToday || 0}</div><div className="stat-card-label">Delivered Today</div></div><Sparkline color="#2e7d32" /></div>
            <div className="stat-card"><div className="stat-card-icon icon-blue"><i className="fas fa-chart-bar"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.weeklyDeliveries || 0}</div><div className="stat-card-label">This Week</div></div><Sparkline color="#1565c0" /></div>

    // ==================== USERS VIEW ====================

    function UsersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [users, setUsers] = useState([]);
      const tableInstanceRef = useRef(null);
      const [filters, setFilters] = useState({ role: '', status: '' });

      useEffect(() => {
        loadUsers();
        return () => {
          if (tableInstanceRef.current) {
            try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {}
          }
        };
      }, []);

      const loadUsers = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getUsers', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setUsers(result.data);
            initializeDataTable(result.data);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load users' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) {
          try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#usersTable').empty(); } catch (e) {}
        }

        setTimeout(() => {
          try {
            const table = $('#usersTable').DataTable({
              data: data,
              destroy: true,
              columns: [
                { data: 'user_id', title: 'ID' },
                { data: 'username', title: 'Username', render: (d) => escapeHtml(d) },
                { data: 'name', title: 'Name', render: (d) => escapeHtml(d) },
                { data: 'role', title: 'Role', render: (d) => '<span class="role-badge role-' + escapeHtml(d) + '">' + escapeHtml(d.charAt(0).toUpperCase() + d.slice(1)) + '</span>' },
                { data: 'contact', title: 'Contact', render: (d) => escapeHtml(d) || '-' },
                { data: 'is_active', title: 'Status', render: (d) => '<span class="status-badge ' + (d === 'active' ? 'status-active' : 'status-inactive') + '">' + d.charAt(0).toUpperCase() + d.slice(1) + '</span>' },
                { data: 'last_login', title: 'Last Login', render: (d) => d ? formatDate(d) : 'Never' },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>' }
              ],
              pageLength: 10,
              lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "All"]],
              responsive: true,
              dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
              ],
              order: [[0, 'desc']]
            });

            $('#usersTable').off('click', '.action-icon');
            $('#usersTable').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              const rowData = table.row($(this).parents('tr')).data();
              if (action === 'edit') handleEditUser(rowData);
              else handleDeleteUser(rowData);
            });

            tableInstanceRef.current = table;
          } catch (e) {
            console.error('DataTable init error:', e);
          }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        dt.columns().search('').draw();
        if (filters.role) dt.column(3).search(filters.role).draw(false);
        if (filters.status) dt.column(5).search(filters.status).draw(false);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ role: '', status: '' });
        if (tableInstanceRef.current) { tableInstanceRef.current.columns().search('').draw(); }
      };

      useEffect(() => { if (tableInstanceRef.current && users.length > 0) applyFilters(); }, [filters]);

      // ---- SweetAlert2 Add User ----
      const handleAddUser = () => {
        Swal.fire({
          title: '<i class="fas fa-user-plus" style="color:#221b18"></i> Add New User',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Username *</label><input type="text" id="swal-username" placeholder="Enter username"></div>' +
            '<div class="form-group"><label>Password *</label><input type="password" id="swal-password" placeholder="Min 6 characters"></div>' +
            '<div class="form-group"><label>Display Name *</label><input type="text" id="swal-name" placeholder="Enter name"></div>' +
            '<div class="form-group"><label>Role</label><select id="swal-role"><option value="admin">Admin</option><option value="chef" selected>Chef</option><option value="rider">Rider</option></select></div>' +
            '<div class="form-group"><label>Contact</label><input type="tel" id="swal-contact" placeholder="Phone number"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600,
          showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          focusConfirm: false,
          preConfirm: () => {
            const username = document.getElementById('swal-username').value.trim();
            const password = document.getElementById('swal-password').value;
            const name = document.getElementById('swal-name').value.trim();
            if (!username || !password || !name) { Swal.showValidationMessage('Username, password and name are required'); return false; }
            if (password.length < 6) { Swal.showValidationMessage('Password must be at least 6 characters'); return false; }
            return {
              username, password, name,
              userRole: document.getElementById('swal-role').value,
              contact: document.getElementById('swal-contact').value.trim(),
              is_active: document.getElementById('swal-status').value
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Saving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('addUser', result.value, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
                setTimeout(() => loadUsers(), 100);
              } else {
                Swal.fire({ icon: 'error', title: 'Error', text: res.message });
              }
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to add user' });
            }
          }
        });
      };

      // ---- SweetAlert2 Edit User ----
      const handleEditUser = (userData) => {
        Swal.fire({
          title: '<i class="fas fa-user-edit" style="color:#221b18"></i> Edit User',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Username *</label><input type="text" id="swal-username" value="' + escapeHtml(userData.username) + '" placeholder="Enter username"></div>' +
            '<div class="form-group"><label>Password</label><input type="password" id="swal-password" placeholder="Leave blank to keep"></div>' +
            '<div class="form-group"><label>Display Name *</label><input type="text" id="swal-name" value="' + escapeHtml(userData.name) + '" placeholder="Enter name"></div>' +
            '<div class="form-group"><label>Role</label><select id="swal-role"><option value="admin">Admin</option><option value="chef">Chef</option><option value="rider">Rider</option></select></div>' +
            '<div class="form-group"><label>Contact</label><input type="tel" id="swal-contact" value="' + escapeHtml(userData.contact) + '" placeholder="Phone number"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600,
          showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Update',
          confirmButtonColor: '#b54d2d',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          focusConfirm: false,
          didOpen: () => {
            document.getElementById('swal-role').value = userData.role;
            document.getElementById('swal-status').value = userData.is_active;
          },
          preConfirm: () => {
            const username = document.getElementById('swal-username').value.trim();
            const name = document.getElementById('swal-name').value.trim();
            if (!username || !name) { Swal.showValidationMessage('Username and name are required'); return false; }
            const password = document.getElementById('swal-password').value;
            if (password && password.length < 6) { Swal.showValidationMessage('Password must be at least 6 characters'); return false; }
            return {
              user_id: userData.user_id, username, password, name,
              userRole: document.getElementById('swal-role').value,
              contact: document.getElementById('swal-contact').value.trim(),
              is_active: document.getElementById('swal-status').value
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('updateUser', result.value, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
                setTimeout(() => loadUsers(), 100);
              } else {
                Swal.fire({ icon: 'error', title: 'Error', text: res.message });
              }
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update user' });
            }
          }
        });
      };

      // ---- SweetAlert2 Delete User ----
      const handleDeleteUser = (userData) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete User?',
          text: 'Are you sure you want to delete "' + userData.name + '"? This cannot be undone.',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-trash"></i> Delete',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel'
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Deleting...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('deleteUser', userData.user_id, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Deleted!', text: res.message, timer: 2000, showConfirmButton: false });
                setTimeout(() => loadUsers(), 100);
              } else {
                Swal.fire({ icon: 'error', title: 'Error', text: res.message });
              }
            } catch (err) {
              Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to delete user' });
            }
          }
        });
      };

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-users"></i> Users Management</h2>
            <button className="btn btn-success" onClick={handleAddUser}><i className="fas fa-user-plus"></i> Add User</button>
          </div>

          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-user-tag"></i> Role</label>
                  <select value={filters.role} onChange={(e) => setFilters({...filters, role: e.target.value})} className="filter-input">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="chef">Chef</option>
                    <option value="rider">Rider</option>
                  </select>
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-check-circle"></i> Status</label>
                  <select value={filters.status} onChange={(e) => setFilters({...filters, status: e.target.value})} className="filter-input">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={5} columns={7} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="usersTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>
      );
    }

    function ItemExtrasSection({ user, menuItems }) {
      const [expanded, setExpanded] = useState(false);
      const [extrasLoading, setExtrasLoading] = useState(false);
      const [extras, setExtras] = useState([]);
      const extrasTableRef = useRef(null);

      const loadExtras = async () => {
        setExtrasLoading(true);
        try {
          const result = await serverCall('getAllItemExtras', user.id, user.role);
          setExtrasLoading(false);
          if (result.success) {
            setExtras(result.data);
            initExtrasTable(result.data);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message, confirmButtonColor: '#b54d2d' });
          }
        } catch (err) {
          setExtrasLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load extras', confirmButtonColor: '#b54d2d' });
        }
      };

      const toggleExpanded = () => {
        if (!expanded) {
          setExpanded(true);
          loadExtras();
        } else {
          setExpanded(false);
          if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); extrasTableRef.current = null; } catch(e){} }
        }
      };

      useEffect(() => {
        return () => { if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); } catch(e){} } };
      }, []);

        if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); extrasTableRef.current = null; $('#extrasTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            const menuMap = {};
            menuItems.forEach(m => { menuMap[m.item_id] = m.name; });

              data: data, destroy: true,
              columns: [
                { data: 'id', title: 'ID' },
                { data: 'item_id', title: 'Menu Item', render: (d) => '<strong>' + escapeHtml(menuMap[d] || d) + '</strong>' },
                { data: 'extra_name', title: 'Extra Name', render: (d) => escapeHtml(d) },
                { data: 'extra_price', title: 'Price', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'is_active', title: 'Status', render: (d) => '<span class="status-badge ' + (d === 'active' ? 'status-active' : 'status-inactive') + '">' + (d === 'active' ? 'Active' : 'Inactive') + '</span>' },

              dom: 'Blfrtip',

                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,3,4] } }
              ],
              order: [[0, 'desc']]
            });

            $('#extrasTable').off('click', '.action-icon').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              const rowData = table.row($(this).parents('tr')).data();
              if (action === 'edit') handleEditExtra(rowData);
              else handleDeleteExtra(rowData);
            });

            extrasTableRef.current = table;
          } catch(e) { console.error('Extras DataTable init error:', e); }
        }, 150);
      };

      const menuOptions = menuItems.map(m => ({ value: m.item_id, label: m.name + ' (' + m.item_id + ')' }));

      const handleAddExtra = () => {
        const menuOptionsHtml = menuItems.map(m => '<option value="' + escapeHtml(m.item_id) + '">' + escapeHtml(m.name) + ' (' + escapeHtml(m.item_id) + ')</option>').join('');

          didOpen: () => {
            document.getElementById('swal-itemid').value = extraData.item_id;
            document.getElementById('swal-estatus').value = extraData.is_active || 'active';
          },
          preConfirm: () => {
            const item_id = document.getElementById('swal-itemid').value;
            const extra_name = document.getElementById('swal-ename').value.trim();
            const extra_price = document.getElementById('swal-eprice').value;
            if (!item_id || !extra_name || !extra_price) { Swal.showValidationMessage('Item, name and price are required'); return false; }
            return { extra_id: extraData.extra_id, item_id, extra_name, extra_price: parseFloat(extra_price), is_active: document.getElementById('swal-estatus').value };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('updateItemExtra', result.value, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadExtras(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update extra', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      const handleDeleteExtra = (extraData) => {
        Swal.fire({
          icon: 'warning', title: 'Delete Extra?',
          text: 'Delete "' + extraData.extra_name + '"?',
          showCancelButton: true, confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-trash"></i> Delete'
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Deleting...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('deleteItemExtra', extraData.extra_id, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Deleted!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadExtras(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to delete extra', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      return (
        <div className="data-section" style={{marginTop: '20px'}}>
          <div className="section-header" style={{cursor: 'pointer'}} onClick={toggleExpanded}>
            <h2><i className={'fas ' + (expanded ? 'fa-chevron-down' : 'fa-chevron-right')} style={{fontSize: '14px', marginRight: '6px'}}></i><i className="fas fa-puzzle-piece"></i> Item Extras / Add-ons</h2>
            {expanded && <button className="btn btn-success" onClick={(e) => { e.stopPropagation(); handleAddExtra(); }}><i className="fas fa-plus"></i> Add Extra</button>}
          </div>
          {expanded && (
            <>
              {extrasLoading && <TableSkeleton rows={4} columns={5} />}
              <div style={{ display: extrasLoading ? 'none' : 'block' }}>
                <table id="extrasTable" className="display" style={{width: '100%'}}></table>
              </div>
            </>
          )}
        </div>
      );
    }

    // ==================== MENU READ-ONLY VIEW (CHEF) ====================

    function MenuReadOnlyView({ user }) {
      const [loading, setLoading] = useState(true);
      const [items, setItems] = useState([]);
      const [activeCategory, setActiveCategory] = useState('ALL');
      const categories = [
  'ALL',
  ...[
    'SOFT DRINK',
    'GIN & VODKA',
    'SWALLOW',
    'BREAKFAST',
    'PROTEIN',
    'CLASSIC PEPPER SOUP',
    'RR KITCHEN NIGERIAN SOUP',
    'SALAD',
    'SHOTS',
    'SIDES (EXTRAS)',
    'KEBAB',
    'MAIN COURSE',
    'RR KITCHEN CHINESE DISH',
    'RR KITCHEN CONTINENTAL DISH - STARTER',
    'WHISKEY',
    'WHITE WINE',
    'SHOT BEVERAGES',
    'MILKSHAKES',
    'TEQUILA',
    'RED WINE',
    'ROSE WINE',
    'NON-ALCOHOLIC DRINK',
    'RR KITCHEN SANDWICH AND BURGER',
    'RR CHICKEN COMBOS',
    'PASTA',
    'RICE DISHES',
    'SPECIAL COCKTAILS',
    'JUICES/SMOOTHIES',
    'BEER',
    'OTHERS',
    'DESSERT',
    'NIGERIAN RICE DISHES',
    'PLATTER',
    'RR GRILLED SECTION',
    'LIGHT MEALS',
    'CLASSIC COCKTAILS',
    'COGNAC',
    'CHAMPAGNE',
  ],
];

      useEffect(() => {
        const load = async () => {
          try {
            const result = await serverCall('getMenuItems', user.id, user.role);
            setLoading(false);
            if (result.success) setItems(result.data.filter(i => i.is_active === 'active'));
            else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          } catch (err) {
            setLoading(false);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load menu' });
          }
        };
        load();
      }, []);

      const filtered = activeCategory === 'ALL' ? items : items.filter(i => i.category === activeCategory);

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-utensils"></i> Menu</h2></div><div className="menu-grid">{[...Array(6)].map((_, i) => <DashboardCardSkeleton key={i} />)}</div></div>;

      return (
        <div className="data-section">
          <div className="section-header"><h2><i className="fas fa-utensils"></i> Menu</h2></div>
          <div className="category-tabs">
            {categories.map(cat => (
              <button key={cat} className={'category-tab' + (activeCategory === cat ? ' active' : '')} onClick={() => setActiveCategory(cat)}>{cat === 'ALL' ? 'All' : cat.charAt(0) + cat.slice(1).toLowerCase()}</button>
            ))}
          </div>
          <div className="menu-grid">
            {filtered.map(item => (
              <div className="menu-card" key={item.item_id}>
                <div className="menu-card-img">
                  {item.image_url ? <img src={item.image_url} alt={item.name} /> : <i className="fas fa-image"></i>}
                </div>
                <div className="menu-card-body">
                  <h4>{item.name}</h4>
                  <p>{item.description}</p>
                  <div className="menu-card-footer">
                    <span className="menu-card-price">{formatPrice(item.price)}</span>
                    <span className={'avail-badge avail-' + (item.availability === 'Instant' ? 'instant' : 'preorder')}>{item.availability}</span>
                  </div>
                  <div style={{marginTop: '8px'}}>
                    <span className={'category-badge cat-' + slugifyCategory(item.category)}>{item.category}</span>
                  </div>
                </div>
              </div>
            ))}
            {filtered.length === 0 && <p style={{color: '#888', padding: '20px'}}>No items in this category.</p>}
          </div>
        </div>
      );
    }

    // ==================== ORDERS VIEW (ADMIN) ====================

    function OrdersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);
      const [viewMode, setViewMode] = useState('kanban');
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [riders, setRiders] = useState([]);
      const tableInstanceRef = useRef(null);

      // New Order Form state
      const [showOrderForm, setShowOrderForm] = useState(false);
      const [menuItemsList, setMenuItemsList] = useState([]);
      const [formItems, setFormItems] = useState([]);
      const [formData, setFormData] = useState({ customer_name: '', phone: '', email: '', type: 'delivery', address: '', city: '', notes: '', payment_method: 'cash' });
      const [posCategory, setPosCategory] = useState('all');
      const [submitting, setSubmitting] = useState(false);
      const [customersList, setCustomersList] = useState([]);
      const [selectedCustomerId, setSelectedCustomerId] = useState('');

      // HTML Confirmation Modal state
      const [confirmAction, setConfirmAction] = useState(null); // { orderId, action, label, icon, color, fromStatus, toStatus }
      const [actionLoading, setActionLoading] = useState(false);
      // Rider assignment modal
      const [assignModal, setAssignModal] = useState(null); // { orderId }
      const [assignRiderId, setAssignRiderId] = useState('');

      useEffect(() => {
        loadOrders();
        loadRiders();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadOrders = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setOrders(result.data);
            if (viewMode === 'table') setTimeout(() => initTable(result.data), 150);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load orders' });
        }
      };

      const loadRiders = async () => {
        try {
          const res = await serverCall('getActiveRiders', user.id, user.role);
          if (res.success) setRiders(res.data);
        } catch(e) {}
      };

      const loadMenuForForm = async () => {
        try {
          const res = await serverCall('getMenuItems', user.id, user.role);
          if (res.success) setMenuItemsList(res.data.filter(i => i.is_active === 'active'));
        } catch(e) {}
      };

      const loadCustomersForForm = async () => {
        try {
          const res = await serverCall('getCustomersList', user.id, user.role);
          if (res.success) setCustomersList(res.data);
        } catch(e) {}
      };

      const handleCustomerSelect = (custId) => {
        setSelectedCustomerId(custId);
        if (!custId) {
          setFormData({ customer_name: '', phone: '', email: '', type: formData.type, address: '', city: '', notes: '', payment_method: 'cash' });
          return;
        }
        const cust = customersList.find(c => String(c.user_id) === String(custId));
        if (cust) {
          setFormData(prev => ({
            ...prev,
            customer_name: cust.name || '',
            phone: cust.phone || '',
            email: cust.email || '',
            address: cust.address || '',
            city: cust.city || ''
          }));
        }
      };

      const openOrderForm = () => {
        setFormData({ customer_name: '', phone: '', email: '', type: 'delivery', address: '', city: '', notes: '', payment_method: 'cash' });
        setFormItems([]);
        setPosCategory('all');
        setSelectedCustomerId('');
        loadMenuForForm();
        loadCustomersForForm();
        setShowOrderForm(true);
      };

      // POS: Add item by clicking card
      const posAddItem = (menuItem) => {
        const existing = formItems.find(fi => fi.item_id === menuItem.item_id);
        if (existing) {
          setFormItems(formItems.map(fi => fi.item_id === menuItem.item_id ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems([...formItems, { item_id: menuItem.item_id, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), total_price: parseFloat(menuItem.price), extras: [] }]);
        }
      };

      // POS: Update qty
      const posUpdateQty = (itemId, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi.item_id !== itemId) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          return { ...fi, qty: newQty, total_price: newQty * fi.unit_price };
        }).filter(Boolean));
      };

      const removeItemFromForm = (itemId) => {
        setFormItems(formItems.filter(fi => fi.item_id !== itemId));
      };

      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge;

      const submitOrder = async () => {
        if (!formData.customer_name.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Customer name is required' }); return; }
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add at least one item to the order' }); return; }

        setSubmitting(true);
        try {
          const payload = {
            customer_name: formData.customer_name.trim(),
            phone: formData.phone.trim(),
            email: formData.email.trim(),
            type: formData.type,
            address: formData.address.trim(),
            city: formData.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            subtotal: formSubtotal,
            delivery_charge: formDeliveryCharge,
            total: formTotal,
            customer_user_id: selectedCustomerId || '',
            payment_method: formData.payment_method
          };
          const res = await serverCall('addOrder', payload, user.id, user.role);
          setSubmitting(false);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Order Created!', text: 'Order ID: ' + res.data.order_id, timer: 2500, showConfirmButton: false });
            setShowOrderForm(false);
            setTimeout(() => loadOrders(), 100);
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch (err) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to create order. Please check all fields.' });
        }
      };

      const initTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#ordersTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            tableInstanceRef.current = $('#ordersTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'order_id', title: 'Order ID', render: (d) => '<strong style="color:#221b18">' + escapeHtml(d) + '</strong>' },
                { data: 'customer_name', title: 'Customer', render: (d) => escapeHtml(d || '-') },
                { data: 'type', title: 'Type', render: (d) => '<span class="type-badge type-' + d.replace('_', '') + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'total', title: 'Total', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'payment_method', title: 'Payment', render: (d) => '<span style="font-size:12px;color:' + ((d || 'cash') === 'paypal' ? '#003087' : '#2e7d32') + '"><i class="' + ((d || 'cash') === 'paypal' ? 'fab fa-paypal' : 'fas fa-money-bill-wave') + '"></i> ' + ((d || 'cash') === 'paypal' ? 'PayPal' : 'Cash') + '</span>' },
                { data: 'status', title: 'Status', render: (d) => '<span class="order-status order-' + d + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'timestamp', title: 'Time', render: (d) => formatDate(d) },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="btn btn-primary btn-sm" data-action="view" style="padding:5px 10px;font-size:12px"><i class="fas fa-eye"></i></button>' }
              ],
              pageLength: 10, responsive: true,
              dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,2,3,4,5,6] } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,2,3,4,5,6] } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,3,4,5,6] } }
              ],
              order: [[0, 'desc']]
            });
            $('#ordersTable').off('click', '[data-action=view]').on('click', '[data-action=view]', function() {
              const $tr = $(this).closest('tr');
              let row = tableInstanceRef.current.row($tr);
              if (!row.data()) { row = tableInstanceRef.current.row($tr.prev('tr')); }
              if (row.data()) setSelectedOrder(row.data());
            });
            // Mobile: tap row to view order detail
            $('#ordersTable tbody').off('click', 'tr').on('click', 'tr', function(e) {
              if ($(e.target).closest('[data-action]').length) return;
              if ($(this).hasClass('child')) return;
              const row = tableInstanceRef.current.row(this);
              if (row.data()) setSelectedOrder(row.data());
            });
          } catch(e) { console.error('DataTable init error:', e); }
        }, 150);
      };

      useEffect(() => {
        if (!loading && orders.length > 0 && viewMode === 'table') initTable(orders);
      }, [viewMode]);

      // --- Flow-wise action helpers ---
      const statusColors = { pending: '#e65100', confirmed: '#1565c0', preparing: '#6a1b9a', ready: '#2e7d32', out_for_delivery: '#00838f', delivered: '#155724', cancelled: '#721c24' };
      const statusLabels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'Out for Delivery', delivered: 'Delivered', cancelled: 'Cancelled' };
      const statusIcons = { pending: 'fa-clock', confirmed: 'fa-check', preparing: 'fa-fire', ready: 'fa-box', out_for_delivery: 'fa-motorcycle', delivered: 'fa-check-double', cancelled: 'fa-times' };

      // Returns array of { action, label, icon, color, toStatus } for a given order
      const getOrderActions = (order) => {
        const actions = [];
        const s = order.status;
        const t = order.type;
        if (s === 'pending') {
          actions.push({ action: 'confirm', label: 'Confirm Order', icon: 'fa-check', color: '#1565c0', toStatus: 'confirmed' });
        }
        if (s === 'confirmed') {
          actions.push({ action: 'prepare', label: 'Start Preparing', icon: 'fa-fire', color: '#6a1b9a', toStatus: 'preparing' });
          if (t === 'delivery' && !order.assigned_rider_id) {
            actions.push({ action: 'assign_rider', label: 'Assign Rider', icon: 'fa-motorcycle', color: '#00838f', toStatus: null });
          }
        }
        if (s === 'preparing') {
          actions.push({ action: 'ready', label: 'Mark Ready', icon: 'fa-box', color: '#2e7d32', toStatus: 'ready' });
        }
        if (s === 'ready') {
          if (t === 'delivery') {
            if (order.assigned_rider_id) {
              actions.push({ action: 'out_for_delivery', label: 'Out for Delivery', icon: 'fa-motorcycle', color: '#00838f', toStatus: 'out_for_delivery' });
            } else {
              actions.push({ action: 'assign_and_deliver', label: 'Assign Rider & Deliver', icon: 'fa-motorcycle', color: '#00838f', toStatus: 'out_for_delivery' });
            }
          } else {
            actions.push({ action: 'deliver', label: 'Mark Delivered', icon: 'fa-check-double', color: '#155724', toStatus: 'delivered' });
          }
        }
        if (s === 'out_for_delivery') {
          actions.push({ action: 'deliver', label: 'Mark Delivered', icon: 'fa-check-double', color: '#155724', toStatus: 'delivered' });
        }
        // Cancel available for all active statuses
        if (['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery'].includes(s)) {
          actions.push({ action: 'cancel', label: 'Cancel Order', icon: 'fa-times', color: '#ea4335', toStatus: 'cancelled' });
        }
        return actions;
      };

      // Open HTML confirm modal for status change
      const openConfirmModal = (orderId, actionObj) => {
        const order = orders.find(o => o.order_id === orderId);
        if (actionObj.action === 'assign_rider') {
          setAssignRiderId('');
          setAssignModal({ orderId, alsoDeliver: false });
          return;
        }
        if (actionObj.action === 'assign_and_deliver') {
          setAssignRiderId('');
          setAssignModal({ orderId, alsoDeliver: true });
          return;
        }
        setConfirmAction({
          orderId,
          action: actionObj.action,
          label: actionObj.label,
          icon: actionObj.icon,
          color: actionObj.color,
          fromStatus: order ? order.status : '',
          toStatus: actionObj.toStatus
        });
      };

      // Execute status change from confirm modal
      const executeStatusChange = async () => {
        if (!confirmAction) return;
        setActionLoading(true);
        try {
          const res = await serverCall('updateOrderStatus', confirmAction.orderId, confirmAction.toStatus, user.id, user.role);
          setActionLoading(false);
          if (res.success) {
            setConfirmAction(null);
            if (selectedOrder && selectedOrder.order_id === confirmAction.orderId) setSelectedOrder(null);
            loadOrders();
            Swal.fire({ icon: 'success', title: 'Updated!', text: res.message, timer: 1500, showConfirmButton: false });
          } else {
            setConfirmAction(null);
            Swal.fire({ icon: 'error', title: 'Error', text: res.message });
          }
        } catch(e) {
          setActionLoading(false);
          setConfirmAction(null);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update status' });
        }
      };

      // Execute rider assignment from assign modal
      const executeAssignRider = async () => {
        if (!assignModal || !assignRiderId) return;
        setActionLoading(true);
        try {
          const fnName = assignModal.alsoDeliver ? 'assignRiderAndDeliver' : 'assignRider';
          const res = await serverCall(fnName, assignModal.orderId, assignRiderId, user.id, user.role);
          setActionLoading(false);
          if (res.success) {
            setAssignModal(null);
            setAssignRiderId('');
            loadOrders();
            Swal.fire({ icon: 'success', title: 'Assigned!', text: res.message, timer: 1500, showConfirmButton: false });
          } else {
            setAssignModal(null);
            Swal.fire({ icon: 'error', title: 'Error', text: res.message });
          }
        } catch(e) {
          setActionLoading(false);
          setAssignModal(null);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to assign rider' });
        }
      };

      // --- Render HTML Confirmation Modal ---
      const renderConfirmModal = () => {
        if (!confirmAction) return null;
        return (
          <div className="confirm-modal-overlay" onClick={() => !actionLoading && setConfirmAction(null)}>
            <div className="confirm-modal" onClick={(e) => e.stopPropagation()}>
              <div className="confirm-modal-icon" style={{background: confirmAction.color + '20', color: confirmAction.color}}>
                <i className={'fas ' + confirmAction.icon} style={{fontSize: '28px'}}></i>
              </div>
              <h3 style={{margin: '16px 0 8px', color: 'var(--navy-primary)', fontSize: '20px', fontFamily: "'Cormorant Garamond', serif"}}>{confirmAction.label}</h3>
              <p style={{color: 'var(--warm-muted)', fontSize: '14px', marginBottom: '16px'}}>
                Are you sure you want to change order <strong>{confirmAction.orderId}</strong> status?
              </p>
              <div className="confirm-modal-flow">
                <span className={'order-status order-' + confirmAction.fromStatus}>{statusLabels[confirmAction.fromStatus]}</span>
                <i className="fas fa-arrow-right" style={{color: '#999'}}></i>
                <span className={'order-status order-' + confirmAction.toStatus}>{statusLabels[confirmAction.toStatus]}</span>
              </div>
              <div className="confirm-modal-actions">
                <button className="btn btn-secondary" onClick={() => setConfirmAction(null)} disabled={actionLoading}>Cancel</button>
                <button className="btn" style={{background: confirmAction.color, color: 'white'}} onClick={executeStatusChange} disabled={actionLoading}>
                  {actionLoading ? <><i className="fas fa-spinner fa-spin"></i> Updating...</> : <><i className={'fas ' + confirmAction.icon}></i> {confirmAction.label}</>}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // --- Render Assign Rider Modal ---
      const renderAssignModal = () => {
        if (!assignModal) return null;
        return (
          <div className="confirm-modal-overlay" onClick={() => !actionLoading && setAssignModal(null)}>
            <div className="confirm-modal" onClick={(e) => e.stopPropagation()}>
              <div className="confirm-modal-icon" style={{background: '#00838f20', color: '#00838f'}}>
                <i className="fas fa-motorcycle" style={{fontSize: '28px'}}></i>
              </div>
              <h3 style={{margin: '16px 0 8px', color: 'var(--navy-primary)', fontSize: '20px', fontFamily: "'Cormorant Garamond', serif"}}>{assignModal.alsoDeliver ? 'Assign Rider & Send for Delivery' : 'Assign Rider'}</h3>
              <p style={{color: 'var(--warm-muted)', fontSize: '14px', marginBottom: '16px'}}>
                Select a rider for order <strong>{assignModal.orderId}</strong>
                {assignModal.alsoDeliver && <><br /><span style={{color: '#00838f'}}>Order will be sent for delivery after assignment</span></>}
              </p>
              <div style={{marginBottom: '20px'}}>
                <select value={assignRiderId} onChange={(e) => setAssignRiderId(e.target.value)} style={{width: '100%', padding: '12px', fontSize: '16px', border: '1px solid rgba(34,27,24,0.12)', borderRadius: '14px'}}>
                  <option value="">-- Select Rider --</option>
                  {riders.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
              <div className="confirm-modal-actions">
                <button className="btn btn-secondary" onClick={() => setAssignModal(null)} disabled={actionLoading}>Cancel</button>
                <button className="btn" style={{background: '#00838f', color: 'white'}} onClick={executeAssignRider} disabled={actionLoading || !assignRiderId}>
                  {actionLoading ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-motorcycle"></i> {assignModal.alsoDeliver ? 'Assign & Deliver' : 'Assign Rider'}</>}
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderKanban = () => {
        const columns = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
        return (
          <div className="kanban-board">
            {columns.map(status => {
              const colOrders = orders.filter(o => o.status === status);
              return (
                <div className="kanban-column" key={status}>
                  <div className="kanban-column-header" style={{background: statusColors[status]}}>
                    <span>{statusLabels[status]}</span>
                    <span className="kanban-count">{colOrders.length}</span>
                  </div>
                  {colOrders.map(order => {
                    const actions = getOrderActions(order);
                    return (
                      <div className="kanban-card" key={order.order_id} style={{borderLeftColor: statusColors[status]}} onClick={() => setSelectedOrder(order)}>
                        <div className="kanban-card-header">
                          <strong>{order.order_id}</strong>
                          <span className={'type-badge type-' + order.type.replace('_', '')}>{order.type.replace('_', ' ')}</span>
                        </div>
                        <p><i className="fas fa-user" style={{marginRight: '6px', color: '#999'}}></i>{order.customer_name}</p>
                        <p><strong>{formatPrice(order.total)}</strong> <span style={{fontSize: '11px', color: order.payment_method === 'paypal' ? '#003087' : '#2e7d32'}}><i className={order.payment_method === 'paypal' ? 'fab fa-paypal' : 'fas fa-money-bill-wave'}></i> {order.payment_method === 'paypal' ? 'PayPal' : 'Cash'}</span></p>
                        {order.assigned_rider_id && <p style={{fontSize: '11px', color: '#00838f'}}><i className="fas fa-motorcycle"></i> Rider assigned</p>}
                        <p style={{fontSize: '11px', color: '#c4b5a5'}}>{getTimeAgo(order.timestamp)}</p>
                        <div className="kanban-card-actions">
                          {actions.map((act, idx) => (
                            <button key={idx} onClick={(e) => { e.stopPropagation(); openConfirmModal(order.order_id, act); }} style={{background: act.color, color: 'white'}}>
                              <i className={'fas ' + act.icon}></i> {act.label.replace('Order', '').replace('Mark ', '').trim()}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                  {colOrders.length === 0 && <p style={{color: '#ccc', textAlign: 'center', padding: '20px', fontSize: '13px'}}>No orders</p>}
                </div>
              );
            })}
          </div>
        );
      };

      // ---- POS ORDER FORM ----
      if (showOrderForm) {
        const categories = ['all', ...new Set(menuItemsList.map(m => m.category))];
        const filteredMenu = posCategory === 'all' ? menuItemsList : menuItemsList.filter(m => m.category === posCategory);
        const cartItemIds = formItems.map(fi => fi.item_id);

        return (
          <div className="data-section">
            <div className="section-header">
              <h2><i className="fas fa-cash-register"></i> New Order (POS)</h2>
              <button className="btn btn-secondary" onClick={() => setShowOrderForm(false)}><i className="fas fa-arrow-left"></i> Back to Orders</button>
            </div>

            {/* Customer Info */}
            <div className="data-section" style={{marginBottom: '20px', padding: '20px', borderLeft: '4px solid var(--navy-primary)'}}>
              <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-user"></i> Customer Information</h3>
              <div className="form-grid">
                <SearchableDropdown
                  label="Select Customer"
                  icon="fas fa-user-check"
                  options={customersList.map(c => ({ value: String(c.user_id), label: c.name + ' (' + c.phone + ')' }))}
                  value={selectedCustomerId}
                  onChange={handleCustomerSelect}
                  placeholder="Search customer or leave empty for manual entry..."
                />
                <div className="form-group">
                  <label><i className="fas fa-user"></i> Customer Name *</label>
                  <input type="text" value={formData.customer_name} onChange={(e) => setFormData({...formData, customer_name: e.target.value})} placeholder="Enter customer name" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-phone"></i> Phone</label>
                  <input type="tel" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} placeholder="Phone number" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-envelope"></i> Email</label>
                  <input type="email" value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} placeholder="Email address" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-tag"></i> Order Type *</label>
                  <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                    <option value="delivery">Delivery</option>
                    <option value="pickup">Pickup</option>
                    <option value="dine_in">Dine In</option>
                  </select>
                </div>
                {formData.type === 'delivery' && (
                  <>
                    <div className="form-group">
                      <label><i className="fas fa-map-marker-alt"></i> Address</label>
                      <input type="text" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} placeholder="Delivery address" />
                    </div>
                    <div className="form-group">
                      <label><i className="fas fa-city"></i> City</label>
                      <input type="text" value={formData.city} onChange={(e) => setFormData({...formData, city: e.target.value})} placeholder="City" />
                    </div>
                  </>
                )}
                <div className="form-group">
                  <label><i className="fas fa-credit-card"></i> Payment Method</label>
                  <select value={formData.payment_method} onChange={(e) => setFormData({...formData, payment_method: e.target.value})}>
                    <option value="cash">Cash</option>
                    <option value="paypal">PayPal</option>
                  </select>
                </div>
                <div className="form-group" style={{gridColumn: '1 / -1'}}>
                  <label><i className="fas fa-sticky-note"></i> Notes</label>
                  <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions (optional)" />
                </div>
              </div>
            </div>

            {/* POS Grid + Cart */}
            <div className="pos-container">
              <div className="pos-grid-section">
                <h3 style={{color: 'var(--navy-primary)', marginBottom: '12px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-utensils"></i> Select Items</h3>
                {/* Category Tabs */}
                <div className="category-tabs" style={{marginBottom: '16px'}}>
                  {categories.map(cat => (
                    <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>
                      {cat === 'all' ? 'All Items' : cat}
                    </button>
                  ))}
                </div>
                {/* Item Grid */}
                <div className="pos-grid">
                  {filteredMenu.map(item => {
                    const inCart = cartItemIds.includes(item.item_id);
                    const cartItem = formItems.find(fi => fi.item_id === item.item_id);
                    return (
                      <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddItem(item)}>
                        {inCart && <span className="pos-item-badge">{cartItem.qty}</span>}
                        {item.image_url ? (
                          <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} />
                        ) : (
                          <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}>
                            <i className="fas fa-utensils" style={{fontSize: '24px'}}></i>
                          </div>
                        )}
                        <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', lineHeight: '1.2'}}>{item.name}</div>
                        <div style={{fontSize: '11px', color: '#888', marginBottom: '4px'}}>{item.item_id}</div>
                        <div style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                        <span className={'avail-badge avail-' + item.availability.toLowerCase()} style={{fontSize: '10px', marginTop: '4px', display: 'inline-block'}}>{item.availability}</span>
                      </div>
                    );
                  })}
                  {filteredMenu.length === 0 && <p style={{color: '#c4b5a5', gridColumn: '1/-1', textAlign: 'center', padding: '30px'}}>No items in this category</p>}
                </div>
              </div>

              {/* Cart Panel */}
              <div className="pos-cart-section">
                <div className="pos-cart">
                  <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>

                  {formItems.length === 0 && (
                    <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                      <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                      <p style={{fontSize: '13px'}}>Click items to add to cart</p>
                    </div>
                  )}

                  {formItems.map(fi => (
                    <div key={fi.item_id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                      <div style={{flex: 1, minWidth: 0}}>
                        <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                        <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                      </div>
                      <div className="pos-qty-controls">
                        <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, -1); }}>-</button>
                        <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                        <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, 1); }}>+</button>
                      </div>
                      <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                      <button type="button" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px', fontSize: '14px'}} onClick={(e) => { e.stopPropagation(); removeItemFromForm(fi.item_id); }}>
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>
                  ))}

                  {formItems.length > 0 && (
                    <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                      <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                      {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                      <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>
                      <button className="btn btn-success" style={{width: '100%', marginTop: '12px', padding: '14px'}} onClick={submitOrder} disabled={submitting || !formData.customer_name.trim()}>
                        {submitting ? <><i className="fas fa-spinner fa-spin"></i> Creating...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-shopping-bag"></i> Orders</h2></div><TableSkeleton rows={5} columns={6} /></div>;

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-shopping-bag"></i> Orders</h2>
            <div style={{display: 'flex', gap: '10px', alignItems: 'center'}}>
              <div className="view-toggle">
                <button className={viewMode === 'kanban' ? 'active' : ''} onClick={() => setViewMode('kanban')}><i className="fas fa-columns"></i> Kanban</button>
                <button className={viewMode === 'table' ? 'active' : ''} onClick={() => setViewMode('table')}><i className="fas fa-table"></i> Table</button>
              </div>
              <button className="btn btn-success" onClick={openOrderForm}><i className="fas fa-plus"></i> New Order</button>
            </div>
          </div>

          {viewMode === 'kanban' && renderKanban()}
          {viewMode === 'table' && (
            <div><table id="ordersTable" className="display" style={{width: '100%'}}></table></div>
          )}

          {/* Order Detail Side Panel */}
          {selectedOrder && (
            <>
              <div className="order-detail-overlay" onClick={() => setSelectedOrder(null)}></div>
              <div className="order-detail-panel">
                <h2>
                  <span><i className="fas fa-receipt"></i> {selectedOrder.order_id}</span>
                  <button className="close-btn" onClick={() => setSelectedOrder(null)}><i className="fas fa-times"></i></button>
                </h2>
                <div className="order-detail-section">
                  <h4>Order Info</h4>

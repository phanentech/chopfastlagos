                  <div className="order-detail-row"><span className="label">Status</span><span className={'order-status order-' + selectedOrder.status}>{statusLabels[selectedOrder.status]}</span></div>
                  <div className="order-detail-row"><span className="label">Type</span><span className={'type-badge type-' + selectedOrder.type.replace('_', '')}>{selectedOrder.type.replace('_', ' ')}</span></div>
                  <div className="order-detail-row"><span className="label">Time</span><span className="value">{formatDate(selectedOrder.timestamp)}</span></div>
                  {selectedOrder.assigned_rider_id && <div className="order-detail-row"><span className="label">Rider</span><span className="value"><i className="fas fa-motorcycle" style={{color: '#00838f'}}></i> Rider #{selectedOrder.assigned_rider_id}</span></div>}
                  <div className="order-detail-row"><span className="label">Payment</span><span className="value"><i className={selectedOrder.payment_method === 'paypal' ? 'fab fa-paypal' : 'fas fa-money-bill-wave'} style={{marginRight: '6px', color: selectedOrder.payment_method === 'paypal' ? '#003087' : '#2e7d32'}}></i>{selectedOrder.payment_method === 'paypal' ? 'PayPal' : 'Cash'}</span></div>
                </div>
                <div className="order-detail-section">
                  <h4>Customer</h4>
                  <div className="order-detail-row"><span className="label">Name</span><span className="value">{selectedOrder.customer_name}</span></div>
                  {selectedOrder.phone && <div className="order-detail-row"><span className="label">Phone</span><span className="value">{selectedOrder.phone}</span></div>}
                  {selectedOrder.email && <div className="order-detail-row"><span className="label">Email</span><span className="value">{selectedOrder.email}</span></div>}
                  {selectedOrder.address && <div className="order-detail-row"><span className="label">Address</span><span className="value">{selectedOrder.address}</span></div>}
                </div>
                <div className="order-detail-section">
                  <h4>Items</h4>
                  <ul className="order-items-list">
                    {(selectedOrder.items || []).map((item, idx) => (
                      <li key={idx}>
                        <div style={{flex: 1}}>
                          <span>{item.qty}x {item.item_name}</span>
                          {item.extras && item.extras.length > 0 && (
                            <div style={{fontSize: '11px', color: 'var(--warm-muted)', marginTop: '2px'}}>
                              {item.extras.map((e, ei) => <span key={ei} style={{marginRight: '6px'}}>+ {e.extra_name} (+{formatPrice(e.extra_price)})</span>)}
                            </div>
                          )}
                        </div>
                        <span>{formatPrice(item.total_price)}</span>
                      </li>
                    ))}
                  </ul>
                  <div className="order-detail-row" style={{marginTop: '8px'}}><span className="label">Subtotal</span><span className="value">{formatPrice(selectedOrder.subtotal)}</span></div>
                  {selectedOrder.delivery_charge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(selectedOrder.delivery_charge)}</span></div>}
                  {parseFloat(selectedOrder.discount) > 0 && <div className="order-detail-row"><span className="label" style={{color: 'var(--success)'}}>Discount {selectedOrder.promo_code ? '(' + selectedOrder.promo_code + ')' : ''}</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(selectedOrder.discount)}</span></div>}
                  <div className="order-total-row"><span>Total</span><span>{formatPrice(selectedOrder.total)}</span></div>
                </div>
                {selectedOrder.notes && (
                  <div className="order-detail-section">
                    <h4>Notes</h4>
                    <p style={{color: '#e65100', background: 'rgba(255,243,224,0.6)', padding: '10px', borderRadius: '14px', fontSize: '14px'}}>{selectedOrder.notes}</p>
                  </div>
                )}
                <div className="order-detail-section">
                  <h4>Actions</h4>
                  <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                    {getOrderActions(selectedOrder).map((act, idx) => (
                      <button key={idx} className="btn btn-sm" style={{background: act.color, color: 'white', border: 'none', minHeight: '40px', padding: '8px 14px', touchAction: 'manipulation'}} onClick={() => openConfirmModal(selectedOrder.order_id, act)}>
                        <i className={'fas ' + act.icon}></i> {act.label}
                      </button>
                    ))}
                    {selectedOrder.status === 'delivered' && <span style={{fontSize: '13px', color: '#155724', fontWeight: '600'}}><i className="fas fa-check-double"></i> Order Completed</span>}
                    {selectedOrder.status === 'cancelled' && <span style={{fontSize: '13px', color: '#721c24', fontWeight: '600'}}><i className="fas fa-ban"></i> Order Cancelled</span>}
                  </div>
                </div>
              </div>
            </>
          )}

          {/* HTML Confirmation Modals */}
          {renderConfirmModal()}
          {renderAssignModal()}
        </div>
      );
    }

    // ==================== KITCHEN VIEW (CHEF) ====================

    function KitchenView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);

      const loadOrders = async () => {
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) setOrders(result.data);
        } catch (err) {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadOrders();
        const interval = setInterval(loadOrders, 15000);
        return () => clearInterval(interval);
      }, []);

      const handleStatusChange = async (orderId, newStatus) => {
        try {
          Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          const res = await serverCall('updateOrderStatus', orderId, newStatus, user.id, user.role);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Updated!', timer: 1200, showConfirmButton: false });
            loadOrders();
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update' }); }
      };

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-fire"></i> Kitchen Orders</h2></div><div className="kitchen-grid">{[...Array(3)].map((_, i) => <DashboardCardSkeleton key={i} />)}</div></div>;

      const confirmed = orders.filter(o => o.status === 'confirmed');
      const preparing = orders.filter(o => o.status === 'preparing');

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-fire"></i> Kitchen Orders</h2>
            <button className="btn btn-primary btn-sm" onClick={loadOrders}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {confirmed.length > 0 && (
            <div style={{marginBottom: '30px'}}>
              <h3 style={{color: '#e65100', marginBottom: '16px', fontSize: '18px'}}><i className="fas fa-bell"></i> New Orders ({confirmed.length})</h3>
              <div className="kitchen-grid">
                {confirmed.map(order => (
                  <div className="kitchen-card" key={order.order_id} style={{borderLeftColor: '#e65100'}}>
                    <div className="kitchen-order-id">{order.order_id}</div>
                    <div className="kitchen-type"><span className={'type-badge type-' + order.type.replace('_', '')}>{order.type.replace('_', ' ')}</span></div>
                    <div className="kitchen-time"><i className="fas fa-clock"></i> {getTimeAgo(order.timestamp)}</div>
                    <ul className="kitchen-items">
                      {(order.items || []).map((item, idx) => (
                        <li key={idx}><span className="qty">{item.qty}x</span> {item.item_name}</li>
                      ))}
                    </ul>
                    {order.notes && <div className="kitchen-notes"><i className="fas fa-sticky-note"></i> {order.notes}</div>}
                    <div className="kitchen-actions">
                      <button className="btn btn-primary" onClick={() => handleStatusChange(order.order_id, 'preparing')}><i className="fas fa-fire"></i> Start Preparing</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {preparing.length > 0 && (
            <div>
              <h3 style={{color: '#6a1b9a', marginBottom: '16px', fontSize: '18px'}}><i className="fas fa-utensils"></i> Preparing ({preparing.length})</h3>
              <div className="kitchen-grid">
                {preparing.map(order => (
                  <div className="kitchen-card" key={order.order_id} style={{borderLeftColor: '#6a1b9a'}}>
                    <div className="kitchen-order-id">{order.order_id}</div>
                    <div className="kitchen-type"><span className={'type-badge type-' + order.type.replace('_', '')}>{order.type.replace('_', ' ')}</span></div>
                    <div className="kitchen-time"><i className="fas fa-clock"></i> {getTimeAgo(order.timestamp)}</div>
                    <ul className="kitchen-items">
                      {(order.items || []).map((item, idx) => (
                        <li key={idx}><span className="qty">{item.qty}x</span> {item.item_name}</li>
                      ))}
                    </ul>
                    {order.notes && <div className="kitchen-notes"><i className="fas fa-sticky-note"></i> {order.notes}</div>}
                    <div className="kitchen-actions">
                      <button className="btn btn-success" onClick={() => handleStatusChange(order.order_id, 'ready')}><i className="fas fa-check"></i> Mark Ready</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {confirmed.length === 0 && preparing.length === 0 && (
            <div style={{textAlign: 'center', padding: '60px 20px', color: '#c4b5a5'}}>
              <i className="fas fa-check-circle" style={{fontSize: '48px', marginBottom: '16px', display: 'block'}}></i>
              <p style={{fontSize: '18px'}}>All caught up! No orders to prepare.</p>
            </div>
          )}
        </div>
      );
    }

    // ==================== DELIVERY VIEW (RIDER) ====================

    function DeliveryView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);

      const loadOrders = async () => {
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) setOrders(result.data);
        } catch (err) {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadOrders();
        const interval = setInterval(loadOrders, 20000);
        return () => clearInterval(interval);
      }, []);

      const handleStatusChange = async (orderId, newStatus) => {
        try {
          Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          const res = await serverCall('updateOrderStatus', orderId, newStatus, user.id, user.role);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Updated!', timer: 1200, showConfirmButton: false });
            loadOrders();
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update' }); }
      };

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-motorcycle"></i> My Deliveries</h2></div><div className="delivery-grid">{[...Array(2)].map((_, i) => <DashboardCardSkeleton key={i} />)}</div></div>;

      const ready = orders.filter(o => o.status === 'ready');
      const outForDelivery = orders.filter(o => o.status === 'out_for_delivery');

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-motorcycle"></i> My Deliveries</h2>
            <button className="btn btn-primary btn-sm" onClick={loadOrders}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {ready.length > 0 && (
            <div style={{marginBottom: '30px'}}>
              <h3 style={{color: '#2e7d32', marginBottom: '16px', fontSize: '18px'}}><i className="fas fa-box"></i> Ready for Pickup ({ready.length})</h3>
              <div className="delivery-grid">
                {ready.map(order => (
                  <div className="delivery-card" key={order.order_id} style={{borderLeftColor: '#2e7d32'}}>
                    <h3>{order.order_id}</h3>
                    <div className="delivery-info">
                      <p><i className="fas fa-user"></i> {order.customer_name}</p>
                      <p><i className="fas fa-map-marker-alt"></i> {order.address || 'No address'}, {order.city}</p>
                    </div>
                    <div className="delivery-contact">
                      {order.phone && <a href={'tel:' + order.phone} className="delivery-phone"><i className="fas fa-phone"></i> Call</a>}
                      {order.address && <a href={'https://www.google.com/maps/search/' + encodeURIComponent(order.address + ', ' + order.city)} target="_blank" className="delivery-map-link"><i className="fas fa-map"></i> Map</a>}
                    </div>
                    <ul className="delivery-items">
                      {(order.items || []).map((item, idx) => (
                        <li key={idx}>{item.qty}x {item.item_name}</li>
                      ))}
                    </ul>
                    {order.notes && <div className="kitchen-notes"><i className="fas fa-sticky-note"></i> {order.notes}</div>}
                    <div className="delivery-actions">
                      <button className="btn btn-primary" onClick={() => handleStatusChange(order.order_id, 'out_for_delivery')}><i className="fas fa-shipping-fast"></i> Picked Up</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {outForDelivery.length > 0 && (
            <div>
              <h3 style={{color: '#00838f', marginBottom: '16px', fontSize: '18px'}}><i className="fas fa-shipping-fast"></i> Out for Delivery ({outForDelivery.length})</h3>
              <div className="delivery-grid">
                {outForDelivery.map(order => (
                  <div className="delivery-card" key={order.order_id} style={{borderLeftColor: '#00838f'}}>
                    <h3>{order.order_id}</h3>
                    <div className="delivery-info">
                      <p><i className="fas fa-user"></i> {order.customer_name}</p>
                      <p><i className="fas fa-map-marker-alt"></i> {order.address || 'No address'}, {order.city}</p>
                    </div>
                    <div className="delivery-contact">
                      {order.phone && <a href={'tel:' + order.phone} className="delivery-phone"><i className="fas fa-phone"></i> Call</a>}
                      {order.address && <a href={'https://www.google.com/maps/search/' + encodeURIComponent(order.address + ', ' + order.city)} target="_blank" className="delivery-map-link"><i className="fas fa-map"></i> Map</a>}
                    </div>
                    <ul className="delivery-items">
                      {(order.items || []).map((item, idx) => (
                        <li key={idx}>{item.qty}x {item.item_name}</li>
                      ))}
                    </ul>
                    <div className="delivery-actions">
                      <button className="btn btn-success" onClick={() => handleStatusChange(order.order_id, 'delivered')}><i className="fas fa-check-double"></i> Delivered</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {ready.length === 0 && outForDelivery.length === 0 && (
            <div style={{textAlign: 'center', padding: '60px 20px', color: '#c4b5a5'}}>
              <i className="fas fa-check-circle" style={{fontSize: '48px', marginBottom: '16px', display: 'block'}}></i>
              <p style={{fontSize: '18px'}}>No deliveries assigned. Relax!</p>
            </div>
          )}
        </div>
      );
    }

    // ==================== LOGS VIEW ====================

    function LogsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [logs, setLogs] = useState([]);
      const tableInstanceRef = useRef(null);
      const [filters, setFilters] = useState({ action: '', username: '' });
      const [uniqueUsers, setUniqueUsers] = useState([]);

      useEffect(() => {
        loadLogs();
        return () => {
          if (tableInstanceRef.current) {
            try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {}
          }
        };
      }, []);

      const loadLogs = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getLogs', user.id, user.role, 200);
          setLoading(false);
          if (result.success) {
            setLogs(result.data);
            const usernames = [...new Set(result.data.map(l => l.username).filter(Boolean))];
            setUniqueUsers(usernames);
            initializeDataTable(result.data);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load logs' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) {
          try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#logsTable').empty(); } catch (e) {}
        }

        setTimeout(() => {
          try {
            const table = $('#logsTable').DataTable({
              data: data,
              destroy: true,
              columns: [
                { data: 'id', title: 'ID' },
                { data: 'username', title: 'User' },
                { data: 'action', title: 'Action', render: (d) => {
                  const cls = 'action-' + d.toLowerCase();
                  return '<span class="action-badge ' + cls + '">' + d + '</span>';
                }},
                { data: 'table_name', title: 'Table' },
                { data: 'record_id', title: 'Record ID', render: (d) => d || '-' },
                { data: 'created_at', title: 'Time', render: (d) => formatDate(d) }
              ],
              pageLength: 10,
              lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
              responsive: true,
              dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV' },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF' },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print' }
              ],
              order: [[0, 'desc']]
            });

            tableInstanceRef.current = table;
          } catch (e) {
            console.error('DataTable init error:', e);
          }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        dt.columns().search('').draw();
        if (filters.action) dt.column(2).search(filters.action).draw(false);
        if (filters.username) dt.column(1).search(filters.username).draw(false);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ action: '', username: '' });
        if (tableInstanceRef.current) { tableInstanceRef.current.columns().search('').draw(); }
      };

      useEffect(() => { if (tableInstanceRef.current && logs.length > 0) applyFilters(); }, [filters]);

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-history"></i> Activity Logs</h2>
            <button className="btn btn-primary" onClick={loadLogs}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-bolt"></i> Action</label>
                  <select value={filters.action} onChange={(e) => setFilters({...filters, action: e.target.value})} className="filter-input">
                    <option value="">All Actions</option>
                    <option value="LOGIN">Login</option>
                    <option value="CREATE">Create</option>
                    <option value="UPDATE">Update</option>
                    <option value="DELETE">Delete</option>
                    <option value="CHANGE_PASSWORD">Change Password</option>
                  </select>
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-user"></i> User</label>
                  <select value={filters.username} onChange={(e) => setFilters({...filters, username: e.target.value})} className="filter-input">
                    <option value="">All Users</option>
                    {uniqueUsers.map((u, idx) => <option key={idx} value={u}>{u}</option>)}
                  </select>
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={8} columns={6} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="logsTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>
      );
    }

    // ==================== ACCOUNT VIEW ====================

    function AccountView({ user }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [saving, setSaving] = useState(false);
      const [contact, setContact] = useState('');
      const [savingProfile, setSavingProfile] = useState(false);

      // Currency settings (admin only)
      const [currencySymbol, setCurrencySymbol] = useState(APP_CURRENCY);
      const [savingCurrency, setSavingCurrency] = useState(false);
      const currencyOptions = [
        { value: '€', label: '€ - Euro' },
        { value: '$', label: '$ - Dollar' },
        { value: '£', label: '£ - Pound' },
        { value: '₦', label: '₦ - Naira' },
        { value: 'Rs.', label: 'Rs. - Rupee' },
        { value: '¥', label: '¥ - Yen' },
        { value: 'LKR ', label: 'LKR - Sri Lankan Rupee' },
        { value: 'AED ', label: 'AED - Dirham' },
        { value: 'RM ', label: 'RM - Ringgit' }
      ];

      const handleSaveCurrency = async () => {
        setSavingCurrency(true);
        try {
          const result = await serverCall('updateAppSettings', 'currency_symbol', currencySymbol, user.id, user.role);
          setSavingCurrency(false);
          if (result.success) {
            APP_CURRENCY = currencySymbol;
            try { localStorage.setItem('food_app_currency', currencySymbol); } catch(e) {}
            Swal.fire({ icon: 'success', title: 'Currency Updated!', text: 'Currency symbol changed to ' + currencySymbol, timer: 2000, showConfirmButton: false });
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setSavingCurrency(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update currency' });
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();

        if (!currentPassword || !newPassword || !confirmPassword) {
          Swal.fire({ icon: 'warning', title: 'Missing Fields', text: 'All fields are required' });
          return;
        }
        if (newPassword.length < 6) {
          Swal.fire({ icon: 'warning', title: 'Too Short', text: 'New password must be at least 6 characters' });
          return;
        }
        if (newPassword !== confirmPassword) {
          Swal.fire({ icon: 'warning', title: 'Mismatch', text: 'New password and confirm password do not match' });
          return;
        }

        setSaving(true);
        try {
          const result = await serverCall('changePassword', user.id, currentPassword, newPassword);
          setSaving(false);
          if (result.success) {
            Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
            setCurrentPassword('');
            setNewPassword('');
            setConfirmPassword('');
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setSaving(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to change password' });
        }
      };

      const handleUpdateContact = async (e) => {
        e.preventDefault();
        setSavingProfile(true);
        try {
          const result = await serverCall('updateOwnProfile', user.id, contact);
          setSavingProfile(false);
          if (result.success) {
            Swal.fire({ icon: 'success', title: 'Updated!', text: result.message, timer: 2000, showConfirmButton: false });
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setSavingProfile(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update profile' });
        }
      };

      return (
        <div className="account-section">
          <div className="account-card">
            <h2><i className="fas fa-user-circle"></i> My Account</h2>
            <div style={{marginBottom: '25px', padding: '15px', background: 'rgba(255,248,239,0.6)', borderRadius: '18px'}}>
              <p style={{marginBottom: '8px'}}><strong>Name:</strong> {user.name}</p>
              <p style={{marginBottom: '8px'}}><strong>Username:</strong> {user.username}</p>
              <p><strong>Role:</strong> <span className={'role-badge role-' + user.role}>{user.role.charAt(0).toUpperCase() + user.role.slice(1)}</span></p>
            </div>

            {(user.role === 'chef' || user.role === 'rider') && (
              <>
                <h2><i className="fas fa-phone"></i> Update Contact</h2>
                <form onSubmit={handleUpdateContact} style={{marginBottom: '25px'}}>
                  <div className="form-group">
                    <label>Phone Number</label>
                    <input type="tel" value={contact} onChange={(e) => setContact(e.target.value)} placeholder="Enter phone number" />
                  </div>
                  <button type="submit" className="btn btn-primary" disabled={savingProfile}>
                    {savingProfile ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Update Contact</>}
                  </button>
                </form>
              </>
            )}

            {user.role === 'admin' && (
              <>
                <h2><i className="fas fa-coins"></i> Currency Settings</h2>
                <div style={{marginBottom: '25px'}}>
                  <div className="form-group">
                    <label>Currency Symbol</label>
                    <select value={currencySymbol} onChange={(e) => setCurrencySymbol(e.target.value)}>
                      {currencyOptions.map(opt => (
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                      ))}
                    </select>
                  </div>
                  <div style={{padding: '12px 16px', background: 'rgba(181,77,45,0.08)', borderRadius: '14px', marginBottom: '15px', fontSize: '14px', color: 'var(--navy-primary)', display: 'flex', alignItems: 'center', gap: '8px'}}>
                    <i className="fas fa-eye" style={{color: 'var(--navy-accent)'}}></i>
                    <span><strong>Preview:</strong> {currencySymbol}1,250</span>
                  </div>
                  <button className="btn btn-primary" onClick={handleSaveCurrency} disabled={savingCurrency}>
                    {savingCurrency ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save Currency</>}
                  </button>
                </div>
              </>
            )}

            <h2><i className="fas fa-key"></i> Change Password</h2>
            <form onSubmit={handleChangePassword}>
              <div className="form-group">
                <label>Current Password</label>
                <input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} placeholder="Enter current password" required />
              </div>
              <div className="form-group">
                <label>New Password</label>
                <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Min 6 characters" required />
              </div>
              <div className="form-group">
                <label>Confirm New Password</label>
                <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} placeholder="Repeat new password" required />
              </div>
              <button type="submit" className="btn btn-primary" disabled={saving}>
                {saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Change Password</>}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== REPORTS VIEW ====================

    function ReportsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);
      const tableInstanceRef = useRef(null);
      const [filters, setFilters] = useState({ dateFrom: '', dateTo: '', status: '', type: '', customer: '', city: '' });
      const [uniqueCustomers, setUniqueCustomers] = useState([]);
      const [uniqueCities, setUniqueCities] = useState([]);

      useEffect(() => {
        loadReportData();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadReportData = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setOrders(result.data);
            const customers = [...new Set(result.data.map(o => o.customer_name).filter(Boolean))].sort();
            setUniqueCustomers(customers);
            const cities = [...new Set(result.data.map(o => o.city).filter(Boolean))].sort();
            setUniqueCities(cities);
            initReportTable(result.data);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load report data' });
        }
      };

      const initReportTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#reportTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            tableInstanceRef.current = $('#reportTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'order_id', title: 'Order ID', render: (d) => '<strong style="color:#221b18">' + escapeHtml(d) + '</strong>' },
                { data: 'customer_name', title: 'Customer', render: (d) => escapeHtml(d || '-') },
                { data: 'phone', title: 'Phone', render: (d) => escapeHtml(d || '-') },
                { data: 'type', title: 'Type', render: (d) => '<span class="type-badge type-' + d.replace('_', '') + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'city', title: 'City', render: (d) => escapeHtml(d || '-') },
                { data: 'subtotal', title: 'Subtotal', render: (d) => formatPrice(d) },
                { data: 'delivery_charge', title: 'Delivery', render: (d) => formatPrice(d) },
                { data: 'total', title: 'Total', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'status', title: 'Status', render: (d) => '<span class="order-status order-' + d + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'timestamp', title: 'Date', render: (d) => formatDate(d) }
              ],
              pageLength: 10,
              lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
              responsive: true,
              dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':visible' } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':visible' } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':visible' } }
              ],
              order: [[0, 'desc']]
            });
          } catch (e) { console.error('Report DataTable init error:', e); }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;

        // Clear previous custom filters
        while ($.fn.dataTable.ext.search.length > 0) $.fn.dataTable.ext.search.pop();
        dt.columns().search('');

        // Date range filter
        $.fn.dataTable.ext.search.push(function(settings, searchData, dataIndex) {
          if (settings.nTable.id !== 'reportTable') return true;
          const order = orders[dataIndex];
          if (!order) return true;
          const orderDate = new Date(order.timestamp);
          if (filters.dateFrom) { const from = new Date(filters.dateFrom); if (orderDate < from) return false; }
          if (filters.dateTo) { const to = new Date(filters.dateTo + 'T23:59:59'); if (orderDate > to) return false; }
          if (filters.customer && order.customer_name !== filters.customer) return false;
          if (filters.city && order.city !== filters.city) return false;
          return true;
        });

        // Column search for status and type
        if (filters.status) dt.column(8).search('^' + filters.status.replace('_', ' ') + '$', true, false);
        if (filters.type) dt.column(3).search('^' + filters.type.replace('_', ' ') + '$', true, false);

        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ dateFrom: '', dateTo: '', status: '', type: '', customer: '', city: '' });
        if (tableInstanceRef.current) {
          while ($.fn.dataTable.ext.search.length > 0) $.fn.dataTable.ext.search.pop();
          tableInstanceRef.current.columns().search('').draw();
        }
      };

      useEffect(() => { if (tableInstanceRef.current && orders.length > 0) applyFilters(); }, [filters]);

      // Build summary stats from currently visible (filtered) data
      const getFilteredOrders = () => {
        let filtered = [...orders];
        if (filters.dateFrom) { const from = new Date(filters.dateFrom); filtered = filtered.filter(o => new Date(o.timestamp) >= from); }
        if (filters.dateTo) { const to = new Date(filters.dateTo + 'T23:59:59'); filtered = filtered.filter(o => new Date(o.timestamp) <= to); }
        if (filters.status) filtered = filtered.filter(o => o.status === filters.status);
        if (filters.type) filtered = filtered.filter(o => o.type === filters.type);
        if (filters.customer) filtered = filtered.filter(o => o.customer_name === filters.customer);
        if (filters.city) filtered = filtered.filter(o => o.city === filters.city);
        return filtered;
      };

      const filteredOrders = orders.length > 0 ? getFilteredOrders() : [];
      const totalOrders = filteredOrders.length;
      const totalRevenue = filteredOrders.reduce((s, o) => s + parseFloat(o.total || 0), 0);
      const deliveredCount = filteredOrders.filter(o => o.status === 'delivered').length;
      const cancelledCount = filteredOrders.filter(o => o.status === 'cancelled').length;

      const statusOptions = [
        { value: 'pending', label: 'Pending' },
        { value: 'confirmed', label: 'Confirmed' },
        { value: 'preparing', label: 'Preparing' },
        { value: 'ready', label: 'Ready' },
        { value: 'out_for_delivery', label: 'Out for Delivery' },
        { value: 'delivered', label: 'Delivered' },
        { value: 'cancelled', label: 'Cancelled' }
      ];

      const typeOptions = [
        { value: 'delivery', label: 'Delivery' },
        { value: 'pickup', label: 'Pickup' },
        { value: 'dine_in', label: 'Dine In' }
      ];

      const customerOptions = uniqueCustomers.map(c => ({ value: c, label: c }));
      const cityOptions = uniqueCities.map(c => ({ value: c, label: c }));

      return (
        <div>
          {/* Summary Cards */}
          {!loading && (
            <div className="dashboard-grid-4" style={{marginBottom: '20px'}}>

                <div className="stat-card-icon"><i className="fas fa-shopping-bag"></i></div>
                <div className="stat-card-value">{totalOrders}</div>
                <div className="stat-card-label">Total Orders</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #34a853 0%, #2d8f47 100%)'}}><i className="fas fa-money-bill-wave"></i></div>
                <div className="stat-card-value">{formatPrice(totalRevenue)}</div>
                <div className="stat-card-label">Total Revenue</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #b54d2d 0%, #d8733f 100%)'}}><i className="fas fa-check-double"></i></div>
                <div className="stat-card-value">{deliveredCount}</div>
                <div className="stat-card-label">Delivered</div>
              </div>
              <div className="stat-card">
                <div className="stat-card-icon" style={{background: 'linear-gradient(135deg, #ea4335 0%, #c62828 100%)'}}><i className="fas fa-times-circle"></i></div>
                <div className="stat-card-value">{cancelledCount}</div>
                <div className="stat-card-label">Cancelled</div>
              </div>
            </div>
          )}

          <div className="data-section">
            <div className="section-header">
              <h2><i className="fas fa-file-alt"></i> Order Reports</h2>
              <button className="btn btn-primary btn-sm" onClick={loadReportData}><i className="fas fa-sync-alt"></i> Refresh</button>
            </div>

            {/* Filters */}
            {!loading && (
              <div className="filters-section">
                <div className="filters-header">
                  <h3><i className="fas fa-filter"></i> Filters</h3>
                  <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
                </div>
                <div className="filters-grid">
                  <div className="filter-group">
                    <label><i className="fas fa-calendar-alt"></i> Date From</label>
                    <input type="date" value={filters.dateFrom} onChange={(e) => setFilters({...filters, dateFrom: e.target.value})} className="filter-input" />
                  </div>
                  <div className="filter-group">
                    <label><i className="fas fa-calendar-alt"></i> Date To</label>
                    <input type="date" value={filters.dateTo} onChange={(e) => setFilters({...filters, dateTo: e.target.value})} className="filter-input" />
                  </div>
                  <SearchableDropdown
                    label="Status"
                    icon="fas fa-info-circle"
                    options={statusOptions}
                    value={filters.status}
                    onChange={(val) => setFilters({...filters, status: val})}
                    placeholder="All Status"
                  />
                  <SearchableDropdown
                    label="Order Type"
                    icon="fas fa-tag"
                    options={typeOptions}
                    value={filters.type}
                    onChange={(val) => setFilters({...filters, type: val})}
                    placeholder="All Types"
                  />
                  <SearchableDropdown
                    label="Customer"
                    icon="fas fa-user"
                    options={customerOptions}
                    value={filters.customer}
                    onChange={(val) => setFilters({...filters, customer: val})}
                    placeholder="All Customers"
                  />
                  <SearchableDropdown
                    label="City"
                    icon="fas fa-city"
                    options={cityOptions}
                    value={filters.city}
                    onChange={(val) => setFilters({...filters, city: val})}
                    placeholder="All Cities"
                  />
                </div>
              </div>
            )}

            {/* Table */}
            {loading && <TableSkeleton rows={8} columns={8} />}
            <div style={{ display: loading ? 'none' : 'block' }}>
              <table id="reportTable" className="display" style={{width: '100%'}}></table>
            </div>
          </div>
        </div>
      );
    }

    // ==================== TRACK ORDER PAGE ====================

    function TrackOrderPage({ onBack }) {
      const [orderId, setOrderId] = useState('');
      const [trackData, setTrackData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const allStatuses = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
      const statusLabels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'Out for Delivery', delivered: 'Delivered' };
      const statusIcons = { pending: 'fa-clock', confirmed: 'fa-check', preparing: 'fa-fire', ready: 'fa-box', out_for_delivery: 'fa-motorcycle', delivered: 'fa-check-double' };

      const handleTrack = async () => {
        if (!orderId.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter an Order ID', confirmButtonColor: '#b54d2d' }); return; }
        setLoading(true);
        setError('');
        setTrackData(null);
        try {
          const res = await serverCall('trackOrder', orderId.trim());
          setLoading(false);
          if (res.success) {
            setTrackData(res.data);
          } else {
            setError(res.message || 'Order not found');
          }
        } catch (e) {
          setLoading(false);
          setError('Failed to track order. Please try again.');
        }
      };

      const getSteps = () => {
        if (!trackData) return [];
        const orderType = trackData.type || 'delivery';
        let steps = [...allStatuses];
        if (orderType === 'pickup' || orderType === 'dine_in') {
          steps = steps.filter(s => s !== 'out_for_delivery');
        }
        return steps;
      };

      const getStepState = (step, steps) => {
        if (!trackData) return 'pending';
        if (trackData.status === 'cancelled') return 'pending';
        const currentIdx = steps.indexOf(trackData.status);
        const stepIdx = steps.indexOf(step);
        if (stepIdx < currentIdx) return 'completed';
        if (stepIdx === currentIdx) return 'active';
        return 'pending';
      };

      return (
        <div className="track-page">
          <div className="track-card">
            <div className="track-card-header">
              <i className="fas fa-search-location" style={{fontSize: '48px', marginBottom: '12px'}}></i>
              <h2>Track Your Order</h2>
              <p>Enter your order ID to see real-time status</p>
            </div>
            <div className="track-card-body">
              <div className="track-input-group">
                <input
                  type="text"
                  placeholder="Enter Order ID (e.g. ORD001)"
                  value={orderId}
                  onChange={(e) => setOrderId(e.target.value)}
                  onKeyPress={(e) => e.key === 'Enter' && handleTrack()}
                />
                <button onClick={handleTrack} disabled={loading}>
                  {loading ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-search"></i> Track</>}
                </button>
              </div>

              {error && (
                <div style={{background: 'rgba(234,67,53,0.1)', color: '#ea4335', padding: '14px 18px', borderRadius: '14px', marginBottom: '20px', fontWeight: '600', display: 'flex', alignItems: 'center', gap: '10px'}}>
                  <i className="fas fa-exclamation-circle"></i> {error}
                </div>
              )}

              {trackData && (
                <div style={{animation: 'fadeInUp 0.4s ease'}}>
                  {/* Order Info */}
                  <div style={{background: 'rgba(255,248,239,0.6)', borderRadius: '18px', padding: '16px', marginBottom: '20px'}}>
                    <div className="order-detail-row"><span className="label">Order ID</span><span className="value" style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '16px'}}>{trackData.order_id}</span></div>
                    <div className="order-detail-row"><span className="label">Customer</span><span className="value">{trackData.customer_name}</span></div>
                    <div className="order-detail-row"><span className="label">Type</span><span className={'type-badge type-' + (trackData.type || 'delivery').replace('_', '')}>{(trackData.type || 'delivery').replace('_', ' ')}</span></div>
                    <div className="order-detail-row"><span className="label">Status</span><span className={'order-status order-' + trackData.status}>{trackData.status.replace('_', ' ')}</span></div>
                    <div className="order-detail-row"><span className="label">Ordered</span><span className="value">{formatDate(trackData.timestamp)}</span></div>
                  </div>

                  {/* Status Timeline */}
                  {trackData.status === 'cancelled' ? (
                    <div style={{textAlign: 'center', padding: '20px', background: 'rgba(234,67,53,0.08)', borderRadius: '18px', marginBottom: '20px'}}>
                      <i className="fas fa-ban" style={{fontSize: '32px', color: '#ea4335', marginBottom: '8px'}}></i>
                      <p style={{color: '#ea4335', fontWeight: '700', fontSize: '16px'}}>Order Cancelled</p>
                    </div>
                  ) : (
                    <div className="track-timeline">
                      <h4 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontFamily: 'Cormorant Garamond, serif', fontSize: '18px'}}><i className="fas fa-route"></i> Order Progress</h4>
                      {getSteps().map(step => {
                        const state = getStepState(step, getSteps());
                        return (
                          <div key={step} className={'track-step ' + state}>
                            <div className="track-step-circle">
                              <i className={'fas ' + (state === 'completed' ? 'fa-check' : statusIcons[step])}></i>
                            </div>
                            <div className="track-step-info">
                              <strong>{statusLabels[step]}</strong>
                              <span>{state === 'completed' ? 'Completed' : state === 'active' ? 'Current status' : 'Upcoming'}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* Items List */}
                  {trackData.items && trackData.items.length > 0 && (
                    <div style={{marginBottom: '20px'}}>
                      <h4 style={{color: 'var(--navy-primary)', marginBottom: '12px'}}><i className="fas fa-shopping-bag"></i> Order Items</h4>
                      <div className="about-table-wrapper">
                        <table className="about-roles-table" style={{fontSize: '13px'}}>
                          <thead><tr><th style={{textAlign: 'left'}}>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                          <tbody>
                            {trackData.items.map((it, idx) => (
                              <tr key={idx}>
                                <td style={{textAlign: 'left', fontWeight: 500}}>
                                  {it.item_name}
                                  {it.extras && it.extras.length > 0 && (
                                    <div style={{fontSize: '11px', color: 'var(--warm-muted)', marginTop: '4px'}}>
                                      {it.extras.map((ex, eidx) => (
                                        <div key={eidx}>+ {ex.extra_name} (+{formatPrice(ex.extra_price)})</div>
                                      ))}
                                    </div>
                                  )}
                                </td>
                                <td>{it.qty}</td>
                                <td>{formatPrice(it.unit_price)}</td>
                                <td><strong>{formatPrice(it.total_price)}</strong></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* Totals */}
                  <div style={{marginTop: '16px'}}>
                    <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(trackData.subtotal)}</span></div>
                    {trackData.delivery_charge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(trackData.delivery_charge)}</span></div>}
                    {trackData.discount > 0 && <div className="order-detail-row"><span className="label">Discount</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(trackData.discount)}</span></div>}
                    <div className="order-total-row"><span>Total</span><span>{formatPrice(trackData.total)}</span></div>
                  </div>
                </div>
              )}

              <button className="btn btn-primary" style={{width: '100%', marginTop: '20px', padding: '14px'}} onClick={onBack}>
                <i className="fas fa-home"></i> Back to Home
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== PROMO CODES VIEW (ADMIN) ====================

    function PromoCodesView({ user }) {
      const [loading, setLoading] = useState(true);
      const [promos, setPromos] = useState([]);
      const tableInstanceRef = useRef(null);

      useEffect(() => {
        loadPromos();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadPromos = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getPromoCodes', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setPromos(result.data);
            initializeDataTable(result.data);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message, confirmButtonColor: '#b54d2d' });
          }
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load promo codes', confirmButtonColor: '#b54d2d' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#promosTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            const table = $('#promosTable').DataTable({
              data: data,
              destroy: true,
              columns: [
                { data: 'promo_id', title: 'ID' },
                { data: 'code', title: 'Code', render: (d) => '<strong style="color:var(--navy-primary);letter-spacing:1px">' + escapeHtml(d) + '</strong>' },
                { data: 'discount_type', title: 'Type', render: (d) => '<span class="category-badge ' + (d === 'percent' ? 'cat-snack' : 'cat-rice') + '">' + (d === 'percent' ? 'Percent' : 'Fixed') + '</span>' },
                { data: 'discount_value', title: 'Value', render: (d, t, row) => row.discount_type === 'percent' ? d + '%' : formatPrice(d) },
                { data: 'min_order', title: 'Min Order', render: (d) => d ? formatPrice(d) : '-' },
                { data: 'max_uses', title: 'Max Uses', render: (d) => d || 'Unlimited' },
                { data: 'used_count', title: 'Used', render: (d) => d || 0 },
                { data: 'expiry_date', title: 'Expiry', render: (d) => d ? formatDate(d) : 'No expiry' },
                { data: 'is_active', title: 'Status', render: (d, t, row) => '<label class="toggle-switch"><input type="checkbox" ' + (d === 'active' ? 'checked' : '') + ' data-id="' + escapeHtml(row.promo_id) + '" class="toggle-promo" /><span class="toggle-slider"></span></label>' },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>' }
              ],
              pageLength: 10,
              responsive: true,
              dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,2,3,4,5,6,7,8] } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,2,3,4,5,6,7,8] } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,3,4,5,6,7,8] } }
              ],
              order: [[0, 'desc']]
            });

            $('#promosTable').off('click', '.action-icon').on('click', '.action-icon', function() {

              if (action === 'edit') handleEditPromo(rowData);
              else handleDeletePromo(rowData);
            });

            $('#promosTable').off('change', '.toggle-promo').on('change', '.toggle-promo', async function() {
              const promoId = $(this).data('id');
              const newStatus = this.checked ? 'active' : 'inactive';
              const el = this;
              try {
                const promoData = promos.find(p => String(p.promo_id) === String(promoId));
                if (promoData) {
                  const res = await serverCall('updatePromoCode', { ...promoData, is_active: newStatus }, user.id, user.role);

                }
              } catch(e) { el.checked = !el.checked; }
            });

            tableInstanceRef.current = table;
          } catch(e) { console.error('DataTable init error:', e); }
        }, 150);
      };

      const handleAddPromo = () => {

            '<div class="form-group"><label>Code *</label><input type="text" id="swal-code" placeholder="e.g. SAVE20" style="text-transform:uppercase"></div>' +

            '<div class="form-group"><label>Discount Value *</label><input type="number" id="swal-dvalue" placeholder="e.g. 20" min="0" step="1"></div>' +
            '<div class="form-group"><label>Min Order</label><input type="number" id="swal-minorder" placeholder="Minimum order amount" min="0" step="1"></div>' +
            '<div class="form-group"><label>Max Uses</label><input type="number" id="swal-maxuses" placeholder="Leave blank for unlimited" min="0" step="1"></div>' +
            '<div class="form-group"><label>Expiry Date</label><input type="date" id="swal-expiry"></div>' +

          showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          preConfirm: () => {
            const code = document.getElementById('swal-code').value.trim().toUpperCase();
            const discount_value = document.getElementById('swal-dvalue').value;
            if (!code || !discount_value) { Swal.showValidationMessage('Code and discount value are required'); return false; }
            return {
              code,
              discount_type: document.getElementById('swal-dtype').value,
              discount_value: parseFloat(discount_value),
              min_order: parseFloat(document.getElementById('swal-minorder').value) || 0,
              max_uses: parseInt(document.getElementById('swal-maxuses').value) || 0,
              expiry_date: document.getElementById('swal-expiry').value || '',
              is_active: 'active'

          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Saving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('addPromoCode', result.value, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
                setTimeout(() => loadPromos(), 100);
              } else { Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' }); }
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to add promo code', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      const handleEditPromo = (promoData) => {
        Swal.fire({
          title: '<i class="fas fa-edit" style="color:#221b18"></i> Edit Promo Code',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Code *</label><input type="text" id="swal-code" value="' + escapeHtml(promoData.code) + '" style="text-transform:uppercase"></div>' +
            '<div class="form-group"><label>Discount Type *</label><select id="swal-dtype"><option value="percent">Percent (%)</option><option value="fixed">Fixed Amount</option></select></div>' +
            '<div class="form-group"><label>Discount Value *</label><input type="number" id="swal-dvalue" value="' + promoData.discount_value + '" min="0" step="1"></div>' +
            '<div class="form-group"><label>Min Order</label><input type="number" id="swal-minorder" value="' + (promoData.min_order || '') + '" min="0" step="1"></div>' +
            '<div class="form-group"><label>Max Uses</label><input type="number" id="swal-maxuses" value="' + (promoData.max_uses || '') + '" min="0" step="1"></div>' +
            '<div class="form-group"><label>Expiry Date</label><input type="date" id="swal-expiry" value="' + (promoData.expiry_date ? promoData.expiry_date.substring(0, 10) : '') + '"></div>' +
            '</div></div>',
          width: 600,
          showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Update',
          confirmButtonColor: '#b54d2d',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          didOpen: () => {
            document.getElementById('swal-dtype').value = promoData.discount_type;
          },
          preConfirm: () => {
            const code = document.getElementById('swal-code').value.trim().toUpperCase();
            const discount_value = document.getElementById('swal-dvalue').value;
            if (!code || !discount_value) { Swal.showValidationMessage('Code and discount value are required'); return false; }
            return {
              promo_id: promoData.promo_id,
              code,
              discount_type: document.getElementById('swal-dtype').value,
              discount_value: parseFloat(discount_value),
              min_order: parseFloat(document.getElementById('swal-minorder').value) || 0,
              max_uses: parseInt(document.getElementById('swal-maxuses').value) || 0,
              expiry_date: document.getElementById('swal-expiry').value || '',
              is_active: promoData.is_active
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('updatePromoCode', result.value, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
                setTimeout(() => loadPromos(), 100);
              } else { Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' }); }
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update promo code', confirmButtonColor: '#b54d2d' }); }

      const handleDeletePromo = (promoData) => {
        Swal.fire({
          icon: 'warning',
          title: 'Delete Promo Code?',
          text: 'Are you sure you want to delete "' + promoData.code + '"?',
          showCancelButton: true,
          confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-trash"></i> Delete',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel'
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Deleting...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('deletePromoCode', promoData.promo_id, user.id, user.role);
              if (res.success) {
                Swal.fire({ icon: 'success', title: 'Deleted!', text: res.message, timer: 2000, showConfirmButton: false });

              } else { Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' }); }
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to delete promo code', confirmButtonColor: '#b54d2d' }); }

        });

      return (
        <div className="data-section">

            <h2><i className="fas fa-tags"></i> Promo Codes</h2>
            <button className="btn btn-success" onClick={handleAddPromo}><i className="fas fa-plus"></i> Add Promo</button>
          </div>
          {loading && <TableSkeleton rows={5} columns={8} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="promosTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>
      );
    }

    // ==================== COMBOS VIEW (ADMIN) ====================

    function CombosView({ user }) {
      const [loading, setLoading] = useState(true);
      const [combos, setCombos] = useState([]);
      const [menuItems, setMenuItems] = useState([]);
      const tableRef = useRef(null);

      useEffect(() => {
        loadCombos();
        return () => { if (tableRef.current) { try { tableRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadCombos = async () => {
        setLoading(true);
        try {
          const [comboRes, menuRes] = await Promise.all([
            serverCall('getCombos', user.id, user.role),
            serverCall('getMenuItems', user.id, user.role)
          ]);
          setLoading(false);
          if (comboRes.success) { setCombos(comboRes.data); initTable(comboRes.data); }
          if (menuRes.success) setMenuItems(menuRes.data.filter(m => m.is_active === 'active'));
        } catch (e) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load combos' });
        }
      };

      const initTable = (data) => {
        if (tableRef.current) { try { tableRef.current.destroy(); $('#combosTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            const table = $('#combosTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'combo_id', title: 'ID' },
                { data: 'name', title: 'Name', render: (d) => '<strong>' + escapeHtml(d) + '</strong>' },
                { data: 'items', title: 'Items', render: (d) => d.map(it => '<span class="hp-combo-item-pill" style="display:inline-block;margin:2px">' + (it.qty || 1) + 'x ' + escapeHtml(it.item_name || it.item_id) + '</span>').join('') },
                { data: 'original_price', title: 'Original', render: (d) => '<span style="text-decoration:line-through;color:#999">' + formatPrice(d) + '</span>' },
                { data: 'combo_price', title: 'Combo Price', render: (d) => '<strong style="color:var(--navy-accent)">' + formatPrice(d) + '</strong>' },
                { data: 'savings_percent', title: 'Savings', render: (d) => '<span class="stock-badge stock-ok">' + d + '%</span>' },
                { data: 'is_active', title: 'Active', render: (d) => '<span class="status-badge ' + (d === 'active' ? 'status-active' : 'status-inactive') + '">' + (d === 'active' ? 'Active' : 'Inactive') + '</span>' },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>' }
              ],
              pageLength: 10, responsive: true, dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,3,4,5,6] } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,3,4,5,6] } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,3,4,5,6] } }
              ],
              order: [[0, 'asc']]
            });
            $('#combosTable').off('click', '.action-icon').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              let $tr = $(this).closest('tr');
              if ($tr.hasClass('child')) $tr = $tr.prev('tr');
              const rowData = table.row($tr).data();
              if (!rowData) return;
              if (action === 'edit') handleEditCombo(rowData);
              else handleDeleteCombo(rowData);
            });
            tableRef.current = table;
          } catch(e) { console.error('Combo DataTable error:', e); }
        }, 150);
      };

      const buildItemPickerHtml = (selectedItems) => {
        const selMap = {};
        (selectedItems || []).forEach(si => { selMap[si.item_id] = si.qty || 1; });
        return '<div style="max-height:250px;overflow-y:auto;border:1px solid rgba(34,27,24,0.1);border-radius:12px;padding:8px">' +
          menuItems.map(mi => {
            const checked = selMap[mi.item_id] ? 'checked' : '';
            const qty = selMap[mi.item_id] || 1;
            return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid rgba(34,27,24,0.04)">' +
              '<input type="checkbox" class="combo-item-check" data-id="' + escapeHtml(mi.item_id) + '" ' + checked + ' style="width:16px;height:16px" />' +
              '<span style="flex:1;font-size:13px">' + escapeHtml(mi.name) + ' (' + formatPrice(mi.price) + ')</span>' +
              '<input type="number" class="combo-item-qty" data-id="' + escapeHtml(mi.item_id) + '" value="' + qty + '" min="1" max="20" style="width:50px;padding:4px;border:1px solid #ddd;border-radius:6px;text-align:center;font-size:12px" />' +
            '</div>';
          }).join('') + '</div>';
      };

      const handleAddCombo = () => {
        Swal.fire({
          title: '<i class="fas fa-layer-group" style="color:#221b18"></i> Add Combo',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Combo ID *</label><input type="text" id="swal-comboid" placeholder="e.g. CMB05"></div>' +
            '<div class="form-group"><label>Name *</label><input type="text" id="swal-name" placeholder="Combo name"></div>' +
            '<div class="form-group"><label>Combo Price *</label><input type="number" id="swal-price" placeholder="0" min="0"></div>' +
            '<div class="form-group"><label>Description</label><input type="text" id="swal-desc" placeholder="Short description"></div>' +
            '</div>' +
            '<div class="form-group"><label>Image URL</label><input type="text" id="swal-imgurl" placeholder="https://..."></div>' +
            '<div class="form-group"><label>Select Items *</label>' + buildItemPickerHtml([]) + '</div>' +
            '<div id="swal-combo-calc" style="text-align:center;padding:8px;background:#fff3e0;border-radius:8px;font-weight:600;font-size:13px;margin-top:8px">Select items to see original price</div>' +
            '</div>',
          width: 620, showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d',
          didOpen: () => {
            const updateCalc = () => {
              let total = 0;
              document.querySelectorAll('.combo-item-check:checked').forEach(cb => {
                const id = cb.dataset.id;
                const qty = parseInt(document.querySelector('.combo-item-qty[data-id="' + id + '"]').value) || 1;
                const mi = menuItems.find(m => m.item_id === id);
                if (mi) total += parseFloat(mi.price) * qty;
              });
              const comboPrice = parseFloat(document.getElementById('swal-price').value) || 0;
              const savings = total > 0 && comboPrice > 0 ? Math.round((total - comboPrice) / total * 100) : 0;
              document.getElementById('swal-combo-calc').innerHTML = 'Original: ' + formatPrice(total) + (comboPrice > 0 ? ' → Combo: ' + formatPrice(comboPrice) + ' (Save ' + savings + '%)' : '');
            };
            document.querySelectorAll('.combo-item-check, .combo-item-qty').forEach(el => el.addEventListener('change', updateCalc));
            document.getElementById('swal-price').addEventListener('input', updateCalc);
          },
          preConfirm: () => {
            const combo_id = document.getElementById('swal-comboid').value.trim();
            const name = document.getElementById('swal-name').value.trim();
            const combo_price = document.getElementById('swal-price').value;
            if (!combo_id || !name || !combo_price) { Swal.showValidationMessage('Combo ID, name and price are required'); return false; }
            const items = [];
            document.querySelectorAll('.combo-item-check:checked').forEach(cb => {
              items.push({ item_id: cb.dataset.id, qty: parseInt(document.querySelector('.combo-item-qty[data-id="' + cb.dataset.id + '"]').value) || 1 });
            });
            if (items.length === 0) { Swal.showValidationMessage('Select at least one item'); return false; }
            return { combo_id, name, combo_price, items, description: document.getElementById('swal-desc').value.trim(), image_url: document.getElementById('swal-imgurl').value.trim() };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Saving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const res = await serverCall('addCombo', result.value, user.id, user.role);
            if (res.success) {
              Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
              setTimeout(() => loadCombos(), 100);
            } else {
              Swal.fire({ icon: 'error', title: 'Error', text: res.message });
            }
          }
        });
      };

      const handleEditCombo = (data) => {
        Swal.fire({
          title: '<i class="fas fa-edit" style="color:#221b18"></i> Edit Combo',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Combo ID</label><input type="text" id="swal-comboid" value="' + escapeHtml(data.combo_id) + '" readonly style="background:#f0f0f0"></div>' +
            '<div class="form-group"><label>Name *</label><input type="text" id="swal-name" value="' + escapeHtml(data.name) + '"></div>' +
            '<div class="form-group"><label>Combo Price *</label><input type="number" id="swal-price" value="' + data.combo_price + '" min="0"></div>' +
            '<div class="form-group"><label>Description</label><input type="text" id="swal-desc" value="' + escapeHtml(data.description || '') + '"></div>' +
            '</div>' +
            '<div class="form-group"><label>Image URL</label><input type="text" id="swal-imgurl" value="' + escapeHtml(data.image_url || '') + '"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '<div class="form-group"><label>Select Items *</label>' + buildItemPickerHtml(data.items) + '</div>' +
            '<div id="swal-combo-calc" style="text-align:center;padding:8px;background:#fff3e0;border-radius:8px;font-weight:600;font-size:13px;margin-top:8px"></div>' +
            '</div>',
          width: 620, showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Update',
          confirmButtonColor: '#b54d2d',
          didOpen: () => {
            document.getElementById('swal-status').value = data.is_active;
            const updateCalc = () => {
              let total = 0;
              document.querySelectorAll('.combo-item-check:checked').forEach(cb => {
                const id = cb.dataset.id;
                const qty = parseInt(document.querySelector('.combo-item-qty[data-id="' + id + '"]').value) || 1;
                const mi = menuItems.find(m => m.item_id === id);
                if (mi) total += parseFloat(mi.price) * qty;
              });
              const comboPrice = parseFloat(document.getElementById('swal-price').value) || 0;
              const savings = total > 0 && comboPrice > 0 ? Math.round((total - comboPrice) / total * 100) : 0;
              document.getElementById('swal-combo-calc').innerHTML = 'Original: ' + formatPrice(total) + ' → Combo: ' + formatPrice(comboPrice) + ' (Save ' + savings + '%)';
            };
            document.querySelectorAll('.combo-item-check, .combo-item-qty').forEach(el => el.addEventListener('change', updateCalc));
            document.getElementById('swal-price').addEventListener('input', updateCalc);
            updateCalc();
          },
          preConfirm: () => {
            const name = document.getElementById('swal-name').value.trim();
            const combo_price = document.getElementById('swal-price').value;
            if (!name || !combo_price) { Swal.showValidationMessage('Name and price are required'); return false; }
            const items = [];
            document.querySelectorAll('.combo-item-check:checked').forEach(cb => {
              items.push({ item_id: cb.dataset.id, qty: parseInt(document.querySelector('.combo-item-qty[data-id="' + cb.dataset.id + '"]').value) || 1 });

            if (items.length === 0) { Swal.showValidationMessage('Select at least one item'); return false; }

        }).then(async (result) => {

            const res = await serverCall('updateCombo', result.value, user.id, user.role);

              Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false });
              setTimeout(() => loadCombos(), 100);
            } else {
              Swal.fire({ icon: 'error', title: 'Error', text: res.message });
            }
          }
        });

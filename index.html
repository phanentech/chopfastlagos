      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      return Math.floor(seconds / 86400) + 'd ago';
    };

    const slugifyCategory = (cat) => {
      if (!cat) return '';
      return String(cat).toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    };

    // ==================== APP HISTORY (browser / Android back button) ====================
    const hasGasHistory = () => typeof google !== 'undefined' && google.script && google.script.history;
    const appHistory = {
      push(page) {
        try { if (hasGasHistory()) google.script.history.push({ page }, {}, ''); else window.history.pushState({ page }, ''); } catch (e) {}
      },
      replace(page) {
        try { if (hasGasHistory()) google.script.history.replace({ page }, {}, ''); else window.history.replaceState({ page }, ''); } catch (e) {}
      },
      listen(cb) {
        try {
          if (hasGasHistory()) { google.script.history.setChangeHandler((e) => cb(e && e.state ? e.state.page : null)); return () => {}; }
          const h = (e) => cb(e.state ? e.state.page : null);
          window.addEventListener('popstate', h);
          return () => window.removeEventListener('popstate', h);
        } catch (e) { return () => {}; }
      }
    };

    // Hide fixed bottom bars while the on-screen keyboard is open and keep the focused field visible
    function useKeyboardAware() {
      useEffect(() => {
        const isField = (el) => el && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'submit', 'file', 'range', 'color'].includes(el.type)));
        let t;
        const onIn = (e) => {
          if (!isField(e.target) || window.innerWidth > 768) return;
          document.body.classList.add('kb-open');
          clearTimeout(t);
          t = setTimeout(() => { try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 300);
        };
        const onOut = () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('kb-open'); }, 120);
        document.addEventListener('focusin', onIn);
        document.addEventListener('focusout', onOut);
        return () => { document.removeEventListener('focusin', onIn); document.removeEventListener('focusout', onOut); clearTimeout(t); };
      }, []);
    }

    function PublicBottomNav({ active, cartCount, onNavigate }) {
      const items = [
        { id: 'home', icon: 'fa-home', label: 'Home' },
        { id: 'menu', icon: 'fa-utensils', label: 'Menu' },
        { id: 'cart', icon: 'fa-shopping-bag', label: 'Cart', badge: cartCount },
        { id: 'orders', icon: 'fa-receipt', label: 'Orders' },
        { id: 'account', icon: 'fa-user-circle', label: 'Profile' }
      ];
      return (
        <nav className="pub-bnav" aria-label="Main navigation">
          <div className="pub-bnav-items">
            {items.map(it => (
              <button key={it.id} type="button" className={'pub-bnav-item' + (active === it.id ? ' active' : '')}
                aria-label={it.label + (it.badge ? ', ' + it.badge + ' items' : '')} aria-current={active === it.id ? 'page' : undefined}
                onClick={() => onNavigate(it.id)}>
                <i className={'fas ' + it.icon} aria-hidden="true"></i>
                <span className="lbl">{it.label}</span>
                {it.badge > 0 && <span className="pub-bnav-badge" aria-hidden="true">{it.badge > 99 ? '99+' : it.badge}</span>}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    // POST transport for calls that carry a customer access token (keeps tokens out of URLs/logs)
    const serverCallSecure = (functionName, ...args) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) return serverCall(functionName, ...args);
      const base = (typeof BACKEND_URL !== 'undefined' && BACKEND_URL) ? BACKEND_URL : window.location.href.split('?')[0];
      return fetch(base, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: functionName, args }) })
        .then((res) => { if (!res.ok) throw new Error('Server responded with ' + res.status); return res.json(); })
        .then((data) => { if (data && typeof data === 'object' && data.__error) throw new Error(data.__error); return data; });
    };

    // ==================== SUPABASE CUSTOMER AUTH ====================
    // Read auth links (#type=recovery / #error=...) before the Supabase client consumes the URL hash
    const AUTH_URL_STATE = (() => {
      try {
        const p = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
        const err = p.get('error_description');
        return { recovery: p.get('type') === 'recovery', signup: p.get('type') === 'signup', error: err ? err.replace(/\+/g, ' ') : '' };
      } catch (e) { return { recovery: false, signup: false, error: '' }; }
    })();

    const sbClient = (() => {
      try {
        if (typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || SUPABASE_URL.indexOf('YOUR-') !== -1 || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('YOUR-') !== -1) return null;
        if (!window.supabase || !window.supabase.createClient) { console.error('Supabase SDK failed to load'); return null; }
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
      } catch (e) { console.error('Supabase init failed', e); return null; }
    })();
    const AUTH_REDIRECT = (typeof SITE_URL !== 'undefined' && SITE_URL) ? SITE_URL : window.location.origin;

    const getAccessToken = async () => {
      if (!sbClient) return null;
      try { const { data } = await sbClient.auth.getSession(); return data && data.session ? data.session.access_token : null; } catch (e) { return null; }
    };

    const authErrorMessage = (err) => {
      const m = (err && (err.message || err.error_description)) || '';
      if (/invalid login credentials/i.test(m)) return 'Email or password is incorrect.';
      if (/email not confirmed/i.test(m)) return 'Please confirm your email address first. Check your inbox for the confirmation link.';
      if (/already registered|already exists/i.test(m)) return 'An account with this email already exists. Sign in instead.';
      if ((err && err.status === 429) || /rate limit|too many|security purposes/i.test(m)) return 'Too many attempts. Please wait a minute and try again.';
      if (/same password|different from the old/i.test(m)) return 'Your new password must be different from your current one.';
      if (/failed to fetch|network|load failed/i.test(m)) return 'Network problem. Check your connection and try again.';
      if (/expired|invalid.*(token|link)|otp/i.test(m)) return 'This link is invalid or has expired. Request a new one below.';
      return m || 'Something went wrong. Please try again.';
    };

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const isValidPhone = (p) => /^\+?[0-9\s()-]{10,18}$/.test(String(p || '').trim()) && String(p).replace(/\D/g, '').length >= 10;
    const passwordIssues = (pw) => {
      const issues = [];
      if (pw.length < 8) issues.push('at least 8 characters');
      if (!/[A-Za-z]/.test(pw)) issues.push('a letter');
      if (!/[0-9]/.test(pw)) issues.push('a number');
      return issues;
    };

    // ==================== PUBLIC MENU DATA (shared, cached) ====================
    let _menuCache = null;
    const loadPublicMenu = (force) => {
      if (_menuCache && !force && Date.now() - _menuCache.at < 5 * 60 * 1000) return _menuCache.promise;
      const promise = Promise.all([serverCall('getPublicMenu'), serverCall('getPublicCombos'), serverCall('getAllPublicExtras')])
        .then(([m, c, e]) => {
          if (!m || !m.success) throw new Error((m && m.message) || 'Failed to load menu');
          return { items: m.data || [], combos: (c && c.success && c.data) || [], extras: (e && e.success && e.data) || {} };
        })
        .catch((err) => { _menuCache = null; throw err; });
      _menuCache = { at: Date.now(), promise };
      return promise;
    };
    function usePublicMenu() {
      const [state, setState] = useState({ items: [], combos: [], extras: {}, loading: true, error: '' });
      const [nonce, setNonce] = useState(0);
      useEffect(() => {
        let alive = true;
        setState(s => ({ ...s, loading: true, error: '' }));
        loadPublicMenu(nonce > 0).then(d => { if (alive) setState({ ...d, loading: false, error: '' }); })
          .catch(err => { if (alive) setState(s => ({ ...s, loading: false, error: (err && err.message) || 'Failed to load menu' })); });
        return () => { alive = false; };
      }, [nonce]);
      return { ...state, reload: () => setNonce(n => n + 1) };
    }

    // Pure cart helpers — same line-item shape the checkout and server already use
    const cartWithItem = (cart, item, extras, qty) => {
      extras = extras || []; qty = qty || 1;
      const extrasKey = extras.map(e => e.extra_name).sort().join(',');
      const cartKey = item.item_id + '_' + extrasKey;
      const extrasTotal = extras.reduce((s, e) => s + (parseFloat(e.extra_price) || 0), 0);
      const unit = parseFloat(item.price) || 0;
      if (cart.find(c => c._cartKey === cartKey)) {
        return cart.map(c => c._cartKey === cartKey ? { ...c, qty: c.qty + qty, total_price: (c.qty + qty) * (c.unit_price + extrasTotal) } : c);
      }
      return [...cart, { item_id: item.item_id, _cartKey: cartKey, item_name: item.name, qty: qty, unit_price: unit, extras: extras, total_price: qty * (unit + extrasTotal) }];
    };
    const cartWithCombo = (cart, combo) => {
      const cartKey = 'combo_' + combo.combo_id;
      if (cart.find(c => c._cartKey === cartKey)) return cart.map(c => c._cartKey === cartKey ? { ...c, qty: c.qty + 1, total_price: (c.qty + 1) * c.unit_price } : c);
      return [...cart, { item_id: combo.combo_id, _cartKey: cartKey, item_name: combo.name + ' (Combo)', qty: 1, unit_price: combo.combo_price, total_price: combo.combo_price,
        extras: combo.items.map(it => ({ item_id: it.item_id, item_name: it.item_name, qty: it.qty, extra_price: 0 })), is_combo: true, combo_id: combo.combo_id }];
    };

    const prettyCategory = (c) => String(c || '').split(' ').map(w => w.length <= 2 ? w : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');

    function FoodImage({ src, alt }) {
      const [bad, setBad] = useState(false);
      useEffect(() => { setBad(false); }, [src]);
      if (!src || bad) return <div className="fm-ph" aria-hidden="true"><i className="fas fa-utensils"></i></div>;
      return <img src={src} alt={alt || ''} loading="lazy" decoding="async" onError={() => setBad(true)} />;
    }

    // ==================== MENU BROWSER (search, categories, sort, cards) ====================
    function MenuBrowser({ items, loading, error, onRetry, cart, onAdd, onOpen }) {
      const [query, setQuery] = useState('');
      const [cat, setCat] = useState('all');
      const [sort, setSort] = useState('featured');

      const counts = useMemo(() => { const m = {}; items.forEach(i => { m[i.category] = (m[i.category] || 0) + 1; }); return m; }, [items]);
      const categories = useMemo(() => ['all', ...Object.keys(counts)], [counts]);
      const inCart = useMemo(() => { const m = {}; (cart || []).forEach(c => { if (!c.is_combo) m[c.item_id] = (m[c.item_id] || 0) + c.qty; }); return m; }, [cart]);

      const q = query.trim().toLowerCase();
      let list = items.filter(i => (cat === 'all' || i.category === cat) &&
        (!q || ((i.name || '') + ' ' + (i.description || '') + ' ' + (i.category || '')).toLowerCase().indexOf(q) !== -1));
      if (sort === 'price-asc') list = [...list].sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
      else if (sort === 'price-desc') list = [...list].sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
      else if (sort === 'name') list = [...list].sort((a, b) => String(a.name).localeCompare(String(b.name)));

      if (error && !items.length) {
        return (
          <div className="fm-state" role="alert">
            <i className="fas fa-wifi"></i>
            <p>We couldn't load the menu. {error}</p>
            <button type="button" className="fm-add" style={{width: 'auto', padding: '0 22px'}} onClick={onRetry}><i className="fas fa-redo"></i> Try again</button>
          </div>
        );
      }

      return (
        <div className="fm">
          <div className="fm-toolbar">
            <div className="fm-search">
              <i className="fas fa-search" aria-hidden="true"></i>
              <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search dishes, drinks, sides…" aria-label="Search the menu" enterKeyHint="search" />
              {query && <button type="button" className="fm-search-clear" onClick={() => setQuery('')} aria-label="Clear search"><i className="fas fa-times"></i></button>}
            </div>
            <select className="fm-sort" value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort dishes">
              <option value="featured">Recommended</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name: A–Z</option>
            </select>
          </div>

          <div className="fm-chips" role="tablist" aria-label="Food categories">
            {categories.map(c => (
              <button key={c} type="button" role="tab" aria-selected={cat === c} className={'fm-chip' + (cat === c ? ' active' : '')} onClick={() => setCat(c)}>
                {c === 'all' ? 'All' : prettyCategory(c)}<span className="n">{c === 'all' ? items.length : counts[c]}</span>
              </button>
            ))}
          </div>

          {!loading && (
            <div className="fm-meta" aria-live="polite">
              <span>{list.length} {list.length === 1 ? 'dish' : 'dishes'}{q ? ' for “' + query.trim() + '”' : ''}{cat !== 'all' ? ' in ' + prettyCategory(cat) : ''}</span>
              {(q || cat !== 'all') && <button type="button" className="auth-link" onClick={() => { setQuery(''); setCat('all'); }}>Clear filters</button>}
            </div>
          )}

          {loading ? (
            <div className="fm-grid" aria-busy="true" aria-label="Loading menu">
              {[...Array(6)].map((_, i) => (
                <div key={i}><div className="skeleton fm-skel"></div><div className="skeleton" style={{height: '14px', margin: '12px 0 8px', width: '80%'}}></div><div className="skeleton" style={{height: '40px', borderRadius: '999px'}}></div></div>
              ))}
            </div>
          ) : list.length === 0 ? (
            <div className="fm-state"><i className="fas fa-search"></i><p>No dishes match your search.</p></div>
          ) : (
            <div className="fm-grid">
              {list.map(item => (
                <article className="fm-card" key={item.item_id}>
                  <button type="button" className="fm-card-media" onClick={() => onOpen(item)} aria-label={'View details for ' + item.name}>
                    <FoodImage src={item.image_url} alt="" />
                    {inCart[item.item_id] > 0 && <span className="fm-incart">{inCart[item.item_id]} in cart</span>}
                    {item.out_of_stock && <span className="fm-sold">Sold out</span>}
                  </button>
                  <div className="fm-card-body">
                    <button type="button" className="fm-card-name" onClick={() => onOpen(item)}>{item.name}</button>
                    <div className="fm-card-sub">{item.schedule_label ? <><i className="fas fa-clock"></i> {item.schedule_label}</> : prettyCategory(item.category)}</div>
                    <div className="fm-price">{formatPrice(item.price)}</div>
                    <button type="button" className="fm-add" disabled={!!item.out_of_stock} onClick={() => onAdd(item)} aria-label={item.out_of_stock ? item.name + ' is sold out' : 'Add ' + item.name + ' to cart'}>
                      {item.out_of_stock ? 'Sold out' : <><i className="fas fa-plus" aria-hidden="true"></i> Add to cart</>}
                    </button>
                  </div>
                </article>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==================== FOOD DETAIL SHEET ====================
    function FoodDetailSheet({ item, extras, inCartQty, onClose, onAdd }) {
      const [qty, setQty] = useState(1);
      const [sel, setSel] = useState([]);
      const closeRef = useRef(null);
      const opts = extras || [];
      const maxQty = item.stock_qty !== null && item.stock_qty !== undefined ? Math.max(0, parseInt(item.stock_qty) - (inCartQty || 0)) : 99;

      useEffect(() => {
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const t = setTimeout(() => { if (closeRef.current) closeRef.current.focus(); }, 60);
        return () => { document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); clearTimeout(t); };
      }, []);

      const chosen = sel.map(i => ({ extra_name: opts[i].extra_name, extra_price: parseFloat(opts[i].extra_price) || 0 }));
      const unit = (parseFloat(item.price) || 0) + chosen.reduce((s, e) => s + e.extra_price, 0);
      const toggle = (i) => setSel(s => s.indexOf(i) !== -1 ? s.filter(x => x !== i) : [...s, i]);
      const soldOut = !!item.out_of_stock || maxQty <= 0;

      return ReactDOM.createPortal(
        <div className="fm-sheet-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="fm-sheet" role="dialog" aria-modal="true" aria-labelledby="fm-sheet-title">
            <div className="fm-sheet-scroll">
              <div className="fm-sheet-media">
                <FoodImage src={item.image_url} alt={item.name} />
                <button type="button" ref={closeRef} className="fm-sheet-close" onClick={onClose} aria-label="Close"><i className="fas fa-times"></i></button>
              </div>
              <div className="fm-sheet-body">
                <span className="fm-sheet-tag">{prettyCategory(item.category)}</span>
                <h2 id="fm-sheet-title">{item.name}</h2>
                <div className="fm-sheet-price">{formatPrice(item.price)}</div>
                <p className="fm-sheet-desc">{item.description || 'Freshly prepared by our kitchen.'}</p>
                <div className="fm-facts">
                  <span className="fm-fact"><i className="fas fa-clock"></i> {item.availability === 'Pre-Order' ? 'Pre-order' : 'Ready in ~15 min'}</span>
                  {item.schedule_label && <span className="fm-fact"><i className="fas fa-calendar-alt"></i> {item.schedule_label}</span>}
                  {item.stock_qty !== null && item.stock_qty !== undefined && item.stock_qty > 0 && item.stock_qty <= 5 && <span className="fm-fact warn"><i className="fas fa-fire"></i> Only {item.stock_qty} left</span>}
                  {inCartQty > 0 && <span className="fm-fact"><i className="fas fa-shopping-bag"></i> {inCartQty} already in cart</span>}
                </div>
                {opts.length > 0 && (
                  <div className="fm-extras">
                    <h4>Add-ons (optional)</h4>
                    {opts.map((ex, i) => (
                      <label key={i} className={'fm-extra' + (sel.indexOf(i) !== -1 ? ' on' : '')}>
                        <input type="checkbox" checked={sel.indexOf(i) !== -1} onChange={() => toggle(i)} />
                        <span className="nm">{ex.extra_name}</span>
                        <span className="pr">+{formatPrice(ex.extra_price)}</span>
                      </label>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div className="fm-sheet-foot">
              <div className="fm-qty">
                <button type="button" onClick={() => setQty(q => Math.max(1, q - 1))} disabled={qty <= 1} aria-label="Decrease quantity">−</button>
                <strong aria-live="polite">{qty}</strong>
                <button type="button" onClick={() => setQty(q => Math.min(maxQty, q + 1))} disabled={qty >= maxQty} aria-label="Increase quantity">+</button>
              </div>
              <button type="button" className="fm-sheet-add" disabled={soldOut} onClick={() => onAdd(item, chosen, qty)}>
                {soldOut ? 'Sold out' : <><i className="fas fa-shopping-bag" aria-hidden="true"></i> Add · {formatPrice(unit * qty)}</>}
              </button>
            </div>
          </div>
        </div>,
        document.body
      );
    }

    // ==================== MENU PAGE ====================
    function MenuPage({ cart, setCart, onBack, onCheckout }) {
      const menu = usePublicMenu();
      const [detail, setDetail] = useState(null);
      const [toast, setToast] = useState('');
      useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 1800); return () => clearTimeout(t); }, [toast]);

      const addItem = (item, extras, qty) => { setCart(cartWithItem(cart, item, extras, qty)); setToast((qty > 1 ? qty + '× ' : '') + item.name + ' added to cart'); setDetail(null); };
      const quickAdd = (item) => ((menu.extras[item.item_id] || []).length ? setDetail(item) : addItem(item, [], 1));
      const count = cart.reduce((s, c) => s + c.qty, 0);
      const total = cart.reduce((s, c) => s + c.total_price, 0);
      const inCartQty = (id) => cart.filter(c => c.item_id === id && !c.is_combo).reduce((s, c) => s + c.qty, 0);

      return (
        <div className={'menu-page' + (count > 0 ? ' has-bar' : '')}>
          {toast && <div className="hp-toast" role="status"><strong>Cart updated</strong><span>{toast}</span></div>}
          <header className="menu-page-head">
            <button type="button" className="icon-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i></button>
            <button type="button" className="brand nav-link-btn" onClick={onBack} aria-label="Chop Fast Lagos home">
              <img src={LOGO_URL} alt="" style={{width: '36px', height: '36px', borderRadius: '50%', objectFit: 'cover'}} />
              <strong>Chop Fast Lagos</strong>
            </button>
            <button type="button" className="icon-btn" onClick={onCheckout} aria-label={'View cart, ' + count + ' items'}>
              <i className="fas fa-shopping-bag"></i>
              {count > 0 && <span className="icon-badge" aria-hidden="true">{count > 99 ? '99+' : count}</span>}
            </button>
          </header>

          <div className="menu-page-wrap">
            <div className="menu-page-intro">
              <h1>What are you craving?</h1>
              <p>Fresh Lagos favourites, cooked to order and delivered warm.</p>
            </div>

            {menu.combos.length > 0 && (
              <>
                <h2 className="menu-section-title">Combo deals</h2>
                <div className="menu-combos">
                  {menu.combos.map(combo => (
                    <article className="hp-combo-card" key={combo.combo_id}>
                      <div className="hp-combo-badge">Save {combo.savings_percent}%</div>
                      <div className="hp-combo-img">{combo.image_url ? <img src={combo.image_url} alt={combo.name} /> : <i className="fas fa-layer-group"></i>}</div>
                      <div className="hp-combo-info">
                        <h3>{combo.name}</h3>
                        <div className="hp-combo-pricing">
                          <span className="hp-combo-original">{formatPrice(combo.original_price)}</span>
                          <span className="hp-combo-price">{formatPrice(combo.combo_price)}</span>
                        </div>
                        <button type="button" className="hp-combo-add" onClick={() => { setCart(cartWithCombo(cart, combo)); setToast(combo.name + ' added to cart'); }}><i className="fas fa-cart-plus"></i> Add combo</button>
                      </div>
                    </article>
                  ))}
                </div>
              </>
            )}

            <h2 className="menu-section-title">Full menu</h2>
            <MenuBrowser items={menu.items} loading={menu.loading} error={menu.error} onRetry={menu.reload} cart={cart} onAdd={quickAdd} onOpen={setDetail} />
          </div>

          {count > 0 && (
            <div className="menu-checkout-bar">
              <div><strong>{count} {count === 1 ? 'item' : 'items'}</strong><small>{formatPrice(total)} before delivery</small></div>
              <button type="button" onClick={onCheckout}>View cart <i className="fas fa-arrow-right"></i></button>
            </div>
          )}
          {detail && <FoodDetailSheet item={detail} extras={menu.extras[detail.item_id]} inCartQty={inCartQty(detail.item_id)} onClose={() => setDetail(null)} onAdd={addItem} />}
        </div>
      );
    }

    // ==================== AUTH FORM FIELDS ====================
    function AuthTextField({ id, label, icon, type, value, onChange, error, autoComplete, placeholder, inputMode }) {
      return (
        <div className={'auth-field' + (error ? ' has-error' : '')}>
          <label htmlFor={id}>{label}</label>
          <div className="auth-input">
            <i className={'fas ' + icon + ' lead'} aria-hidden="true"></i>
            <input id={id} className="no-eye" type={type || 'text'} value={value} onChange={(e) => onChange(e.target.value)} autoComplete={autoComplete} placeholder={placeholder} inputMode={inputMode} aria-invalid={!!error} aria-describedby={error ? id + '-err' : undefined} />
          </div>
          {error && <div className="auth-err" id={id + '-err'}><i className="fas fa-exclamation-circle" aria-hidden="true"></i> {error}</div>}
        </div>
      );
    }

    function AuthPasswordField({ id, label, value, onChange, error, autoComplete, placeholder, hint }) {
      const [show, setShow] = useState(false);
      return (
        <div className={'auth-field' + (error ? ' has-error' : '')}>
          <label htmlFor={id}>{label}</label>
          <div className="auth-input">
            <i className="fas fa-lock lead" aria-hidden="true"></i>
            <input id={id} type={show ? 'text' : 'password'} value={value} onChange={(e) => onChange(e.target.value)} autoComplete={autoComplete} placeholder={placeholder} aria-invalid={!!error} aria-describedby={error ? id + '-err' : (hint ? id + '-hint' : undefined)} autoCapitalize="none" spellCheck="false" />
            <button type="button" className="auth-eye" onClick={() => setShow(v => !v)} aria-label={show ? 'Hide password' : 'Show password'} aria-pressed={show}><i className={'fas ' + (show ? 'fa-eye-slash' : 'fa-eye')}></i></button>
          </div>
          {error ? <div className="auth-err" id={id + '-err'}><i className="fas fa-exclamation-circle" aria-hidden="true"></i> {error}</div>
            : hint ? <div className="auth-hint" id={id + '-hint'}>{hint}</div> : null}
        </div>
      );
    }

    function PasswordMeter({ value }) {
      if (!value) return null;
      let score = 0;
      if (value.length >= 8) score++;
      if (/[A-Za-z]/.test(value) && /[0-9]/.test(value)) score++;
      if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value) || value.length >= 12) score++;
      const colors = ['#d93025', '#e8710a', '#f9ab00', '#1e8e3e'];
      const labels = ['Weak', 'Fair', 'Good', 'Strong'];
      const idx = Math.max(0, score - 1);
      return (
        <>
          <div className="pw-meter" aria-hidden="true">{[0, 1, 2, 3].map(i => <span key={i} style={{background: i < score ? colors[idx] : undefined}}></span>)}</div>
          <div className="pw-meter-label">Password strength: <strong style={{color: colors[idx]}}>{labels[idx]}</strong></div>
        </>
      );
    }

    // ==================== LOGIN / SIGN UP / FORGOT / RESET ====================
    function AuthPage({ initialMode, gateMessage, linkError, onAuthed, onBack, onStaffLogin, onTrackOrder }) {
      const [mode, setMode] = useState(initialMode || 'login');
      const [form, setForm] = useState({ name: '', phone: '', email: '', password: '', confirm: '' });
      const [errors, setErrors] = useState({});
      const [alert, setAlert] = useState(linkError ? { type: 'error', text: authErrorMessage({ message: linkError }) } : null);
      const [loading, setLoading] = useState(false);
      const [pendingEmail, setPendingEmail] = useState('');

      useEffect(() => { setMode(initialMode || 'login'); }, [initialMode]);

      const set = (k) => (v) => { setForm(f => ({ ...f, [k]: v })); if (errors[k]) setErrors(e => ({ ...e, [k]: undefined })); };
      const switchMode = (m) => { setMode(m); setErrors({}); setAlert(null); setPendingEmail(''); setForm(f => ({ ...f, password: '', confirm: '' })); };

      if (!sbClient) {
        return (
          <div className="auth-page">
            <div className="auth-card">
              <div className="auth-top">{onBack && <button type="button" className="page-back-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i> Back</button>}<span></span></div>
              <div className="auth-brand">
                <img src={LOGO_URL} alt="Chop Fast Lagos" style={{width: '72px', height: '72px', borderRadius: '50%', objectFit: 'cover'}} />
                <h1>Accounts are almost ready</h1>
                <p>Customer sign-in isn't available right now. You can still order as a guest and track your order with its Order ID.</p>
              </div>
              {onBack && <button type="button" className="auth-submit" onClick={onBack}><i className="fas fa-utensils"></i> Order as a guest</button>}
              {onTrackOrder && <button type="button" className="auth-ghost" onClick={onTrackOrder}><i className="fas fa-search-location"></i> Track an order</button>}
              {onStaffLogin && <div className="auth-foot auth-staff">Restaurant staff? <button type="button" className="auth-link" onClick={onStaffLogin}>Staff sign-in</button></div>}
            </div>
          </div>
        );
      }

      const validate = () => {
        const e = {};
        const email = form.email.trim();
        if (mode !== 'reset') {
          if (!email) e.email = 'Enter your email address.';
          else if (!EMAIL_RE.test(email)) e.email = 'Enter a valid email address, like name@example.com.';
        }
        if (mode === 'signup') {
          if (form.name.trim().length < 2) e.name = 'Enter your full name.';
          if (!form.phone.trim()) e.phone = 'Enter your phone number so riders can reach you.';
          else if (!isValidPhone(form.phone)) e.phone = 'Enter a valid phone number, like 0810 000 0000.';
        }
        if (mode === 'login' && !form.password) e.password = 'Enter your password.';
        if (mode === 'signup' || mode === 'reset') {
          const iss = passwordIssues(form.password);
          if (iss.length) e.password = 'Password needs ' + iss.join(', ') + '.';
          if (!form.confirm) e.confirm = 'Re-enter your password.';
          else if (form.confirm !== form.password) e.confirm = 'Passwords do not match.';
        }
        setErrors(e);
        if (Object.keys(e).length) {
          setTimeout(() => { const el = document.querySelector('.auth-field.has-error input'); if (el) el.focus(); }, 0);
          return false;
        }
        return true;
      };

      const submit = async (ev) => {
        ev.preventDefault();
        setAlert(null);
        if (!validate()) return;
        setLoading(true);
        const email = form.email.trim().toLowerCase();
        try {
          if (mode === 'login') {
            const { error } = await sbClient.auth.signInWithPassword({ email, password: form.password });
            if (error) { if (/email not confirmed/i.test(error.message || '')) setPendingEmail(email); throw error; }
            onAuthed && onAuthed('login');
          } else if (mode === 'signup') {
            const { data, error } = await sbClient.auth.signUp({ email, password: form.password, options: { data: { full_name: form.name.trim(), phone: form.phone.trim() }, emailRedirectTo: AUTH_REDIRECT } });
            if (error) throw error;
            if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
              setMode('login'); setForm(f => ({ ...f, password: '', confirm: '' }));
              setAlert({ type: 'error', text: 'An account with this email already exists. Sign in instead, or reset your password.' });
            } else if (data && data.session) {
              onAuthed && onAuthed('signup');
            } else {
              setPendingEmail(email); setMode('login'); setForm(f => ({ ...f, password: '', confirm: '' }));
              setAlert({ type: 'success', text: 'Account created! We sent a confirmation link to ' + email + '. Open it to activate your account, then sign in.' });
            }
          } else if (mode === 'forgot') {
            const { error } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo: AUTH_REDIRECT });
            if (error) throw error;
            setAlert({ type: 'success', text: 'If an account exists for ' + email + ', a password reset link is on its way. Check your inbox and spam folder.' });
          } else if (mode === 'reset') {
            const { data: s } = await sbClient.auth.getSession();
            if (!s || !s.session) throw new Error('This reset link has expired');
            const { error } = await sbClient.auth.updateUser({ password: form.password });
            if (error) throw error;
            onAuthed && onAuthed('reset');
          }
        } catch (err) {
          setAlert({ type: 'error', text: authErrorMessage(err) });
        } finally {
          setLoading(false);
        }
      };

      const resendConfirmation = async () => {
        setLoading(true);
        try {
          const { error } = await sbClient.auth.resend({ type: 'signup', email: pendingEmail, options: { emailRedirectTo: AUTH_REDIRECT } });
          if (error) throw error;
          setAlert({ type: 'success', text: 'Confirmation email sent again to ' + pendingEmail + '.' });
        } catch (err) { setAlert({ type: 'error', text: authErrorMessage(err) }); }
        finally { setLoading(false); }
      };

      const copy = {
        login: ['Welcome back', 'Sign in to order faster and see all your orders.', 'Sign in'],
        signup: ['Create your account', 'Save your details and keep your order history in one place.', 'Create account'],
        forgot: ['Reset your password', "Enter your account email and we'll send you a reset link.", 'Send reset link'],
        reset: ['Choose a new password', "Pick a strong password you haven't used before.", 'Update password']
      }[mode];

      return (
        <div className="auth-page">
          <div className="auth-card">
            <div className="auth-top">
              {onBack ? <button type="button" className="page-back-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i> Back</button> : <span></span>}
              <span></span>
            </div>
            <div className="auth-brand">
              <button type="button" className="logo-home-btn" onClick={onBack} aria-label="Chop Fast Lagos home"><img src={LOGO_URL} alt="" /></button>
              <h1>{copy[0]}</h1>
              <p>{gateMessage && (mode === 'login' || mode === 'signup') ? gateMessage : copy[1]}</p>
            </div>

            {(mode === 'login' || mode === 'signup') && (
              <div className="auth-tabs" role="tablist" aria-label="Sign in or create account">
                <button type="button" role="tab" aria-selected={mode === 'login'} className={'auth-tab' + (mode === 'login' ? ' active' : '')} onClick={() => switchMode('login')}>Sign in</button>
                <button type="button" role="tab" aria-selected={mode === 'signup'} className={'auth-tab' + (mode === 'signup' ? ' active' : '')} onClick={() => switchMode('signup')}>Create account</button>
              </div>
            )}

            {alert && (
              <div className={'auth-alert ' + alert.type} role={alert.type === 'error' ? 'alert' : 'status'}>
                <i className={'fas ' + (alert.type === 'error' ? 'fa-exclamation-circle' : alert.type === 'success' ? 'fa-check-circle' : 'fa-info-circle')} aria-hidden="true"></i>
                <span>{alert.text}</span>
              </div>
            )}
            {pendingEmail && mode === 'login' && (
              <div className="auth-row" style={{justifyContent: 'center', marginTop: '-8px'}}>
                <button type="button" className="auth-link" onClick={resendConfirmation} disabled={loading}><i className="fas fa-paper-plane"></i> Resend confirmation email</button>
              </div>
            )}

            <form onSubmit={submit} noValidate>
              {mode === 'signup' && (
                <>
                  <AuthTextField id="auth-name" label="Full name" icon="fa-user" value={form.name} onChange={set('name')} error={errors.name} autoComplete="name" placeholder="e.g. Adaeze Okafor" />
                  <AuthTextField id="auth-phone" label="Phone number" icon="fa-phone" type="tel" inputMode="tel" value={form.phone} onChange={set('phone')} error={errors.phone} autoComplete="tel" placeholder="e.g. 0810 000 0000" />
                </>
              )}
              {mode !== 'reset' && (
                <AuthTextField id="auth-email" label="Email address" icon="fa-envelope" type="email" inputMode="email" value={form.email} onChange={set('email')} error={errors.email} autoComplete="email" placeholder="you@example.com" />
              )}
              {mode !== 'forgot' && (
                <AuthPasswordField id="auth-password" label={mode === 'reset' ? 'New password' : 'Password'} value={form.password} onChange={set('password')} error={errors.password}
                  autoComplete={mode === 'login' ? 'current-password' : 'new-password'} placeholder={mode === 'login' ? 'Your password' : 'At least 8 characters'}
                  hint={mode === 'login' ? undefined : 'Use 8+ characters with letters and numbers.'} />
              )}
              {(mode === 'signup' || mode === 'reset') && <PasswordMeter value={form.password} />}
              {(mode === 'signup' || mode === 'reset') && (
                <AuthPasswordField id="auth-confirm" label="Confirm password" value={form.confirm} onChange={set('confirm')} error={errors.confirm} autoComplete="new-password" placeholder="Type it again" />
              )}
              {mode === 'login' && (
                <div className="auth-row"><button type="button" className="auth-link" onClick={() => switchMode('forgot')}>Forgot password?</button></div>
              )}
              <button type="submit" className="auth-submit" disabled={loading}>
                {loading ? <><i className="fas fa-spinner fa-spin"></i> Please wait…</> : copy[2]}
              </button>
            </form>

            <div className="auth-foot">
              {mode === 'forgot' && <button type="button" className="auth-link" onClick={() => switchMode('login')}><i className="fas fa-arrow-left"></i> Back to sign in</button>}
              {mode === 'reset' && <button type="button" className="auth-link" onClick={() => switchMode('forgot')}>Need a new reset link?</button>}
              {(mode === 'login' || mode === 'signup') && onTrackOrder && (
                <div>Ordered as a guest? <button type="button" className="auth-link" onClick={onTrackOrder}>Track with your Order ID</button></div>
              )}
              {onStaffLogin && <div className="auth-staff">Restaurant staff? <button type="button" className="auth-link" onClick={onStaffLogin}>Staff sign-in</button></div>}
            </div>
          </div>
        </div>
      );
    }

    // ==================== CUSTOMER PROFILE ====================
    function ProfilePage({ session, onBack, onNavigate, onLogout }) {
      const user = session.user;
      const meta = user.user_metadata || {};
      const [details, setDetails] = useState({ name: meta.full_name || '', phone: meta.phone || '' });
      const [detailErr, setDetailErr] = useState({});
      const [detailMsg, setDetailMsg] = useState(null);
      const [savingDetails, setSavingDetails] = useState(false);
      const [pw, setPw] = useState({ password: '', confirm: '' });
      const [pwErr, setPwErr] = useState({});
      const [pwMsg, setPwMsg] = useState(null);
      const [savingPw, setSavingPw] = useState(false);

      const displayName = meta.full_name || user.email;
      const initials = String(displayName).split(/[\s@.]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();

      const saveDetails = async (e) => {
        e.preventDefault(); setDetailMsg(null);
        const er = {};
        if (details.name.trim().length < 2) er.name = 'Enter your full name.';
        if (!isValidPhone(details.phone)) er.phone = 'Enter a valid phone number, like 0810 000 0000.';
        setDetailErr(er);
        if (Object.keys(er).length) return;
        setSavingDetails(true);
        try {
          const { error } = await sbClient.auth.updateUser({ data: { full_name: details.name.trim(), phone: details.phone.trim() } });
          if (error) throw error;
          setDetailMsg({ type: 'success', text: 'Your details were saved.' });
        } catch (err) { setDetailMsg({ type: 'error', text: authErrorMessage(err) }); }
        finally { setSavingDetails(false); }
      };

      const savePassword = async (e) => {
        e.preventDefault(); setPwMsg(null);
        const er = {};
        const iss = passwordIssues(pw.password);
        if (iss.length) er.password = 'Password needs ' + iss.join(', ') + '.';
        if (pw.confirm !== pw.password) er.confirm = 'Passwords do not match.';
        setPwErr(er);
        if (Object.keys(er).length) return;
        setSavingPw(true);
        try {
          const { error } = await sbClient.auth.updateUser({ password: pw.password });
          if (error) throw error;
          setPw({ password: '', confirm: '' });
          setPwMsg({ type: 'success', text: 'Password updated.' });
        } catch (err) { setPwMsg({ type: 'error', text: authErrorMessage(err) }); }
        finally { setSavingPw(false); }
      };

      const confirmLogout = () => {
        Swal.fire({ icon: 'question', title: 'Sign out?', text: 'You can sign back in any time.', showCancelButton: true, confirmButtonColor: '#E8590C', confirmButtonText: 'Sign out' })
          .then(r => { if (r.isConfirmed) onLogout(); });
      };

      const Msg = ({ m }) => m ? <div className={'auth-alert ' + m.type} role={m.type === 'error' ? 'alert' : 'status'}><i className={'fas ' + (m.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle')}></i><span>{m.text}</span></div> : null;

      return (
        <div className="acct-page">
          <header className="acct-head">
            <button type="button" className="icon-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i></button>
            <h1>Profile</h1>
          </header>
          <div className="acct-wrap">
            <div className="acct-card acct-hero">
              <div className="acct-avatar" aria-hidden="true">{initials}</div>
              <div style={{minWidth: 0}}>
                <h2>{meta.full_name || 'Chop Fast customer'}</h2>
                <p>{user.email}</p>
                {meta.phone && <p>{meta.phone}</p>}
              </div>
            </div>

            <div className="acct-card">
              <div className="acct-links">
                <button type="button" className="acct-link" onClick={() => onNavigate('orders')}><span className="ico"><i className="fas fa-receipt"></i></span><span className="txt">My orders<small>Status and history of your orders</small></span><i className="fas fa-chevron-right chev"></i></button>
                <button type="button" className="acct-link" onClick={() => onNavigate('menu')}><span className="ico"><i className="fas fa-utensils"></i></span><span className="txt">Browse the menu<small>Order something delicious</small></span><i className="fas fa-chevron-right chev"></i></button>
                <button type="button" className="acct-link" onClick={() => onNavigate('track')}><span className="ico"><i className="fas fa-search-location"></i></span><span className="txt">Track an order<small>Look up any order by its ID</small></span><i className="fas fa-chevron-right chev"></i></button>
              </div>
            </div>

            <form className="acct-card" onSubmit={saveDetails} noValidate>
              <h3><i className="fas fa-id-card"></i> Your details</h3>
              <Msg m={detailMsg} />
              <AuthTextField id="pf-name" label="Full name" icon="fa-user" value={details.name} onChange={(v) => setDetails(d => ({ ...d, name: v }))} error={detailErr.name} autoComplete="name" />
              <AuthTextField id="pf-phone" label="Phone number" icon="fa-phone" type="tel" inputMode="tel" value={details.phone} onChange={(v) => setDetails(d => ({ ...d, phone: v }))} error={detailErr.phone} autoComplete="tel" />
              <AuthTextField id="pf-email" label="Email" icon="fa-envelope" type="email" value={user.email} onChange={() => {}} />
              <button type="submit" className="auth-submit" disabled={savingDetails}>{savingDetails ? <><i className="fas fa-spinner fa-spin"></i> Saving…</> : 'Save details'}</button>
            </form>

            <form className="acct-card" onSubmit={savePassword} noValidate>
              <h3><i className="fas fa-key"></i> Change password</h3>
              <Msg m={pwMsg} />
              <AuthPasswordField id="pf-pw" label="New password" value={pw.password} onChange={(v) => setPw(p => ({ ...p, password: v }))} error={pwErr.password} autoComplete="new-password" hint="Use 8+ characters with letters and numbers." />
              <PasswordMeter value={pw.password} />
              <AuthPasswordField id="pf-pw2" label="Confirm new password" value={pw.confirm} onChange={(v) => setPw(p => ({ ...p, confirm: v }))} error={pwErr.confirm} autoComplete="new-password" />
              <button type="submit" className="auth-submit" disabled={savingPw}>{savingPw ? <><i className="fas fa-spinner fa-spin"></i> Updating…</> : 'Update password'}</button>
            </form>

            <div className="acct-card">
              <button type="button" className="acct-link danger" onClick={confirmLogout}><span className="ico"><i className="fas fa-sign-out-alt"></i></span><span className="txt">Sign out</span></button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== CUSTOMER ORDER HISTORY ====================
    function MyOrdersPage({ onBack, onTrack, onBrowse, onSessionExpired }) {
      const [state, setState] = useState({ loading: true, error: '', orders: [] });
      const [tab, setTab] = useState('active');
      const steps = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
      const labels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' };

      const load = async (silent) => {
        if (!silent) setState(s => ({ ...s, loading: true, error: '' }));
        try {
          const token = await getAccessToken();
          if (!token) { onSessionExpired && onSessionExpired(); return; }
          const res = await serverCallSecure('getCustomerOrders', token);
          if (res && res.code === 'AUTH') { onSessionExpired && onSessionExpired(); return; }
          if (!res || !res.success) throw new Error((res && res.message) || 'Could not load your orders.');
          setState({ loading: false, error: '', orders: res.data || [] });
        } catch (e) {
          if (!silent) setState(s => ({ ...s, loading: false, error: e.message || 'Could not load your orders.' }));
        }
      };

      useEffect(() => {
        load(false);
        const iv = setInterval(() => load(true), 30000);
        return () => clearInterval(iv);
      }, []);

      const isActive = (o) => o.status !== 'delivered' && o.status !== 'cancelled';
      const active = state.orders.filter(isActive);
      const past = state.orders.filter(o => !isActive(o));
      const list = tab === 'active' ? active : tab === 'past' ? past : state.orders;

      return (
        <div className="acct-page">
          <header className="acct-head">
            <button type="button" className="icon-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i></button>
            <h1>My orders</h1>
            <button type="button" className="icon-btn" onClick={() => load(false)} aria-label="Refresh orders"><i className={'fas fa-sync-alt' + (state.loading ? ' fa-spin' : '')}></i></button>
          </header>
          <div className="acct-wrap">
            <div className="fm-chips" role="tablist" aria-label="Filter orders">
              {[['active', 'Active', active.length], ['past', 'Past', past.length], ['all', 'All', state.orders.length]].map(([id, label, n]) => (
                <button key={id} type="button" role="tab" aria-selected={tab === id} className={'fm-chip' + (tab === id ? ' active' : '')} onClick={() => setTab(id)}>{label}<span className="n">{n}</span></button>
              ))}
            </div>

            {state.loading && !state.orders.length ? (
              [...Array(3)].map((_, i) => <div key={i} className="skeleton" style={{height: '150px', borderRadius: '20px', marginBottom: '12px'}}></div>)
            ) : state.error ? (
              <div className="fm-state" role="alert"><i className="fas fa-exclamation-triangle"></i><p>{state.error}</p>
                <button type="button" className="fm-add" style={{width: 'auto', padding: '0 22px'}} onClick={() => load(false)}><i className="fas fa-redo"></i> Try again</button></div>
            ) : list.length === 0 ? (
              <div className="fm-state">
                <i className="fas fa-receipt"></i>
                <p>{tab === 'active' ? 'No active orders right now.' : 'No orders here yet.'}</p>
                <button type="button" className="fm-add" style={{width: 'auto', padding: '0 22px'}} onClick={onBrowse}><i className="fas fa-utensils"></i> Browse the menu</button>
              </div>
            ) : list.map(o => {
              const idx = steps.indexOf(o.status);
              const pct = o.status === 'cancelled' ? 100 : Math.max(8, Math.round(((idx < 0 ? 0 : idx) / (steps.length - 1)) * 100));
              return (
                <article className="ord-card" key={o.order_id}>
                  <div className="ord-head">
                    <div><strong>{o.order_id}</strong><small>{formatDate(o.timestamp)} · {String(o.type || '').replace('_', ' ')}</small></div>
                    <span className={'order-status order-' + o.status}>{labels[o.status] || o.status}</span>
                  </div>
                  <div className="ord-items">{(o.items || []).map(it => it.qty + '× ' + it.item_name).join(', ') || '—'}</div>

    // ==================== DARK MODE ====================
    function useDarkMode() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('food_app_theme') || 'light'; } catch(e) { return 'light'; }
      });
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('food_app_theme', theme); } catch(e) {}
      }, [theme]);
      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      return [theme, toggleTheme];
    }

    function ThemeToggleButton({ theme, toggleTheme, style }) {
      return (
        <button type="button" className="theme-toggle-btn" onClick={toggleTheme} style={style} title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'} aria-label={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
          <i className={'fas ' + (theme === 'dark' ? 'fa-sun' : 'fa-moon')}></i>
        </button>
      );
    }

    // ==================== SEARCHABLE DROPDOWN ====================
    function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', label, icon, required = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const dropdownRef = useRef(null);

      const selectedLabel = options.find(o => o.value === value)?.label || '';
      const filtered = options.filter(o => o.label.toLowerCase().includes(search.toLowerCase()));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
            setSearch('');
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const handleSelect = (option) => {
        onChange(option.value);
        setIsOpen(false);
        setSearch('');
      };

      const handleInputChange = (e) => {
        setSearch(e.target.value);
        if (!isOpen) setIsOpen(true);
      };

      const handleInputClick = () => {
        setIsOpen(!isOpen);
        if (!isOpen) setSearch('');
      };

      return (
        <div className="form-group">
          {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
          <div className="searchable-dropdown" ref={dropdownRef}>
            <input
              type="text"
              className="searchable-dropdown-input"
              placeholder={placeholder}
              value={isOpen ? search : selectedLabel}
              onChange={handleInputChange}
              onClick={handleInputClick}
              required={required && !value}
            />
            <span className={'searchable-dropdown-arrow ' + (isOpen ? 'open' : '')}>
              <i className="fas fa-chevron-down"></i>
            </span>
            {isOpen && (
              <div className="searchable-dropdown-list">
                <div className={'searchable-dropdown-item ' + (!value ? 'selected' : '')} onClick={() => handleSelect({ value: '', label: '' })}>
                  {placeholder}
                </div>
                {filtered.length > 0 ? (
                  filtered.map((option, idx) => (
                    <div key={idx} className={'searchable-dropdown-item ' + (value === option.value ? 'selected' : '')} onClick={() => handleSelect(option)}>
                      {option.label}
                    </div>
                  ))
                ) : (
                  <div className="searchable-dropdown-item no-results">No results found</div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function HomePage({ onStaffLogin, onOrderFood, onTrackOrder, cart, setCart, theme, toggleTheme, scrollRequest, onScrollHandled, onMenu, onAccount, customerName }) {

            html: '<div class="swal-form"><p style="color:var(--warm-muted);margin-bottom:12px;font-size:13px">Select add-ons (optional):</p>' + extrasHtml + '</div>',
            width: 420,
            showCancelButton: true,
            confirmButtonText: '<i class="fas fa-cart-plus"></i> Add to Cart',
            confirmButtonColor: '#b54d2d',
            cancelButtonText: 'Skip Extras',
            preConfirm: () => {
              const selectedExtras = [];
              document.querySelectorAll('.swal-extra-check:checked').forEach(cb => {
                const idx = parseInt(cb.dataset.idx);
                selectedExtras.push({ extra_name: itemExtras[idx].extra_name, extra_price: parseFloat(itemExtras[idx].extra_price) });
              });
              return selectedExtras;
            }
          }).then((result) => {
            if (result.isConfirmed || result.dismiss === Swal.DismissReason.cancel) {
              const selectedExtras = result.isConfirmed ? result.value : [];
              addToCartWithExtras(item, selectedExtras);
            }
          });
        } else {

        }

      const addToCartWithExtras = (item, extras, qty) => {
        qty = qty || 1;

        triggerCartFeedback((qty > 1 ? qty + '× ' : '') + item.name + ' added to cart');

      // Items with add-ons open the detail sheet; others go straight into the cart
      const quickAdd = (item) => ((extrasCache[item.item_id] || []).length ? setDetailItem(item) : addToCartWithExtras(item, [], 1));

          if (newQty <= 0) return null;
          const extrasTotal = c.extras ? c.extras.reduce((s, e) => s + e.extra_price, 0) : 0;
          return { ...c, qty: newQty, total_price: newQty * (c.unit_price + extrasTotal) };

            </div>
            <div className="hp-footer-bottom">
              <p>Developed with <i className="fas fa-heart" style={{color: '#ea4335'}}></i> by <strong>Fanen Iorwuese</strong> | v3.0.0</p>
            </div>
          </footer>
        </div>
      );
    }

    // ==================== CHECKOUT PAGE (No Login Required) ====================
    function CheckoutPage({ cart, setCart, onBack, onTrackOrder, customer, onSignIn }) {
      const [menuItems, setMenuItems] = useState([]);
      const [combos, setCombos] = useState([]);
      const [menuLoading, setMenuLoading] = useState(true);
      const [posCategory, setPosCategory] = useState('all');
      const [formItems, setFormItems] = useState(cart || []);
      const [customerInfo, setCustomerInfo] = useState(() => ({ name: (customer && customer.name) || '', phone: (customer && customer.phone) || '', email: (customer && customer.email) || '', address: '', city: '' }));
      // Prefill from the signed-in customer's profile without overwriting anything typed
      useEffect(() => {
        if (!customer) return;
        setCustomerInfo(ci => ({ ...ci, name: ci.name || customer.name || '', phone: ci.phone || customer.phone || '', email: ci.email || customer.email || '' }));
      }, [customer && customer.email]);
      const [formData, setFormData] = useState({ type: 'delivery', notes: '', payment_method: 'cash' });
      const [submitting, setSubmitting] = useState(false);
      const [orderResult, setOrderResult] = useState(null);
      const [promoCode, setPromoCode] = useState('');
      const [promoDiscount, setPromoDiscount] = useState(0);
      const [promoApplied, setPromoApplied] = useState(null);
      const [promoLoading, setPromoLoading] = useState(false);
      const [extrasCache, setExtrasCache] = useState({});
      // Arriving with items → order form first, item picker collapsed below. Arriving empty → picker first.
      const [menuFirst] = useState(() => !(cart && cart.length));
      const [moreOpen, setMoreOpen] = useState(() => !(cart && cart.length));
      const openMore = () => {
        setMoreOpen(true);
        setTimeout(() => { const el = document.getElementById('checkout-more'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
      };

      const PAYSTACK_PUBLIC_KEY = 'pk_live_46d90e069409021cfb0f58fd50156c325e10e5d8'; // ← replace with your real public key

      useEffect(() => {
        Promise.all([
          serverCall('getPublicMenu'),
          serverCall('getPublicCombos'),
          serverCall('getAllPublicExtras')
        ]).then(([menuRes, comboRes, extrasRes]) => {
          if (menuRes.success) setMenuItems(menuRes.data);
          if (comboRes.success) setCombos(comboRes.data);
          if (extrasRes.success && extrasRes.data) setExtrasCache(extrasRes.data);
          setMenuLoading(false);
        }).catch(() => setMenuLoading(false));
      }, []);

      // Keep the shared cart (bottom-nav badge, homepage cart) in sync with checkout edits
      useEffect(() => { if (setCart && !orderResult) setCart(formItems); }, [formItems]);

      const posUpdateQty = (cartKey, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi._cartKey !== cartKey) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          const extrasTotal = fi.extras ? fi.extras.reduce((s,e) => s + e.extra_price, 0) : 0;
          return { ...fi, qty: newQty, total_price: newQty * (fi.unit_price + extrasTotal) };
        }).filter(Boolean));
      };

      const removeItem = (cartKey) => setFormItems(formItems.filter(fi => fi._cartKey !== cartKey));

      const posAddItemSimple = (menuItem) => {
        const itemExtras = extrasCache[menuItem.item_id];
        if (itemExtras && itemExtras.length > 0) {
          const extrasHtml = itemExtras.map((ex, idx) =>
            '<label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,248,239,0.6);margin-bottom:8px;cursor:pointer;border:1px solid rgba(34,27,24,0.06)"><input type="checkbox" class="swal-extra-check" data-idx="' + idx + '" style="width:18px;height:18px" /><span style="flex:1;font-weight:500">' + escapeHtml(ex.extra_name) + '</span><span style="color:var(--navy-accent);font-weight:700">+' + formatPrice(ex.extra_price) + '</span></label>'
          ).join('');
          Swal.fire({
            title: '<i class="fas fa-plus-circle" style="color:#221b18"></i> ' + escapeHtml(menuItem.name),
            html: '<div class="swal-form"><p style="color:var(--warm-muted);margin-bottom:12px;font-size:13px">Select add-ons (optional):</p>' + extrasHtml + '</div>',
            width: 420,
            showCancelButton: true,
            confirmButtonText: '<i class="fas fa-cart-plus"></i> Add to Cart',
            confirmButtonColor: '#b54d2d',
            cancelButtonText: 'Skip Extras',
            preConfirm: () => {
              const selectedExtras = [];
              document.querySelectorAll('.swal-extra-check:checked').forEach(cb => {
                const idx = parseInt(cb.dataset.idx);
                selectedExtras.push({ extra_name: itemExtras[idx].extra_name, extra_price: parseFloat(itemExtras[idx].extra_price) });
              });
              return selectedExtras;
            }
          }).then((result) => {
            if (result.isConfirmed || result.dismiss === Swal.DismissReason.cancel) {
              const selectedExtras = result.isConfirmed ? result.value : [];
              const extrasKey = selectedExtras.map(e => e.extra_name).sort().join(',');
              const cartKey = menuItem.item_id + '_' + extrasKey;
              const existing = formItems.find(fi => fi._cartKey === cartKey);
              if (existing) {
                setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * (fi.unit_price + (fi.extras ? fi.extras.reduce((s,e) => s + e.extra_price, 0) : 0)) } : fi));
              } else {
                const extrasTotal = selectedExtras.reduce((s,e) => s + e.extra_price, 0);
                setFormItems(prev => [...prev, { item_id: menuItem.item_id, _cartKey: cartKey, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), extras: selectedExtras, total_price: parseFloat(menuItem.price) + extrasTotal }]);
              }
            }
          });
        } else {
          const cartKey = menuItem.item_id + '_';
          const existing = formItems.find(fi => fi._cartKey === cartKey);
          if (existing) {
            setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
          } else {
            setFormItems(prev => [...prev, { item_id: menuItem.item_id, _cartKey: cartKey, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), extras: [], total_price: parseFloat(menuItem.price) }]);
          }
        }
      };

      const posAddCombo = (combo) => {
        const cartKey = 'combo_' + combo.combo_id;
        const existing = formItems.find(fi => fi._cartKey === cartKey);
        if (existing) {
          setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems(prev => [...prev, {
            item_id: combo.combo_id, _cartKey: cartKey, item_name: combo.name + ' (Combo)',
            qty: 1, unit_price: combo.combo_price, total_price: combo.combo_price,
            extras: combo.items.map(it => ({ item_id: it.item_id, item_name: it.item_name, qty: it.qty, extra_price: 0 })),
            is_combo: true, combo_id: combo.combo_id
          }]);
        }
      };

      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge - promoDiscount;

      const applyPromo = async () => {
        if (!promoCode.trim()) return;
        setPromoLoading(true);
        try {
          const res = await serverCall('validatePromoCode', promoCode.trim().toUpperCase(), formSubtotal);
          setPromoLoading(false);
          if (res.success) {
            setPromoDiscount(res.data.discount || 0);
            setPromoApplied(res.data);
            Swal.fire({ icon: 'success', title: 'Promo Applied!', text: 'Discount: ' + formatPrice(res.data.discount), timer: 1500, showConfirmButton: false });
          } else {
            Swal.fire({ icon: 'error', title: 'Invalid', text: res.message || 'Invalid promo code', confirmButtonColor: '#b54d2d' });
          }
        } catch (e) {
          setPromoLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to validate promo code', confirmButtonColor: '#b54d2d' });
        }
      };

      const removePromo = () => {
        setPromoCode('');
        setPromoDiscount(0);
        setPromoApplied(null);
      };

      const finalizeOrder = async (extraPayload = {}) => {
        setSubmitting(true);
        try {
          const payload = {
            customer_name: customerInfo.name.trim(),
            phone: customerInfo.phone.trim(),
            email: customerInfo.email.trim(),
            type: formData.type,
            address: customerInfo.address.trim(),
            city: customerInfo.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            payment_method: formData.payment_method,
            promo_code: promoApplied ? promoApplied.code : '',
            discount: promoDiscount,
            total: formTotal,
            ...extraPayload
          };
          // Signed-in customers send their access token so the server links the order to their account
          const token = customer ? await getAccessToken() : null;
          const res = token ? await serverCallSecure('addPublicOrder', { ...payload, access_token: token }) : await serverCall('addPublicOrder', payload);
          setSubmitting(false);
          if (res.success) {
            setOrderResult(res.data);
            if (setCart) setCart([]);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: res.message });
          }
        } catch (e) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: e.message || 'Failed to place order. Please try again.' });
        }
      };

      const openPaystackCheckout = () => {
        if (typeof PaystackPop === 'undefined') {
          Swal.fire({ icon: 'error', title: 'Paystack Not Loaded', text: 'Please refresh the page and try again.' });
          return;
        }
        const paystack = new PaystackPop();
        const reference = 'CFL-' + Date.now() + '-' + Math.floor(Math.random() * 10000);

        paystack.newTransaction({
          key: PAYSTACK_PUBLIC_KEY,
          email: customerInfo.email.trim() || 'customer@chopfastlagos.com',
          amount: Math.round(formTotal * 100),
          currency: 'NGN',
          reference: reference,
          metadata: {
            custom_fields: [
              { display_name: "Customer", variable_name: "customer_name", value: customerInfo.name },
              { display_name: "Phone", variable_name: "phone", value: customerInfo.phone }
            ]
          },
          onSuccess: async (transaction) => {
            Swal.fire({ title: 'Verifying payment...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const verifyRes = await serverCall('verifyPaystackPayment', transaction.reference, formTotal);
              Swal.close();
              if (verifyRes.success) {
                await finalizeOrder({ payment_reference: transaction.reference, payment_method: 'paystack' });
              } else {
                Swal.fire({ icon: 'error', title: 'Payment Verification Failed', text: verifyRes.message });
              }
            } catch (e) {
              Swal.close();
              Swal.fire({ icon: 'error', title: 'Error', text: 'Could not verify payment. Please contact support.' });
            }
          },
          onCancel: () => {
            Swal.fire({ icon: 'info', title: 'Payment Cancelled', text: 'You can try again when ready.' });
          },
          onError: (err) => {
            Swal.fire({ icon: 'error', title: 'Payment Error', text: (err && err.message) || 'Something went wrong' });
          }
        });
      };

      const submitOrder = async () => {
        if (!customerInfo.name.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your name' }); return; }
        if (!customerInfo.phone.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your phone number' }); return; }
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add items to your order' }); return; }
        if (formData.type === 'delivery' && !customerInfo.address.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your delivery address' }); return; }

        if (formData.payment_method === 'paystack') {
          openPaystackCheckout();
        } else {
          await finalizeOrder();
        }
      };

      const printReceipt = () => {
        const o = orderResult;
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const divider = '----------------------------------------';
        const dashed = '- - - - - - - - - - - - - - - - - - - -';

        let itemsHtml = '';
        o.items.forEach(it => {
          const name = it.item_name.length > 22 ? it.item_name.substring(0, 22) + '..' : it.item_name;
          itemsHtml += '<tr><td style="text-align:left;padding:2px 0">' + name + '</td><td style="text-align:center;padding:2px 4px">' + it.qty + '</td><td style="text-align:right;padding:2px 0">' + formatPrice(it.total_price) + '</td></tr>';
          if (it.extras && it.extras.length > 0) {
            it.extras.forEach(ex => {
              itemsHtml += '<tr><td colspan="3" style="text-align:left;padding:0 0 2px 8px;font-size:10px;color:#666">+ ' + ex.extra_name + ' (+' + formatPrice(ex.extra_price) + ')</td></tr>';
            });
          }
        });

        const paymentLabel = o.payment_method === 'paystack' ? 'Paystack (Paid)' : 'Cash on Delivery';

        const receiptHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt - ' + o.order_id + '</title>' +
          '<style>' +
          '@page { margin: 0; size: 80mm auto; }' +
          'body { font-family: "Courier New", Courier, monospace; font-size: 12px; width: 72mm; margin: 0 auto; padding: 8mm 4mm; color: #000; }' +
          '.receipt-center { text-align: center; }' +
          '.receipt-logo { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 6px; display: block; }' +
          '.receipt-store { font-size: 18px; font-weight: bold; margin: 0; letter-spacing: 1px; }' +
          '.receipt-tagline { font-size: 10px; color: #666; margin: 2px 0 8px; }' +
          '.receipt-divider { text-align: center; margin: 6px 0; color: #999; font-size: 11px; letter-spacing: -0.5px; }' +
          '.receipt-info { margin: 4px 0; }' +
          '.receipt-info td { padding: 1px 0; vertical-align: top; }' +
          '.receipt-info .lbl { color: #666; width: 70px; }' +
          '.receipt-items { width: 100%; border-collapse: collapse; margin: 4px 0; }' +
          '.receipt-items th { font-size: 11px; border-bottom: 1px solid #000; padding: 3px 0; text-transform: uppercase; }' +
          '.receipt-totals td { padding: 2px 0; }' +
          '.receipt-grand { font-size: 16px; font-weight: bold; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 6px 0 !important; }' +
          '.receipt-footer { margin-top: 10px; text-align: center; font-size: 10px; color: #666; }' +
          '.receipt-barcode { text-align: center; font-size: 28px; letter-spacing: 4px; margin: 8px 0 4px; }' +
          '.receipt-orderid { text-align: center; font-size: 10px; letter-spacing: 2px; color: #444; }' +
          '.receipt-badge { display: inline-block; padding: 2px 8px; border: 1px solid #000; border-radius: 3px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }' +
          '</style></head><body>' +

          '<div class="receipt-center">' +
          '<img src="' + LOGO_URL + '" class="receipt-logo" />' +
          '<p class="receipt-store">CHOP FAST LAGOS</p>' +
          '<p class="receipt-tagline">Delicious Food Delivered Fresh</p>' +
          '</div>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-info" style="width:100%">' +
          '<tr><td class="lbl">Order</td><td><strong>' + o.order_id + '</strong></td></tr>' +
          '<tr><td class="lbl">Date</td><td>' + dateStr + ' ' + timeStr + '</td></tr>' +
          '<tr><td class="lbl">Type</td><td><span class="receipt-badge">' + o.type.replace('_', ' ') + '</span></td></tr>' +
          '<tr><td class="lbl">Payment</td><td>' + paymentLabel + '</td></tr>' +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-info" style="width:100%">' +
          '<tr><td class="lbl">Customer</td><td>' + o.customer_name + '</td></tr>' +
          '<tr><td class="lbl">Phone</td><td>' + o.phone + '</td></tr>' +
          (o.email ? '<tr><td class="lbl">Email</td><td style="font-size:10px">' + o.email + '</td></tr>' : '') +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-items" style="width:100%">' +
          '<thead><tr><th style="text-align:left">Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Amount</th></tr></thead>' +
          '<tbody>' + itemsHtml + '</tbody>' +
          '</table>' +

          '<div class="receipt-divider">' + dashed + '</div>' +

          '<table class="receipt-totals" style="width:100%">' +
          '<tr><td>Subtotal</td><td style="text-align:right">' + formatPrice(o.subtotal) + '</td></tr>' +
          (o.delivery_charge > 0 ? '<tr><td>Delivery</td><td style="text-align:right">' + formatPrice(o.delivery_charge) + '</td></tr>' : '') +
          (o.discount > 0 ? '<tr><td>Discount' + (o.promo_code ? ' (' + o.promo_code + ')' : '') + '</td><td style="text-align:right;color:#2e7d32">-' + formatPrice(o.discount) + '</td></tr>' : '') +
          '<tr><td class="receipt-grand">TOTAL</td><td class="receipt-grand" style="text-align:right">' + formatPrice(o.total) + '</td></tr>' +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<div class="receipt-barcode">*' + o.order_id + '*</div>' +
          '<div class="receipt-orderid">' + o.order_id + '</div>' +

          '<div class="receipt-footer">' +
          '<p style="margin:8px 0 2px;font-size:12px;color:#000">Thank you for your order!</p>' +
          '<p style="margin:0">Powered by BPA Dynamics</p>' +
          '</div>' +

          '<script>window.onload=function(){window.print();}<\/script>' +
          '</body></html>';

        const printWin = window.open('', '_blank', 'width=350,height=600');
        printWin.document.write(receiptHtml);
        printWin.document.close();
      };

      // ---- ORDER CONFIRMATION PAGE ----
      if (orderResult) {
        return (
          <div style={{minHeight: '100vh', background: 'radial-gradient(circle at top left, rgba(213,162,66,0.22), transparent 28%), radial-gradient(circle at top right, rgba(181,77,45,0.18), transparent 24%), linear-gradient(145deg, #fbf5eb 0%, #f5e8d2 48%, #ecd9bb 100%)', padding: '20px'}}>
            <div style={{maxWidth: '600px', margin: '40px auto', background: 'rgba(255,248,239,0.82)', backdropFilter: 'blur(16px)', borderRadius: '28px', overflow: 'hidden', boxShadow: '0 24px 70px rgba(96,52,25,0.18)', border: '1px solid rgba(255,255,255,0.45)'}}>
              <div style={{background: 'linear-gradient(135deg, #221b18, #3a2f2a)', padding: '30px', textAlign: 'center', color: '#fff8ef', borderRadius: '0 0 22px 22px'}}>
                <i className="fas fa-check-circle" style={{fontSize: '48px', marginBottom: '12px', color: '#d5a242'}}></i>
                <h2 style={{margin: '0 0 8px', fontSize: '24px'}}>Order Confirmed!</h2>
                <p style={{margin: 0, opacity: 0.9, fontSize: '16px'}}>Your order has been placed successfully</p>
              </div>
              <div style={{padding: '24px'}}>
                <div style={{background: 'rgba(255,248,239,0.6)', borderRadius: '18px', padding: '16px', marginBottom: '20px'}}>

                { data: 'name', title: 'Name' },
                { data: 'category', title: 'Category', render: (d) => '<span class="category-badge cat-' + slugifyCategory(d) + '">' + escapeHtml(d) + '</span>' },
                { data: 'price', title: 'Price', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'availability', title: 'Availability', render: (d) => '<span class="avail-badge avail-' + (d === 'Instant' ? 'instant' : 'preorder') + '">' + d + '</span>' },
                { data: null, title: 'Stock', render: (d, t, row) => {
                  if (row.stock_tracking !== 'enabled') return '<span class="stock-na">N/A</span>';
                  const qty = parseInt(row.stock_qty) || 0;
                  const threshold = parseInt(row.low_stock_threshold) || 5;
                  if (qty <= 0) return '<span class="stock-badge stock-out">Out of Stock</span>';
                  if (qty <= threshold) return '<span class="stock-badge stock-low">' + qty + ' left</span>';
                  return '<span class="stock-badge stock-ok">' + qty + '</span>';
                }},
                { data: null, title: 'Schedule', render: (d, t, row) => {
                  if (row.schedule_enabled !== 'yes') return '<span class="schedule-always">Always</span>';
                  return '<span class="schedule-badge"><i class="fas fa-clock"></i> ' + escapeHtml(row.schedule_label || '') + '</span>';
                }},
                { data: 'is_active', title: 'Active', render: (d, t, row) => '<label class="toggle-switch"><input type="checkbox" ' + (d === 'active' ? 'checked' : '') + ' data-id="' + escapeHtml(row.item_id) + '" class="toggle-active" /><span class="toggle-slider"></span></label>' },

            '</div></div>' +
            '</div>',
          width: 620, showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d', cancelButtonText: '<i class="fas fa-times"></i> Cancel',

              document.getElementById('swal-days-container').style.display = this.value === 'yes' ? 'block' : 'none';
            });
            document.querySelectorAll('.swal-day-btn').forEach(btn => {
              btn.addEventListener('click', function() { this.classList.toggle('active'); });
            });
          },
          preConfirm: () => {
            const name = document.getElementById('swal-name').value.trim();
            const category = document.getElementById('swal-category').value;
            const price = document.getElementById('swal-price').value;
            if (!name || !category || !price) { Swal.showValidationMessage('Name, category and price are required'); return false; }
            const imgPreview = document.getElementById('swal-img-preview');
            const currentSrc = imgPreview.src;
            const isNewImage = currentSrc && !currentSrc.startsWith('https://lh3.google');
            const activeDays = [];
            document.querySelectorAll('.swal-day-btn.active').forEach(b => activeDays.push(b.dataset.day));
            return {
              item_id: itemData.item_id, name, category, price,
              availability: document.getElementById('swal-avail').value,
              description: document.getElementById('swal-desc').value.trim(),
              imageData: isNewImage ? currentSrc : null,
              existingUrl: itemData.image_url,
              stock_tracking: document.getElementById('swal-stock-tracking').value,
              stock_qty: document.getElementById('swal-stock-qty').value,
              low_stock_threshold: document.getElementById('swal-stock-threshold').value,
              schedule_enabled: document.getElementById('swal-sched-enabled').value,
              schedule_days: document.getElementById('swal-sched-enabled').value === 'yes' ? (activeDays.length === 7 ? 'all' : activeDays.join(',')) : 'all',
              schedule_start: document.getElementById('swal-sched-start').value ? new Date(document.getElementById('swal-sched-start').value).toISOString() : '',
              schedule_end: document.getElementById('swal-sched-end').value ? new Date(document.getElementById('swal-sched-end').value).toISOString() : ''
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              let image_url = result.value.existingUrl;
              if (result.value.imageData) {
                const imgRes = await serverCall('uploadMenuImage', result.value.imageData, result.value.item_id + '_' + Date.now() + '.png');
                if (imgRes.success) image_url = imgRes.data.url;
              }
              const res = await serverCall('updateMenuItem', { ...result.value, image_url }, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadItems(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update item' }); }
          }
        });
      };

      const handleDeleteItem = (itemData) => {
        Swal.fire({
          icon: 'warning', title: 'Deactivate Item?',
          text: 'This will mark "' + itemData.name + '" as inactive.',
          showCancelButton: true, confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-ban"></i> Deactivate',
          cancelButtonText: '<i class="fas fa-times"></i> Cancel'
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('deleteMenuItem', itemData.item_id, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Done!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadItems(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to deactivate item' }); }
          }
        });
      };

      return (<>
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-utensils"></i> Menu Items</h2>
            <button className="btn btn-success" onClick={handleAddItem}><i className="fas fa-plus"></i> Add Item</button>
          </div>
          {!loading && (
            <div className="category-tabs">
              {categories.map(cat => (
                <button key={cat} className={'category-tab' + (activeCategory === cat ? ' active' : '')} onClick={() => setActiveCategory(cat)}>{cat === 'ALL' ? 'All' : cat.charAt(0) + cat.slice(1).toLowerCase()}</button>
              ))}
            </div>
          )}
          {loading && <TableSkeleton rows={5} columns={8} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="menuTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>

        {!loading && user.role === 'admin' && <ItemExtrasSection user={user} menuItems={items} />}
      </>);
    }

    // ==================== ITEM EXTRAS SECTION ====================
    function ItemExtrasSection({ user, menuItems }) {
      const [expanded, setExpanded] = useState(false);
      const [extrasLoading, setExtrasLoading] = useState(false);
      const [extras, setExtras] = useState([]);
      const extrasTableRef = useRef(null);

      const loadExtras = async () => {
        setExtrasLoading(true);
        try {
          const result = await serverCall('getAllItemExtras', user.id, user.role);
          setExtrasLoading(false);
          if (result.success) {
            setExtras(result.data);
            initExtrasTable(result.data);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message, confirmButtonColor: '#b54d2d' });
        } catch (err) {
          setExtrasLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load extras', confirmButtonColor: '#b54d2d' });
        }
      };

      const toggleExpanded = () => {
        if (!expanded) { setExpanded(true); loadExtras(); }
        else { setExpanded(false); if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); extrasTableRef.current = null; } catch(e){} } }
      };

      useEffect(() => { return () => { if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); } catch(e){} } }; }, []);

      const initExtrasTable = (data) => {
        if (extrasTableRef.current) { try { extrasTableRef.current.destroy(); extrasTableRef.current = null; $('#extrasTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            const menuMap = {};
            menuItems.forEach(m => { menuMap[m.item_id] = m.name; });

            const table = $('#extrasTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'id', title: 'ID' },
                { data: 'item_id', title: 'Menu Item', render: (d) => '<strong>' + escapeHtml(menuMap[d] || d) + '</strong>' },
                { data: 'extra_name', title: 'Extra Name', render: (d) => escapeHtml(d) },
                { data: 'extra_price', title: 'Price', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'is_active', title: 'Status', render: (d) => '<span class="status-badge ' + (d === 'active' ? 'status-active' : 'status-inactive') + '">' + (d === 'active' ? 'Active' : 'Inactive') + '</span>' },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>' }
              ],
              pageLength: 10, responsive: true, dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,2,3,4] } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,2,3,4] } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,3,4] } }
              ],
              order: [[0, 'desc']]
            });

            $('#extrasTable').off('click', '.action-icon').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              const rowData = table.row($(this).parents('tr')).data();
              if (action === 'edit') handleEditExtra(rowData);
              else handleDeleteExtra(rowData);
            });

            extrasTableRef.current = table;
          } catch(e) { console.error('Extras DataTable init error:', e); }
        }, 150);
      };

      const menuOptionsHtml = menuItems.map(m => '<option value="' + escapeHtml(m.item_id) + '">' + escapeHtml(m.name) + ' (' + escapeHtml(m.item_id) + ')</option>').join('');

      const handleAddExtra = () => {
        Swal.fire({
          title: '<i class="fas fa-plus-circle" style="color:#221b18"></i> Add Item Extra',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Menu Item *</label><select id="swal-itemid"><option value="">Select item...</option>' + menuOptionsHtml + '</select></div>' +
            '<div class="form-group"><label>Extra Name *</label><input type="text" id="swal-ename" placeholder="e.g. Extra Cheese"></div>' +
            '<div class="form-group"><label>Extra Price *</label><input type="number" id="swal-eprice" placeholder="0" min="0" step="1"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-estatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600, showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d',
          preConfirm: () => {
            const item_id = document.getElementById('swal-itemid').value;
            const extra_name = document.getElementById('swal-ename').value.trim();
            const extra_price = document.getElementById('swal-eprice').value;
            if (!item_id || !extra_name || !extra_price) { Swal.showValidationMessage('Item, name and price are required'); return false; }
            return { item_id, extra_name, extra_price: parseFloat(extra_price), is_active: document.getElementById('swal-estatus').value };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Saving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('addItemExtra', result.value, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadExtras(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to add extra', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      const handleEditExtra = (extraData) => {
        Swal.fire({
          title: '<i class="fas fa-edit" style="color:#221b18"></i> Edit Item Extra',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Menu Item *</label><select id="swal-itemid"><option value="">Select item...</option>' + menuOptionsHtml + '</select></div>' +
            '<div class="form-group"><label>Extra Name *</label><input type="text" id="swal-ename" value="' + escapeHtml(extraData.extra_name) + '"></div>' +
            '<div class="form-group"><label>Extra Price *</label><input type="number" id="swal-eprice" value="' + extraData.extra_price + '" min="0" step="1"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-estatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600, showCancelButton: true,
          confirmButtonText: '<i class="fas fa-save"></i> Update',
          confirmButtonColor: '#b54d2d',
          didOpen: () => {
            document.getElementById('swal-itemid').value = extraData.item_id;
            document.getElementById('swal-estatus').value = extraData.is_active || 'active';
          },
          preConfirm: () => {
            const item_id = document.getElementById('swal-itemid').value;
            const extra_name = document.getElementById('swal-ename').value.trim();
            const extra_price = document.getElementById('swal-eprice').value;
            if (!item_id || !extra_name || !extra_price) { Swal.showValidationMessage('Item, name and price are required'); return false; }
            return { id: extraData.id, item_id, extra_name, extra_price: parseFloat(extra_price), is_active: document.getElementById('swal-estatus').value };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('updateItemExtra', result.value, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadExtras(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update extra', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      const handleDeleteExtra = (extraData) => {
        Swal.fire({
          icon: 'warning', title: 'Delete Extra?',
          text: 'Delete "' + extraData.extra_name + '"?',
          showCancelButton: true, confirmButtonColor: '#ea4335',
          confirmButtonText: '<i class="fas fa-trash"></i> Delete'
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Deleting...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('deleteItemExtra', extraData.id, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Deleted!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadExtras(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message, confirmButtonColor: '#b54d2d' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to delete extra', confirmButtonColor: '#b54d2d' }); }
          }
        });
      };

      return (
        <div className="data-section" style={{marginTop: '20px'}}>
          <div className="section-header" style={{cursor: 'pointer'}} onClick={toggleExpanded}>
            <h2><i className={'fas ' + (expanded ? 'fa-chevron-down' : 'fa-chevron-right')} style={{fontSize: '14px', marginRight: '6px'}}></i><i className="fas fa-puzzle-piece"></i> Item Extras / Add-ons</h2>
            {expanded && <button className="btn btn-success" onClick={(e) => { e.stopPropagation(); handleAddExtra(); }}><i className="fas fa-plus"></i> Add Extra</button>}
          </div>
          {expanded && (
            <>
              {extrasLoading && <TableSkeleton rows={4} columns={5} />}
              <div style={{ display: extrasLoading ? 'none' : 'block' }}>
                <table id="extrasTable" className="display" style={{width: '100%'}}></table>
              </div>
            </>
          )}
        </div>
      );
    }
    // ==================== MENU READ-ONLY VIEW (CHEF) ====================
    function MenuReadOnlyView({ user }) {
      const [loading, setLoading] = useState(true);
      const [items, setItems] = useState([]);
      const [activeCategory, setActiveCategory] = useState('ALL');
      const categories = [
        'ALL',
        'SOFT DRINK','GIN & VODKA','SWALLOW','BREAKFAST','PROTEIN','CLASSIC PEPPER SOUP','RR KITCHEN NIGERIAN SOUP','SALAD','SHOTS','SIDES (EXTRAS)','KEBAB','MAIN COURSE','RR KITCHEN CHINESE DISH','RR KITCHEN CONTINENTAL DISH - STARTER','WHISKEY','WHITE WINE','SHOT BEVERAGES','MILKSHAKES','TEQUILA','RED WINE','ROSE WINE','NON-ALCOHOLIC DRINK','RR KITCHEN SANDWICH AND BURGER','RR CHICKEN COMBOS','PASTA','RICE DISHES','SPECIAL COCKTAILS','JUICES/SMOOTHIES','BEER','OTHERS','DESSERT','NIGERIAN RICE DISHES','PLATTER','RR GRILLED SECTION','LIGHT MEALS','CLASSIC COCKTAILS','COGNAC','CHAMPAGNE'
      ];

      useEffect(() => {
        const load = async () => {
          try {
            const result = await serverCall('getMenuItems', user.id, user.role);
            setLoading(false);
            if (result.success) setItems(result.data.filter(i => i.is_active === 'active'));
            else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          } catch (err) {
            setLoading(false);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load menu' });
          }
        };
        load();
      }, []);

      const filtered = activeCategory === 'ALL' ? items : items.filter(i => i.category === activeCategory);

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-utensils"></i> Menu</h2></div><div className="menu-grid">{[...Array(6)].map((_, i) => <DashboardCardSkeleton key={i} />)}</div></div>;

      return (
        <div className="data-section">
          <div className="section-header"><h2><i className="fas fa-utensils"></i> Menu</h2></div>
          <div className="category-tabs">
            {categories.map(cat => (
              <button key={cat} className={'category-tab' + (activeCategory === cat ? ' active' : '')} onClick={() => setActiveCategory(cat)}>{cat === 'ALL' ? 'All' : cat.charAt(0) + cat.slice(1).toLowerCase()}</button>
            ))}
          </div>
          <div className="menu-grid">
            {filtered.map(item => (
              <div className="menu-card" key={item.item_id}>
                <div className="menu-card-img">
                  {item.image_url ? <img src={item.image_url} alt={item.name} /> : <i className="fas fa-image"></i>}
                </div>
                <div className="menu-card-body">
                  <h4>{item.name}</h4>
                  <p>{item.description}</p>
                  <div className="menu-card-footer">
                    <span className="menu-card-price">{formatPrice(item.price)}</span>
                    <span className={'avail-badge avail-' + (item.availability === 'Instant' ? 'instant' : 'preorder')}>{item.availability}</span>
                  </div>
                  <div style={{marginTop: '8px'}}>
                    <span className={'category-badge cat-' + slugifyCategory(item.category)}>{item.category}</span>
                  </div>
                </div>
              </div>
            ))}
            {filtered.length === 0 && <p style={{color: '#888', padding: '20px'}}>No items in this category.</p>}
          </div>
        </div>
      );
    }

    // ==================== ORDERS VIEW (ADMIN) ====================
    function OrdersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);
      const [viewMode, setViewMode] = useState('kanban');
      const [selectedOrder, setSelectedOrder] = useState(null);
      const [riders, setRiders] = useState([]);
      const tableInstanceRef = useRef(null);

      const [showOrderForm, setShowOrderForm] = useState(false);
      const [menuItemsList, setMenuItemsList] = useState([]);
      const [formItems, setFormItems] = useState([]);
      const [formData, setFormData] = useState({ customer_name: '', phone: '', email: '', type: 'delivery', address: '', city: '', notes: '', payment_method: 'cash' });
      const [posCategory, setPosCategory] = useState('all');
      const [submitting, setSubmitting] = useState(false);
      const [customersList, setCustomersList] = useState([]);
      const [selectedCustomerId, setSelectedCustomerId] = useState('');

      const [confirmAction, setConfirmAction] = useState(null);
      const [actionLoading, setActionLoading] = useState(false);
      const [assignModal, setAssignModal] = useState(null);
      const [assignRiderId, setAssignRiderId] = useState('');

      useEffect(() => {
        loadOrders();
        loadRiders();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadOrders = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setOrders(result.data);
            if (viewMode === 'table') setTimeout(() => initTable(result.data), 150);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load orders' });
        }
      };

      const loadRiders = async () => {
        try { const res = await serverCall('getActiveRiders', user.id, user.role); if (res.success) setRiders(res.data); } catch(e) {}
      };

      const loadMenuForForm = async () => {
        try { const res = await serverCall('getMenuItems', user.id, user.role); if (res.success) setMenuItemsList(res.data.filter(i => i.is_active === 'active')); } catch(e) {}
      };

      const loadCustomersForForm = async () => {
        try { const res = await serverCall('getCustomersList', user.id, user.role); if (res.success) setCustomersList(res.data); } catch(e) {}
      };

      const handleCustomerSelect = (custId) => {
        setSelectedCustomerId(custId);
        if (!custId) {
          setFormData({ customer_name: '', phone: '', email: '', type: formData.type, address: '', city: '', notes: '', payment_method: 'cash' });
          return;
        }
        const cust = customersList.find(c => String(c.user_id) === String(custId));
        if (cust) {
          setFormData(prev => ({
            ...prev,
            customer_name: cust.name || '',
            phone: cust.phone || '',
            email: cust.email || '',
            address: cust.address || '',
            city: cust.city || ''
          }));
        }
      };

      const openOrderForm = () => {
        setFormData({ customer_name: '', phone: '', email: '', type: 'delivery', address: '', city: '', notes: '', payment_method: 'cash' });
        setFormItems([]);
        setPosCategory('all');
        setSelectedCustomerId('');
        loadMenuForForm();
        loadCustomersForForm();
        setShowOrderForm(true);
      };

      const posAddItem = (menuItem) => {
        const existing = formItems.find(fi => fi.item_id === menuItem.item_id);
        if (existing) {
          setFormItems(formItems.map(fi => fi.item_id === menuItem.item_id ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems([...formItems, { item_id: menuItem.item_id, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), total_price: parseFloat(menuItem.price), extras: [] }]);
        }
      };

      const posUpdateQty = (itemId, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi.item_id !== itemId) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          return { ...fi, qty: newQty, total_price: newQty * fi.unit_price };
        }).filter(Boolean));
      };

      const removeItemFromForm = (itemId) => setFormItems(formItems.filter(fi => fi.item_id !== itemId));

      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge;

      const submitOrder = async () => {
        if (!formData.customer_name.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Customer name is required' }); return; }
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add at least one item' }); return; }

        setSubmitting(true);
        try {
          const payload = {
            customer_name: formData.customer_name.trim(),
            phone: formData.phone.trim(),
            email: formData.email.trim(),
            type: formData.type,
            address: formData.address.trim(),
            city: formData.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            subtotal: formSubtotal,
            delivery_charge: formDeliveryCharge,
            total: formTotal,
            customer_user_id: selectedCustomerId || '',
            payment_method: formData.payment_method
          };
          const res = await serverCall('addOrder', payload, user.id, user.role);
          setSubmitting(false);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Order Created!', text: 'Order ID: ' + res.data.order_id, timer: 2500, showConfirmButton: false });
            setShowOrderForm(false);
            setTimeout(() => loadOrders(), 100);
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch (err) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to create order.' });
        }
      };

      const initTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#ordersTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            tableInstanceRef.current = $('#ordersTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'order_id', title: 'Order ID', render: (d) => '<strong style="color:#221b18">' + escapeHtml(d) + '</strong>' },
                { data: 'customer_name', title: 'Customer', render: (d) => escapeHtml(d || '-') },
                { data: 'type', title: 'Type', render: (d) => '<span class="type-badge type-' + d.replace('_', '') + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'total', title: 'Total', render: (d) => '<strong>' + formatPrice(d) + '</strong>' },
                { data: 'payment_method', title: 'Payment', render: (d) => '<span style="font-size:12px;color:' + ((d || 'cash') === 'paystack' ? '#0ba4db' : '#2e7d32') + '"><i class="' + ((d || 'cash') === 'paystack' ? 'fas fa-credit-card' : 'fas fa-money-bill-wave') + '"></i> ' + ((d || 'cash') === 'paystack' ? 'Paystack' : 'Cash') + '</span>' },
                { data: 'status', title: 'Status', render: (d) => '<span class="order-status order-' + d + '">' + d.replace('_', ' ') + '</span>' },
                { data: 'timestamp', title: 'Time', render: (d) => formatDate(d) },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="btn btn-primary btn-sm" data-action="view" style="padding:5px 10px;font-size:12px"><i class="fas fa-eye"></i></button>' }
              ],
              pageLength: 10, responsive: true, dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: [0,1,2,3,4,5,6] } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: [0,1,2,3,4,5,6] } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: [0,1,2,3,4,5,6] } }
              ],
              order: [[0, 'desc']]
            });
            $('#ordersTable').off('click', '[data-action=view]').on('click', '[data-action=view]', function() {
              const $tr = $(this).closest('tr');
              let row = tableInstanceRef.current.row($tr);
              if (!row.data()) row = tableInstanceRef.current.row($tr.prev('tr'));
              if (row.data()) setSelectedOrder(row.data());
            });
            $('#ordersTable tbody').off('click', 'tr').on('click', 'tr', function(e) {
              if ($(e.target).closest('[data-action]').length) return;
              if ($(this).hasClass('child')) return;
              const row = tableInstanceRef.current.row(this);
              if (row.data()) setSelectedOrder(row.data());
            });
          } catch(e) { console.error('DataTable init error:', e); }
        }, 150);
      };

      useEffect(() => { if (!loading && orders.length > 0 && viewMode === 'table') initTable(orders); }, [viewMode]);

      const statusColors = { pending: '#e65100', confirmed: '#1565c0', preparing: '#6a1b9a', ready: '#2e7d32', out_for_delivery: '#00838f', delivered: '#155724', cancelled: '#721c24' };
      const statusLabels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'Out for Delivery', delivered: 'Delivered', cancelled: 'Cancelled' };

      const getOrderActions = (order) => {
        const actions = [];
        const s = order.status;
        const t = order.type;
        if (s === 'pending') actions.push({ action: 'confirm', label: 'Confirm Order', icon: 'fa-check', color: '#1565c0', toStatus: 'confirmed' });
        if (s === 'confirmed') {
          actions.push({ action: 'prepare', label: 'Start Preparing', icon: 'fa-fire', color: '#6a1b9a', toStatus: 'preparing' });
          if (t === 'delivery' && !order.assigned_rider_id) actions.push({ action: 'assign_rider', label: 'Assign Rider', icon: 'fa-motorcycle', color: '#00838f', toStatus: null });
        }
        if (s === 'preparing') actions.push({ action: 'ready', label: 'Mark Ready', icon: 'fa-box', color: '#2e7d32', toStatus: 'ready' });
        if (s === 'ready') {
          if (t === 'delivery') {
            if (order.assigned_rider_id) actions.push({ action: 'out_for_delivery', label: 'Out for Delivery', icon: 'fa-motorcycle', color: '#00838f', toStatus: 'out_for_delivery' });
            else actions.push({ action: 'assign_and_deliver', label: 'Assign Rider & Deliver', icon: 'fa-motorcycle', color: '#00838f', toStatus: 'out_for_delivery' });
          } else {
            actions.push({ action: 'deliver', label: 'Mark Delivered', icon: 'fa-check-double', color: '#155724', toStatus: 'delivered' });
          }
        }
        if (s === 'out_for_delivery') actions.push({ action: 'deliver', label: 'Mark Delivered', icon: 'fa-check-double', color: '#155724', toStatus: 'delivered' });
        if (['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery'].includes(s)) actions.push({ action: 'cancel', label: 'Cancel Order', icon: 'fa-times', color: '#ea4335', toStatus: 'cancelled' });
        return actions;
      };

      const openConfirmModal = (orderId, actionObj) => {
        const order = orders.find(o => o.order_id === orderId);
        if (actionObj.action === 'assign_rider' || actionObj.action === 'assign_and_deliver') {
          setAssignRiderId('');
          setAssignModal({ orderId, alsoDeliver: actionObj.action === 'assign_and_deliver' });
          return;
        }
        setConfirmAction({
          orderId,
          action: actionObj.action,
          label: actionObj.label,
          icon: actionObj.icon,
          color: actionObj.color,
          fromStatus: order ? order.status : '',
          toStatus: actionObj.toStatus
        });
      };

      const executeStatusChange = async () => {
        if (!confirmAction) return;
        setActionLoading(true);
        try {
          const res = await serverCall('updateOrderStatus', confirmAction.orderId, confirmAction.toStatus, user.id, user.role);
          setActionLoading(false);
          if (res.success) {
            setConfirmAction(null);
            if (selectedOrder && selectedOrder.order_id === confirmAction.orderId) setSelectedOrder(null);
            loadOrders();
            Swal.fire({ icon: 'success', title: 'Updated!', text: res.message, timer: 1500, showConfirmButton: false });
          } else { setConfirmAction(null); Swal.fire({ icon: 'error', title: 'Error', text: res.message }); }
        } catch(e) {
          setActionLoading(false);
          setConfirmAction(null);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update status' });
        }
      };

      const executeAssignRider = async () => {
        if (!assignModal || !assignRiderId) return;
        setActionLoading(true);
        try {
          const fnName = assignModal.alsoDeliver ? 'assignRiderAndDeliver' : 'assignRider';
          const res = await serverCall(fnName, assignModal.orderId, assignRiderId, user.id, user.role);
          setActionLoading(false);
          if (res.success) {
            setAssignModal(null);
            setAssignRiderId('');
            loadOrders();
            Swal.fire({ icon: 'success', title: 'Assigned!', text: res.message, timer: 1500, showConfirmButton: false });
          } else { setAssignModal(null); Swal.fire({ icon: 'error', title: 'Error', text: res.message }); }
        } catch(e) {
          setActionLoading(false);
          setAssignModal(null);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to assign rider' });
        }
      };

      const renderConfirmModal = () => {
        if (!confirmAction) return null;
        return (
          <div className="confirm-modal-overlay" onClick={() => !actionLoading && setConfirmAction(null)}>
            <div className="confirm-modal" onClick={(e) => e.stopPropagation()}>
              <div className="confirm-modal-icon" style={{background: confirmAction.color + '20', color: confirmAction.color}}>
                <i className={'fas ' + confirmAction.icon} style={{fontSize: '28px'}}></i>
              </div>
              <h3 style={{margin: '16px 0 8px', color: 'var(--navy-primary)', fontSize: '20px', fontFamily: "'Cormorant Garamond', serif"}}>{confirmAction.label}</h3>
              <p style={{color: 'var(--warm-muted)', fontSize: '14px', marginBottom: '16px'}}>
                Are you sure you want to change order <strong>{confirmAction.orderId}</strong> status?
              </p>
              <div className="confirm-modal-flow">
                <span className={'order-status order-' + confirmAction.fromStatus}>{statusLabels[confirmAction.fromStatus]}</span>
                <i className="fas fa-arrow-right" style={{color: '#999'}}></i>
                <span className={'order-status order-' + confirmAction.toStatus}>{statusLabels[confirmAction.toStatus]}</span>
              </div>
              <div className="confirm-modal-actions">
                <button className="btn btn-secondary" onClick={() => setConfirmAction(null)} disabled={actionLoading}>Cancel</button>
                <button className="btn" style={{background: confirmAction.color, color: 'white'}} onClick={executeStatusChange} disabled={actionLoading}>
                  {actionLoading ? <><i className="fas fa-spinner fa-spin"></i> Updating...</> : <><i className={'fas ' + confirmAction.icon}></i> {confirmAction.label}</>}
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderAssignModal = () => {
        if (!assignModal) return null;
        return (
          <div className="confirm-modal-overlay" onClick={() => !actionLoading && setAssignModal(null)}>
            <div className="confirm-modal" onClick={(e) => e.stopPropagation()}>
              <div className="confirm-modal-icon" style={{background: '#00838f20', color: '#00838f'}}>
                <i className="fas fa-motorcycle" style={{fontSize: '28px'}}></i>
              </div>
              <h3 style={{margin: '16px 0 8px', color: 'var(--navy-primary)', fontSize: '20px', fontFamily: "'Cormorant Garamond', serif"}}>{assignModal.alsoDeliver ? 'Assign Rider & Send for Delivery' : 'Assign Rider'}</h3>
              <p style={{color: 'var(--warm-muted)', fontSize: '14px', marginBottom: '16px'}}>
                Select a rider for order <strong>{assignModal.orderId}</strong>
                {assignModal.alsoDeliver && <><br /><span style={{color: '#00838f'}}>Order will be sent for delivery after assignment</span></>}
              </p>
              <div style={{marginBottom: '20px'}}>
                <select value={assignRiderId} onChange={(e) => setAssignRiderId(e.target.value)} style={{width: '100%', padding: '12px', fontSize: '16px', border: '1px solid rgba(34,27,24,0.12)', borderRadius: '14px'}}>
                  <option value="">-- Select Rider --</option>
                  {riders.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
              <div className="confirm-modal-actions">
                <button className="btn btn-secondary" onClick={() => setAssignModal(null)} disabled={actionLoading}>Cancel</button>
                <button className="btn" style={{background: '#00838f', color: 'white'}} onClick={executeAssignRider} disabled={actionLoading || !assignRiderId}>
                  {actionLoading ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-motorcycle"></i> {assignModal.alsoDeliver ? 'Assign & Deliver' : 'Assign Rider'}</>}
                </button>
              </div>
            </div>
          </div>
        );
      };

      const renderKanban = () => {
        const columns = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
        return (
          <div className="kanban-board">
            {columns.map(status => {
              const colOrders = orders.filter(o => o.status === status);
              return (
                <div className="kanban-column" key={status}>
                  <div className="kanban-column-header" style={{background: statusColors[status]}}>
                    <span>{statusLabels[status]}</span>
                    <span className="kanban-count">{colOrders.length}</span>
                  </div>
                  {colOrders.map(order => {
                    const actions = getOrderActions(order);
                    return (
                      <div className="kanban-card" key={order.order_id} style={{borderLeftColor: statusColors[status]}} onClick={() => setSelectedOrder(order)}>
                        <div className="kanban-card-header">
                          <strong>{order.order_id}</strong>
                          <span className={'type-badge type-' + order.type.replace('_', '')}>{order.type.replace('_', ' ')}</span>
                        </div>
                        <p><i className="fas fa-user" style={{marginRight: '6px', color: '#999'}}></i>{order.customer_name}</p>
                        <p><strong>{formatPrice(order.total)}</strong> <span style={{fontSize: '11px', color: order.payment_method === 'paystack' ? '#0ba4db' : '#2e7d32'}}><i className={order.payment_method === 'paystack' ? 'fas fa-credit-card' : 'fas fa-money-bill-wave'}></i> {order.payment_method === 'paystack' ? 'Paystack' : 'Cash'}</span></p>
                        {order.assigned_rider_id && <p style={{fontSize: '11px', color: '#00838f'}}><i className="fas fa-motorcycle"></i> Rider assigned</p>}
                        <p style={{fontSize: '11px', color: '#c4b5a5'}}>{getTimeAgo(order.timestamp)}</p>
                        <div className="kanban-card-actions">
                          {actions.map((act, idx) => (
                            <button key={idx} onClick={(e) => { e.stopPropagation(); openConfirmModal(order.order_id, act); }} style={{background: act.color, color: 'white'}}>
                              <i className={'fas ' + act.icon}></i> {act.label.replace('Order', '').replace('Mark ', '').trim()}
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                  {colOrders.length === 0 && <p style={{color: '#ccc', textAlign: 'center', padding: '20px', fontSize: '13px'}}>No orders</p>}
                </div>
              );
            })}
          </div>
        );
      };

      if (showOrderForm) {
        const categories = ['all', ...new Set(menuItemsList.map(m => m.category))];
        const filteredMenu = posCategory === 'all' ? menuItemsList : menuItemsList.filter(m => m.category === posCategory);
        const cartItemIds = formItems.map(fi => fi.item_id);

        return (
          <div className="data-section">
            <div className="section-header">
              <h2><i className="fas fa-cash-register"></i> New Order (POS)</h2>
              <button className="btn btn-secondary" onClick={() => setShowOrderForm(false)}><i className="fas fa-arrow-left"></i> Back to Orders</button>
            </div>

            <div className="data-section" style={{marginBottom: '20px', padding: '20px', borderLeft: '4px solid var(--navy-primary)'}}>
              <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-user"></i> Customer Information</h3>
              <div className="form-grid">
                <SearchableDropdown label="Select Customer" icon="fas fa-user-check" options={customersList.map(c => ({ value: String(c.user_id), label: c.name + ' (' + c.phone + ')' }))} value={selectedCustomerId} onChange={handleCustomerSelect} placeholder="Search customer or leave empty for manual entry..." />
                <div className="form-group"><label><i className="fas fa-user"></i> Customer Name *</label><input type="text" value={formData.customer_name} onChange={(e) => setFormData({...formData, customer_name: e.target.value})} placeholder="Enter customer name" /></div>
                <div className="form-group"><label><i className="fas fa-phone"></i> Phone</label><input type="tel" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} placeholder="Phone number" /></div>
                <div className="form-group"><label><i className="fas fa-envelope"></i> Email</label><input type="email" value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} placeholder="Email address" /></div>
                <div className="form-group"><label><i className="fas fa-tag"></i> Order Type *</label>
                  <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                    <option value="delivery">Delivery</option>
                    <option value="pickup">Pickup</option>
                    <option value="dine_in">Dine In</option>
                  </select>
                </div>
                {formData.type === 'delivery' && (
                  <>
                    <div className="form-group"><label><i className="fas fa-map-marker-alt"></i> Address</label><input type="text" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} placeholder="Delivery address" /></div>
                    <div className="form-group"><label><i className="fas fa-city"></i> City</label><input type="text" value={formData.city} onChange={(e) => setFormData({...formData, city: e.target.value})} placeholder="City" /></div>
                  </>
                )}
                <div className="form-group"><label><i className="fas fa-credit-card"></i> Payment Method</label>
                  <select value={formData.payment_method} onChange={(e) => setFormData({...formData, payment_method: e.target.value})}>
                    <option value="cash">Cash</option>
                    <option value="paystack">Paystack</option>
                  </select>
                </div>
                <div className="form-group" style={{gridColumn: '1 / -1'}}><label><i className="fas fa-sticky-note"></i> Notes</label><input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions (optional)" /></div>
              </div>
            </div>

            <div className="pos-container">
              <div className="pos-grid-section">
                <h3 style={{color: 'var(--navy-primary)', marginBottom: '12px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-utensils"></i> Select Items</h3>
                <div className="category-tabs" style={{marginBottom: '16px'}}>
                  {categories.map(cat => (
                    <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>{cat === 'all' ? 'All Items' : cat}</button>
                  ))}
                </div>
                <div className="pos-grid">
                  {filteredMenu.map(item => {
                    const inCart = cartItemIds.includes(item.item_id);
                    const cartItem = formItems.find(fi => fi.item_id === item.item_id);
                    return (
                      <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddItem(item)}>
                        {inCart && <span className="pos-item-badge">{cartItem.qty}</span>}
                        {item.image_url ? <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} /> : (
                          <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}><i className="fas fa-utensils" style={{fontSize: '24px'}}></i></div>
                        )}
                        <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', lineHeight: '1.2'}}>{item.name}</div>
                        <div style={{fontSize: '11px', color: '#888', marginBottom: '4px'}}>{item.item_id}</div>
                        <div style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                      </div>
                    );
                  })}
                  {filteredMenu.length === 0 && <p style={{color: '#c4b5a5', gridColumn: '1/-1', textAlign: 'center', padding: '30px'}}>No items</p>}
                </div>
              </div>

              <div className="pos-cart-section">
                <div className="pos-cart">
                  <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>
                  {formItems.length === 0 && (
                    <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                      <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                      <p style={{fontSize: '13px'}}>Click items to add</p>
                    </div>
                  )}
                  {formItems.map(fi => (
                    <div key={fi.item_id} className="pos-cart-row" style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                      <div style={{flex: 1, minWidth: 0}}>
                        <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                        <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                      </div>
                      <div className="pos-qty-controls">
                        <button className="pos-qty-btn" type="button" aria-label="Decrease quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, -1); }}>-</button>
                        <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                        <button className="pos-qty-btn" type="button" aria-label="Increase quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, 1); }}>+</button>
                      </div>
                      <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                      <button type="button" aria-label="Remove item" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px', fontSize: '14px'}} onClick={(e) => { e.stopPropagation(); removeItemFromForm(fi.item_id); }}>
                        <i className="fas fa-trash"></i>
                      </button>
                    </div>
                  ))}
                  {formItems.length > 0 && (
                    <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                      <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                      {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                      <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>
                      <button className="btn btn-success" style={{width: '100%', marginTop: '12px', padding: '14px'}} onClick={submitOrder} disabled={submitting || !formData.customer_name.trim()}>
                        {submitting ? <><i className="fas fa-spinner fa-spin"></i> Creating...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (loading) return <div className="data-section"><div className="section-header"><h2><i className="fas fa-shopping-bag"></i> Orders</h2></div><TableSkeleton rows={5} columns={6} /></div>;

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-shopping-bag"></i> Orders</h2>
            <div style={{display: 'flex', gap: '10px', alignItems: 'center'}}>
              <div className="view-toggle">
                <button className={viewMode === 'kanban' ? 'active' : ''} onClick={() => setViewMode('kanban')}><i className="fas fa-columns"></i> Kanban</button>
                <button className={viewMode === 'table' ? 'active' : ''} onClick={() => setViewMode('table')}><i className="fas fa-table"></i> Table</button>
              </div>
              <button className="btn btn-success" onClick={openOrderForm}><i className="fas fa-plus"></i> New Order</button>
            </div>
          </div>

          {viewMode === 'kanban' && renderKanban()}
          {viewMode === 'table' && <div><table id="ordersTable" className="display" style={{width: '100%'}}></table></div>}

          {selectedOrder && (
            <>
              <div className="order-detail-overlay" onClick={() => setSelectedOrder(null)}></div>
              <div className="order-detail-panel">
                <h2>
                  <span><i className="fas fa-receipt"></i> {selectedOrder.order_id}</span>
                  <button type="button" className="close-btn" aria-label="Close order details" onClick={() => setSelectedOrder(null)}><i className="fas fa-times"></i></button>
                </h2>
                <div className="order-detail-section">
                  <h4>Order Info</h4>
                  <div className="order-detail-row"><span className="label">Status</span><span className={'order-status order-' + selectedOrder.status}>{statusLabels[selectedOrder.status]}</span></div>
                  <div className="order-detail-row"><span className="label">Type</span><span className={'type-badge type-' + selectedOrder.type.replace('_', '')}>{selectedOrder.type.replace('_', ' ')}</span></div>
                  <div className="order-detail-row"><span className="label">Time</span><span className="value">{formatDate(selectedOrder.timestamp)}</span></div>
                  {selectedOrder.assigned_rider_id && <div className="order-detail-row"><span className="label">Rider</span><span className="value"><i className="fas fa-motorcycle" style={{color: '#00838f'}}></i> Rider #{selectedOrder.assigned_rider_id}</span></div>}

                </div>
                {selectedOrder.notes && (
                  <div className="order-detail-section">
                    <h4>Notes</h4>

                  </div>
                </div>
              </div>
            </>
          )}

          {renderConfirmModal()}
          {renderAssignModal()}
        </div>
      );
    }

    // ==================== KITCHEN VIEW (CHEF) ====================
    function KitchenView({ user }) {
      const [loading, setLoading] = useState(true);
      const [orders, setOrders] = useState([]);

      const loadOrders = async () => {
        try {
          const result = await serverCall('getOrders', user.id, user.role);
          setLoading(false);
          if (result.success) setOrders(result.data);
        } catch (err) { setLoading(false); }
      };

      useEffect(() => {
        loadOrders();
        const interval = setInterval(loadOrders, 15000);
        return () => clearInterval(interval);
      }, []);

      const handleStatusChange = async (orderId, newStatus) => {
        try {
          Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
          const res = await serverCall('updateOrderStatus', orderId, newStatus, user.id, user.role);
          if (res.success) {

            <div>
              <h3 style={{color: '#6a1b9a', marginBottom: '16px', fontSize: '18px'}}><i className="fas fa-utensils"></i> Preparing ({preparing.length})</h3>
              <div className="kitchen-grid">

                  <div className="kitchen-card" key={order.order_id} style={{borderLeftColor: '#6a1b9a'}}>
                    <div className="kitchen-order-id">{order.order_id}</div>
                    <div className="kitchen-type"><span className={'type-badge type-' + order.type.replace('_', '')}>{order.type.replace('_', ' ')}</span></div>
                    <div className="kitchen-time"><i className="fas fa-clock"></i> {getTimeAgo(order.timestamp)}</div>
                    <ul className="kitchen-items">

    // ==================== LOGS VIEW ====================
    function LogsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [logs, setLogs] = useState([]);
      const tableInstanceRef = useRef(null);
      const [filters, setFilters] = useState({ action: '', username: '' });
      const [uniqueUsers, setUniqueUsers] = useState([]);

      useEffect(() => {
        loadLogs();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} } };
      }, []);

      const loadLogs = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getLogs', user.id, user.role, 200);
          setLoading(false);
          if (result.success) {
            setLogs(result.data);
            const usernames = [...new Set(result.data.map(l => l.username).filter(Boolean))];
            setUniqueUsers(usernames);
            initializeDataTable(result.data);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load logs' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#logsTable').empty(); } catch (e) {} }
        setTimeout(() => {
          try {
            const table = $('#logsTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'id', title: 'ID' },
                { data: 'username', title: 'User' },
                { data: 'action', title: 'Action', render: (d) => '<span class="action-badge action-' + d.toLowerCase() + '">' + d + '</span>' },
                { data: 'table_name', title: 'Table' },
                { data: 'record_id', title: 'Record ID', render: (d) => d || '-' },
                { data: 'created_at', title: 'Time', render: (d) => formatDate(d) }
              ],
              pageLength: 10, lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]], responsive: true, dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV' },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF' },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print' }
              ],
              order: [[0, 'desc']]
            });
            tableInstanceRef.current = table;
          } catch (e) { console.error('DataTable init error:', e); }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        dt.columns().search('').draw();
        if (filters.action) dt.column(2).search(filters.action).draw(false);
        if (filters.username) dt.column(1).search(filters.username).draw(false);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ action: '', username: '' });
        if (tableInstanceRef.current) { tableInstanceRef.current.columns().search('').draw(); }
      };

      useEffect(() => { if (tableInstanceRef.current && logs.length > 0) applyFilters(); }, [filters]);

      return (
        <div className="data-section">
          <div className="section-header">
            <h2><i className="fas fa-history"></i> Activity Logs</h2>
            <button className="btn btn-primary" onClick={loadLogs}><i className="fas fa-sync-alt"></i> Refresh</button>
          </div>

          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear All</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-bolt"></i> Action</label>
                  <select value={filters.action} onChange={(e) => setFilters({...filters, action: e.target.value})} className="filter-input">
                    <option value="">All Actions</option>
                    <option value="LOGIN">Login</option>
                    <option value="CREATE">Create</option>
                    <option value="UPDATE">Update</option>
                    <option value="DELETE">Delete</option>
                    <option value="CHANGE_PASSWORD">Change Password</option>
                  </select>
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-user"></i> User</label>
                  <select value={filters.username} onChange={(e) => setFilters({...filters, username: e.target.value})} className="filter-input">
                    <option value="">All Users</option>
                    {uniqueUsers.map((u, idx) => <option key={idx} value={u}>{u}</option>)}
                  </select>
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={8} columns={6} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="logsTable" className="display" style={{width: '100%'}}></table>
          </div>
        </div>
      );
    }

    // ==================== ACCOUNT VIEW ====================
    function AccountView({ user }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [saving, setSaving] = useState(false);
      const [contact, setContact] = useState('');
      const [savingProfile, setSavingProfile] = useState(false);

      const [currencySymbol, setCurrencySymbol] = useState(APP_CURRENCY);
      const [savingCurrency, setSavingCurrency] = useState(false);
      const currencyOptions = [
        { value: '₦', label: '₦ - Naira' },
        { value: '€', label: '€ - Euro' },
        { value: '$', label: '$ - Dollar' },
        { value: '£', label: '£ - Pound' },
        { value: 'Rs.', label: 'Rs. - Rupee' },
        { value: '¥', label: '¥ - Yen' },
        { value: 'LKR ', label: 'LKR - Sri Lankan Rupee' },
        { value: 'AED ', label: 'AED - Dirham' },
        { value: 'RM ', label: 'RM - Ringgit' }
      ];

      const handleSaveCurrency = async () => {
        setSavingCurrency(true);
        try {
          const result = await serverCall('updateAppSettings', 'currency_symbol', currencySymbol, user.id, user.role);
          setSavingCurrency(false);
          if (result.success) {
            APP_CURRENCY = currencySymbol;
            try { localStorage.setItem('food_app_currency', currencySymbol); } catch(e) {}
            Swal.fire({ icon: 'success', title: 'Currency Updated!', text: 'Currency symbol changed to ' + currencySymbol, timer: 2000, showConfirmButton: false });
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setSavingCurrency(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update currency' });
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (!currentPassword || !newPassword || !confirmPassword) { Swal.fire({ icon: 'warning', title: 'Missing Fields', text: 'All fields are required' }); return; }
        if (newPassword.length < 6) { Swal.fire({ icon: 'warning', title: 'Too Short', text: 'New password must be at least 6 characters' }); return; }
        if (newPassword !== confirmPassword) { Swal.fire({ icon: 'warning', title: 'Mismatch', text: 'New password and confirm password do not match' }); return; }

        setSaving(true);
        try {
          const result = await serverCall('changePassword', user.id, currentPassword, newPassword);
          setSaving(false);
          if (result.success) {
            Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
            setCurrentPassword(''); setNewPassword(''); setConfirmPassword('');
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setSaving(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to change password' });
        }
      };

      const handleUpdateContact = async (e) => {
        e.preventDefault();
        setSavingProfile(true);
        try {
          const result = await serverCall('updateOwnProfile', user.id, contact);
          setSavingProfile(false);
          if (result.success) Swal.fire({ icon: 'success', title: 'Updated!', text: result.message, timer: 2000, showConfirmButton: false });
          else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        } catch (err) {
          setSavingProfile(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to update profile' });
        }
      };

      return (
        <div className="account-section">
          <div className="account-card">
            <h2><i className="fas fa-user-circle"></i> My Account</h2>
            <div style={{marginBottom: '25px', padding: '15px', background: 'rgba(255,248,239,0.6)', borderRadius: '18px'}}>
              <p style={{marginBottom: '8px'}}><strong>Name:</strong> {user.name}</p>
              <p style={{marginBottom: '8px'}}><strong>Username:</strong> {user.username}</p>
              <p><strong>Role:</strong> <span className={'role-badge role-' + user.role}>{user.role.charAt(0).toUpperCase() + user.role.slice(1)}</span></p>
            </div>

            {(user.role === 'chef' || user.role === 'rider') && (
              <>
                <h2><i className="fas fa-phone"></i> Update Contact</h2>
                <form onSubmit={handleUpdateContact} style={{marginBottom: '25px'}}>
                  <div className="form-group">
                    <label>Phone Number</label>
                    <input type="tel" value={contact} onChange={(e) => setContact(e.target.value)} placeholder="Enter phone number" />
                  </div>
                  <button type="submit" className="btn btn-primary" disabled={savingProfile}>

    // ==================== CHECKOUT PAGE (No Login Required) ====================

    function CheckoutPage({ cart, setCart, onBack, onTrackOrder }) {
      const [menuItems, setMenuItems] = useState([]);
      const [combos, setCombos] = useState([]);
      const [menuLoading, setMenuLoading] = useState(true);
      const [posCategory, setPosCategory] = useState('all');
      const [formItems, setFormItems] = useState(cart || []);
      const [customerInfo, setCustomerInfo] = useState({ name: '', phone: '', email: '', address: '', city: '' });
      const [formData, setFormData] = useState({ type: 'delivery', notes: '', payment_method: 'cash' });
      const [submitting, setSubmitting] = useState(false);
      const [orderResult, setOrderResult] = useState(null);
      const [promoCode, setPromoCode] = useState('');
      const [promoDiscount, setPromoDiscount] = useState(0);
      const [promoApplied, setPromoApplied] = useState(null);
      const [promoLoading, setPromoLoading] = useState(false);
      const [extrasCache, setExtrasCache] = useState({});

      useEffect(() => {
        Promise.all([
          serverCall('getPublicMenu'),
          serverCall('getPublicCombos'),
          serverCall('getAllPublicExtras')
        ]).then(([menuRes, comboRes, extrasRes]) => {
          if (menuRes.success) setMenuItems(menuRes.data);
          if (comboRes.success) setCombos(comboRes.data);
          if (extrasRes.success && extrasRes.data) setExtrasCache(extrasRes.data);
          setMenuLoading(false);
        }).catch(() => setMenuLoading(false));
      }, []);

      // POS functions
      const posAddItem = (menuItem) => {
        const cartKey = menuItem.item_id + '_' + (menuItem._extrasKey || '');
        const existing = formItems.find(fi => fi._cartKey === cartKey);
        if (existing) {
          setFormItems(formItems.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * (fi.unit_price + (fi.extras ? fi.extras.reduce((s,e) => s + e.extra_price, 0) : 0)) } : fi));
        } else {
          const extrasTotal = menuItem._extras ? menuItem._extras.reduce((s,e) => s + e.extra_price, 0) : 0;
          setFormItems([...formItems, { item_id: menuItem.item_id, _cartKey: cartKey, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), extras: menuItem._extras || [], total_price: parseFloat(menuItem.price) + extrasTotal }]);
        }
      };
      const posAddItemSimple = (menuItem) => {
        const itemExtras = extrasCache[menuItem.item_id];
        if (itemExtras && itemExtras.length > 0) {
            const extrasHtml = itemExtras.map((ex, idx) =>
              '<label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,248,239,0.6);margin-bottom:8px;cursor:pointer;border:1px solid rgba(34,27,24,0.06)"><input type="checkbox" class="swal-extra-check" data-idx="' + idx + '" style="width:18px;height:18px" /><span style="flex:1;font-weight:500">' + escapeHtml(ex.extra_name) + '</span><span style="color:var(--navy-accent);font-weight:700">+' + formatPrice(ex.extra_price) + '</span></label>'
            ).join('');
            Swal.fire({
              title: '<i class="fas fa-plus-circle" style="color:#221b18"></i> ' + escapeHtml(menuItem.name),
              html: '<div class="swal-form"><p style="color:var(--warm-muted);margin-bottom:12px;font-size:13px">Select add-ons (optional):</p>' + extrasHtml + '</div>',
              width: 420,
              showCancelButton: true,
              confirmButtonText: '<i class="fas fa-cart-plus"></i> Add to Cart',
              confirmButtonColor: '#b54d2d',
              cancelButtonText: 'Skip Extras',
              preConfirm: () => {
                const selectedExtras = [];
                document.querySelectorAll('.swal-extra-check:checked').forEach(cb => {
                  const idx = parseInt(cb.dataset.idx);
                  selectedExtras.push({ extra_name: itemExtras[idx].extra_name, extra_price: parseFloat(itemExtras[idx].extra_price) });
                });
                return selectedExtras;
              }
            }).then((result) => {
              if (result.isConfirmed || result.dismiss === Swal.DismissReason.cancel) {
                const selectedExtras = result.isConfirmed ? result.value : [];
                const extrasKey = selectedExtras.map(e => e.extra_name).sort().join(',');
                const cartKey = menuItem.item_id + '_' + extrasKey;
                const existing = formItems.find(fi => fi._cartKey === cartKey);
                if (existing) {
                  setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * (fi.unit_price + (fi.extras ? fi.extras.reduce((s,e) => s + e.extra_price, 0) : 0)) } : fi));
                } else {
                  const extrasTotal = selectedExtras.reduce((s,e) => s + e.extra_price, 0);
                  setFormItems(prev => [...prev, { item_id: menuItem.item_id, _cartKey: cartKey, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), extras: selectedExtras, total_price: parseFloat(menuItem.price) + extrasTotal }]);
                }
              }
            });
        } else {
            const cartKey = menuItem.item_id + '_';
            const existing = formItems.find(fi => fi._cartKey === cartKey);
            if (existing) {
              setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
            } else {
              setFormItems(prev => [...prev, { item_id: menuItem.item_id, _cartKey: cartKey, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), extras: [], total_price: parseFloat(menuItem.price) }]);
            }
        }
      };
      const posUpdateQty = (cartKey, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi._cartKey !== cartKey) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          const extrasTotal = fi.extras ? fi.extras.reduce((s,e) => s + e.extra_price, 0) : 0;
          return { ...fi, qty: newQty, total_price: newQty * (fi.unit_price + extrasTotal) };
        }).filter(Boolean));
      };
      const removeItem = (cartKey) => setFormItems(formItems.filter(fi => fi._cartKey !== cartKey));
      const posAddCombo = (combo) => {
        const cartKey = 'combo_' + combo.combo_id;
        const existing = formItems.find(fi => fi._cartKey === cartKey);
        if (existing) {
          setFormItems(prev => prev.map(fi => fi._cartKey === cartKey ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems(prev => [...prev, {
            item_id: combo.combo_id, _cartKey: cartKey, item_name: combo.name + ' (Combo)',
            qty: 1, unit_price: combo.combo_price, total_price: combo.combo_price,
            extras: combo.items.map(it => ({ item_id: it.item_id, item_name: it.item_name, qty: it.qty, extra_price: 0 })),
            is_combo: true, combo_id: combo.combo_id
          }]);
        }
      };
      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge - promoDiscount;

      const applyPromo = async () => {
        if (!promoCode.trim()) return;
        setPromoLoading(true);
        try {
          const res = await serverCall('validatePromoCode', promoCode.trim().toUpperCase(), formSubtotal);
          setPromoLoading(false);
          if (res.success) {
            setPromoDiscount(res.data.discount || 0);
            setPromoApplied(res.data);
            Swal.fire({ icon: 'success', title: 'Promo Applied!', text: 'Discount: ' + formatPrice(res.data.discount), timer: 1500, showConfirmButton: false });
          } else {
            Swal.fire({ icon: 'error', title: 'Invalid', text: res.message || 'Invalid promo code', confirmButtonColor: '#b54d2d' });
          }
        } catch (e) {
          setPromoLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to validate promo code', confirmButtonColor: '#b54d2d' });
        }
      };

      const removePromo = () => {
        setPromoCode('');
        setPromoDiscount(0);
        setPromoApplied(null);
      };

      const submitOrder = async () => {
        if (!customerInfo.name.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your name' }); return; }
        if (!customerInfo.phone.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your phone number' }); return; }
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add items to your order' }); return; }
        if (formData.type === 'delivery' && !customerInfo.address.trim()) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Please enter your delivery address' }); return; }

        setSubmitting(true);
        try {
          const payload = {
            customer_name: customerInfo.name.trim(),
            phone: customerInfo.phone.trim(),
            email: customerInfo.email.trim(),
            type: formData.type,
            address: customerInfo.address.trim(),
            city: customerInfo.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            payment_method: formData.payment_method,
            promo_code: promoApplied ? promoApplied.code : '',
            discount: promoDiscount
          };
          const res = await serverCall('addPublicOrder', payload);
          setSubmitting(false);
          if (res.success) {
            setOrderResult(res.data);
            if (setCart) setCart([]);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: res.message });
          }
        } catch (e) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: e.message || 'Failed to place order. Please try again.' });
        }
      };

      const categories = ['all', ...new Set(menuItems.map(m => m.category)), ...(combos.length > 0 ? ['COMBO'] : [])];
      const filteredMenu = posCategory === 'COMBO' ? [] : (posCategory === 'all' ? menuItems : menuItems.filter(m => m.category === posCategory));
      const cartItemIds = formItems.map(fi => fi.item_id);

      const printReceipt = () => {
        const o = orderResult;
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const divider = '----------------------------------------';
        const dashed = '- - - - - - - - - - - - - - - - - - - -';

        let itemsHtml = '';
        o.items.forEach(it => {
          const name = it.item_name.length > 22 ? it.item_name.substring(0, 22) + '..' : it.item_name;
          itemsHtml += '<tr><td style="text-align:left;padding:2px 0">' + name + '</td><td style="text-align:center;padding:2px 4px">' + it.qty + '</td><td style="text-align:right;padding:2px 0">' + formatPrice(it.total_price) + '</td></tr>';
          if (it.extras && it.extras.length > 0) {
            it.extras.forEach(ex => {
              itemsHtml += '<tr><td colspan="3" style="text-align:left;padding:0 0 2px 8px;font-size:10px;color:#666">+ ' + ex.extra_name + ' (+' + formatPrice(ex.extra_price) + ')</td></tr>';
            });
          }
        });

        const receiptHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Receipt - ' + o.order_id + '</title>' +
          '<style>' +
          '@page { margin: 0; size: 80mm auto; }' +
          'body { font-family: "Courier New", Courier, monospace; font-size: 12px; width: 72mm; margin: 0 auto; padding: 8mm 4mm; color: #000; -webkit-print-color-adjust: exact; }' +
          '.receipt-center { text-align: center; }' +
          '.receipt-logo { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 6px; display: block; }' +
          '.receipt-store { font-size: 18px; font-weight: bold; margin: 0; letter-spacing: 1px; }' +
          '.receipt-tagline { font-size: 10px; color: #666; margin: 2px 0 8px; }' +
          '.receipt-divider { text-align: center; margin: 6px 0; color: #999; font-size: 11px; letter-spacing: -0.5px; }' +
          '.receipt-info { margin: 4px 0; }' +
          '.receipt-info td { padding: 1px 0; vertical-align: top; }' +
          '.receipt-info .lbl { color: #666; width: 70px; }' +
          '.receipt-items { width: 100%; border-collapse: collapse; margin: 4px 0; }' +
          '.receipt-items th { font-size: 11px; border-bottom: 1px solid #000; padding: 3px 0; text-transform: uppercase; }' +
          '.receipt-totals td { padding: 2px 0; }' +
          '.receipt-grand { font-size: 16px; font-weight: bold; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 6px 0 !important; }' +
          '.receipt-footer { margin-top: 10px; text-align: center; font-size: 10px; color: #666; }' +
          '.receipt-barcode { text-align: center; font-size: 28px; letter-spacing: 4px; margin: 8px 0 4px; font-family: "Libre Barcode 39", monospace; }' +
          '.receipt-orderid { text-align: center; font-size: 10px; letter-spacing: 2px; color: #444; }' +
          '.receipt-badge { display: inline-block; padding: 2px 8px; border: 1px solid #000; border-radius: 3px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }' +
          '@media print { body { width: 72mm; } }' +
          '</style>' +
          '<link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39&display=swap" rel="stylesheet">' +
          '</head><body>' +

          '<div class="receipt-center">' +
          '<img src="' + LOGO_URL + '" class="receipt-logo" />' +
          '<p class="receipt-store">CHOP FAST LAGOS</p>' +
          '<p class="receipt-tagline">Delicious Food Delivered Fresh</p>' +
          '</div>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-info" style="width:100%">' +
          '<tr><td class="lbl">Order</td><td><strong>' + o.order_id + '</strong></td></tr>' +
          '<tr><td class="lbl">Date</td><td>' + dateStr + ' ' + timeStr + '</td></tr>' +
          '<tr><td class="lbl">Type</td><td><span class="receipt-badge">' + o.type.replace('_', ' ') + '</span></td></tr>' +
          '<tr><td class="lbl">Payment</td><td>' + (o.payment_method === 'paypal' ? 'PayPal' : 'Cash') + '</td></tr>' +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-info" style="width:100%">' +
          '<tr><td class="lbl">Customer</td><td>' + o.customer_name + '</td></tr>' +
          '<tr><td class="lbl">Phone</td><td>' + o.phone + '</td></tr>' +
          (o.email ? '<tr><td class="lbl">Email</td><td style="font-size:10px">' + o.email + '</td></tr>' : '') +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<table class="receipt-items" style="width:100%">' +
          '<thead><tr><th style="text-align:left">Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Amount</th></tr></thead>' +
          '<tbody>' + itemsHtml + '</tbody>' +
          '</table>' +

          '<div class="receipt-divider">' + dashed + '</div>' +

          '<table class="receipt-totals" style="width:100%">' +
          '<tr><td>Subtotal</td><td style="text-align:right">' + formatPrice(o.subtotal) + '</td></tr>' +
          (o.delivery_charge > 0 ? '<tr><td>Delivery</td><td style="text-align:right">' + formatPrice(o.delivery_charge) + '</td></tr>' : '') +
          (o.discount > 0 ? '<tr><td>Discount' + (o.promo_code ? ' (' + o.promo_code + ')' : '') + '</td><td style="text-align:right;color:#2e7d32">-' + formatPrice(o.discount) + '</td></tr>' : '') +
          '<tr><td class="receipt-grand">TOTAL</td><td class="receipt-grand" style="text-align:right">' + formatPrice(o.total) + '</td></tr>' +
          '</table>' +

          '<div class="receipt-divider">' + divider + '</div>' +

          '<div class="receipt-barcode">*' + o.order_id + '*</div>' +
          '<div class="receipt-orderid">' + o.order_id + '</div>' +

          '<div class="receipt-footer">' +
          '<p style="margin:8px 0 2px;font-size:12px;color:#000">Thank you for your order!</p>' +
          '<p style="margin:0">Powered by Fanen Iorwuese</p>' +
          '</div>' +

          '<script>window.onload=function(){window.print();}<\/script>' +
          '</body></html>';

        const printWin = window.open('', '_blank', 'width=350,height=600');
        printWin.document.write(receiptHtml);
        printWin.document.close();
      };

      // ---- ORDER CONFIRMATION PAGE ----
      if (orderResult) {
        return (
          <div style={{minHeight: '100vh', background: 'radial-gradient(circle at top left, rgba(213,162,66,0.22), transparent 28%), radial-gradient(circle at top right, rgba(181,77,45,0.18), transparent 24%), linear-gradient(145deg, #fbf5eb 0%, #f5e8d2 48%, #ecd9bb 100%)', padding: '20px'}}>
            <div style={{maxWidth: '600px', margin: '40px auto', background: 'rgba(255,248,239,0.82)', backdropFilter: 'blur(16px)', borderRadius: '28px', overflow: 'hidden', boxShadow: '0 24px 70px rgba(96,52,25,0.18)', border: '1px solid rgba(255,255,255,0.45)'}}>
              <div style={{background: 'linear-gradient(135deg, #221b18, #3a2f2a)', padding: '30px', textAlign: 'center', color: '#fff8ef', borderRadius: '0 0 22px 22px'}}>
                <i className="fas fa-check-circle" style={{fontSize: '48px', marginBottom: '12px', color: '#d5a242'}}></i>
                <h2 style={{margin: '0 0 8px', fontSize: '24px'}}>Order Confirmed!</h2>
                <p style={{margin: 0, opacity: 0.9, fontSize: '16px'}}>Your order has been placed successfully</p>
              </div>
              <div style={{padding: '24px'}}>
                <div style={{background: 'rgba(255,248,239,0.6)', borderRadius: '18px', padding: '16px', marginBottom: '20px'}}>
                  <div className="order-detail-row"><span className="label">Order ID</span><span className="value" style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '16px'}}>{orderResult.order_id}</span></div>
                  <div className="order-detail-row"><span className="label">Name</span><span className="value">{orderResult.customer_name}</span></div>
                  <div className="order-detail-row"><span className="label">Phone</span><span className="value">{orderResult.phone}</span></div>
                  {orderResult.email && <div className="order-detail-row"><span className="label">Email</span><span className="value">{orderResult.email}</span></div>}
                  <div className="order-detail-row"><span className="label">Order Type</span><span className={'type-badge type-' + orderResult.type.replace('_', '')}>{orderResult.type.replace('_', ' ')}</span></div>
                  <div className="order-detail-row"><span className="label">Payment</span><span className="value"><i className={(orderResult.payment_method === 'paypal' ? 'fab fa-paypal' : 'fas fa-money-bill-wave')} style={{marginRight: '6px'}}></i>{orderResult.payment_method === 'paypal' ? 'PayPal' : 'Cash'}</span></div>
                </div>

                <h4 style={{color: 'var(--navy-primary)', marginBottom: '12px'}}><i className="fas fa-shopping-bag"></i> Order Items</h4>
                <div className="about-table-wrapper">
                  <table className="about-roles-table" style={{fontSize: '13px'}}>
                    <thead><tr><th style={{textAlign: 'left'}}>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                    <tbody>
                      {orderResult.items.map((it, idx) => (
                        <tr key={idx}><td style={{textAlign: 'left', fontWeight: 500}}>{it.item_name}</td><td>{it.qty}</td><td>{formatPrice(it.unit_price)}</td><td><strong>{formatPrice(it.total_price)}</strong></td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div style={{marginTop: '16px'}}>
                  <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(orderResult.subtotal)}</span></div>
                  {orderResult.delivery_charge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(orderResult.delivery_charge)}</span></div>}
                  {orderResult.discount > 0 && <div className="order-detail-row"><span className="label" style={{color: 'var(--success)'}}>Discount {orderResult.promo_code ? '(' + orderResult.promo_code + ')' : ''}</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(orderResult.discount)}</span></div>}
                  <div className="order-total-row"><span>Total</span><span>{formatPrice(orderResult.total)}</span></div>
                </div>

                <button className="btn btn-primary" style={{width: '100%', marginTop: '24px', padding: '14px', fontSize: '16px', background: 'linear-gradient(135deg, #221b18, #3a2f2a)', border: 'none', color: '#fff', borderRadius: '999px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontWeight: '600', fontFamily: 'inherit', boxShadow: '0 4px 16px rgba(34,27,24,0.2)'}} onClick={printReceipt}>
                  <i className="fas fa-receipt"></i> Print Receipt
                </button>
                <button className="btn btn-primary" style={{width: '100%', marginTop: '10px', padding: '14px', fontSize: '16px'}} onClick={onBack}>
                  <i className="fas fa-home"></i> Back to Home
                </button>
                {onTrackOrder && (
                  <button className="btn btn-secondary" style={{width: '100%', marginTop: '10px', padding: '14px', fontSize: '16px', borderRadius: '999px'}} onClick={onTrackOrder}>
                    <i className="fas fa-search-location"></i> Track My Order
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ---- CHECKOUT FORM ----
      return (
        <div style={{minHeight: '100vh', background: '#f7efe3'}}>
          {/* Top Bar */}
          <nav style={{background: 'var(--navy-primary)', color: 'var(--warm-cream)', padding: '14px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, zIndex: 100, borderRadius: '0 0 22px 22px', boxShadow: '0 4px 20px rgba(34,27,24,0.15)'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
              <img src={LOGO_URL} alt="" style={{width: '36px', height: '36px', borderRadius: '50%'}} />
              <span style={{fontWeight: '700', fontSize: '18px'}}>Checkout</span>
            </div>
            <a href="#" style={{color: 'var(--warm-cream)', textDecoration: 'none', fontSize: '14px'}} onClick={(e) => { e.preventDefault(); onBack(); }}>
              <i className="fas fa-arrow-left"></i> Back to Menu
            </a>
          </nav>

          <div style={{maxWidth: '1200px', margin: '0 auto', padding: '20px'}}>
            {/* POS Grid + Cart */}
            <div className="pos-container">
              <div className="pos-grid-section">
                <h3 style={{color: 'var(--navy-primary)', marginBottom: '12px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-utensils"></i> {formItems.length > 0 ? 'Add More Items' : 'Select Items'}</h3>
                <div className="category-tabs" style={{marginBottom: '16px'}}>
                  {categories.map(cat => (
                    <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>
                      {cat === 'all' ? 'All Items' : cat}
                    </button>
                  ))}
                </div>
                {menuLoading ? (
                  <div style={{textAlign: 'center', padding: '40px', color: '#c4b5a5'}}>
                    <i className="fas fa-spinner fa-spin" style={{fontSize: '24px'}}></i>
                    <p style={{marginTop: '8px'}}>Loading menu...</p>
                  </div>
                ) : (
                  <div className="pos-grid">
                    {filteredMenu.map(item => {
                      const inCart = cartItemIds.includes(item.item_id);
                      const cartItemQty = formItems.filter(fi => fi.item_id === item.item_id).reduce((s, fi) => s + fi.qty, 0);
                      return (
                        <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '') + (item.out_of_stock ? ' out-of-stock' : '')} onClick={() => !item.out_of_stock && posAddItemSimple(item)}>
                          {inCart && <span className="pos-item-badge">{cartItemQty}</span>}
                          {item.image_url ? (
                            <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} />
                          ) : (
                            <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}>
                              <i className="fas fa-utensils" style={{fontSize: '24px'}}></i>
                            </div>
                          )}
                          <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', color: 'var(--navy-primary)'}}>{item.name}</div>
                          <div style={{fontWeight: '700', color: 'var(--navy-accent)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                        </div>
                      );
                    })}
                    {posCategory === 'COMBO' && combos.map(combo => {
                      const inCart = cartItemIds.includes(combo.combo_id);
                      const cartQty = formItems.filter(fi => fi.combo_id === combo.combo_id).reduce((s, fi) => s + fi.qty, 0);
                      return (
                        <div key={combo.combo_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddCombo(combo)} style={{borderColor: '#d5a242'}}>
                          {inCart && <span className="pos-item-badge">{cartQty}</span>}
                          <div style={{width: '100%', height: '80px', background: 'linear-gradient(135deg, #f0c7a1, #f7efe3)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#d5a242'}}>
                            <i className="fas fa-layer-group" style={{fontSize: '24px'}}></i>
                          </div>
                          <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', color: 'var(--navy-primary)'}}>{combo.name}</div>
                          <div style={{fontWeight: '700', color: '#2e7d32', fontSize: '12px'}}>Save {combo.savings_percent}%</div>
                          <div style={{fontWeight: '700', color: 'var(--navy-accent)', fontSize: '14px'}}>{formatPrice(combo.combo_price)}</div>
                        </div>
                      );
                    })}
                    {posCategory === 'all' && combos.map(combo => {
                      const inCart = cartItemIds.includes(combo.combo_id);
                      const cartQty = formItems.filter(fi => fi.combo_id === combo.combo_id).reduce((s, fi) => s + fi.qty, 0);
                      return (
                        <div key={combo.combo_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddCombo(combo)} style={{borderColor: '#d5a242'}}>
                          {inCart && <span className="pos-item-badge">{cartQty}</span>}
                          <div style={{width: '100%', height: '80px', background: 'linear-gradient(135deg, #f0c7a1, #f7efe3)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#d5a242'}}>
                            <i className="fas fa-layer-group" style={{fontSize: '24px'}}></i>
                          </div>
                          <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', color: 'var(--navy-primary)'}}>{combo.name}</div>
                          <div style={{fontWeight: '700', color: '#2e7d32', fontSize: '12px'}}>Save {combo.savings_percent}%</div>
                          <div style={{fontWeight: '700', color: 'var(--navy-accent)', fontSize: '14px'}}>{formatPrice(combo.combo_price)}</div>
                        </div>
                      );
                    })}
                    {filteredMenu.length === 0 && posCategory !== 'COMBO' && posCategory !== 'all' && <p style={{color: '#c4b5a5', gridColumn: '1/-1', textAlign: 'center', padding: '30px'}}>No items</p>}
                  </div>
                )}
              </div>

              {/* Cart */}
              <div className="pos-cart-section">
                <div className="pos-cart">
                  <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>
                  {formItems.length === 0 && (
                    <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                      <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                      <p style={{fontSize: '13px'}}>Click items to add</p>
                    </div>
                  )}
                  {formItems.map(fi => (
                    <div key={fi._cartKey || fi.item_id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                      <div style={{flex: 1, minWidth: 0}}>
                        <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                        <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                        {fi.is_combo && fi.extras && fi.extras.length > 0 && fi.extras.map((ci, cidx) => (
                          <div key={cidx} style={{fontSize: '11px', color: '#2e7d32', paddingLeft: '8px'}}>{ci.qty}x {ci.item_name}</div>
                        ))}
                        {!fi.is_combo && fi.extras && fi.extras.length > 0 && fi.extras.map((ex, eidx) => (
                          <div key={eidx} style={{fontSize: '11px', color: 'var(--navy-accent)', paddingLeft: '8px'}}>+ {ex.extra_name} (+{formatPrice(ex.extra_price)})</div>
                        ))}
                      </div>
                      <div className="pos-qty-controls">
                        <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi._cartKey || fi.item_id, -1); }}>-</button>
                        <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                        <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi._cartKey || fi.item_id, 1); }}>+</button>
                      </div>
                      <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                      <button type="button" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px'}} onClick={() => removeItem(fi._cartKey || fi.item_id)}><i className="fas fa-trash"></i></button>
                    </div>
                  ))}
                  {formItems.length > 0 && (
                    <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                      <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                      {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                      {promoDiscount > 0 && <div className="order-detail-row"><span className="label" style={{color: 'var(--success)'}}>Promo ({promoApplied.code})</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(promoDiscount)}</span></div>}
                      <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>

                      {/* Promo Code Input */}
                      <div style={{marginTop: '12px', marginBottom: '12px'}}>
                        {!promoApplied ? (
                          <div style={{display: 'flex', gap: '8px'}}>
                            <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value.toUpperCase())} placeholder="Promo code" style={{flex: 1, padding: '10px 14px', border: '1px solid rgba(34,27,24,0.15)', borderRadius: '999px', fontSize: '14px', fontFamily: 'inherit', background: 'rgba(255,248,239,0.6)', letterSpacing: '1px'}} onKeyPress={(e) => e.key === 'Enter' && applyPromo()} />
                            <button className="btn btn-primary btn-sm" onClick={applyPromo} disabled={promoLoading} style={{borderRadius: '999px', whiteSpace: 'nowrap'}}>
                              {promoLoading ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-tag"></i> Apply</>}
                            </button>
                          </div>
                        ) : (
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px', background: 'rgba(52,168,83,0.1)', borderRadius: '999px', border: '1px solid rgba(52,168,83,0.2)'}}>
                            <span style={{color: 'var(--success)', fontWeight: '600', fontSize: '13px'}}><i className="fas fa-check-circle"></i> {promoApplied.code} applied</span>
                            <button onClick={removePromo} style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', fontSize: '13px', fontWeight: '600'}}><i className="fas fa-times"></i> Remove</button>
                          </div>
                        )}
                      </div>

                      <button className="btn btn-success" style={{width: '100%', marginTop: '4px', padding: '14px'}} onClick={submitOrder} disabled={submitting}>
                        {submitting ? <><i className="fas fa-spinner fa-spin"></i> Placing Order...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Customer Info + Order Details */}
            <div className="data-section" style={{marginTop: '20px', padding: '20px'}}>
              <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-user"></i> Your Details</h3>
              <div className="form-grid">
                <div className="form-group">
                  <label><i className="fas fa-user"></i> Full Name *</label>
                  <input type="text" value={customerInfo.name} onChange={(e) => setCustomerInfo({...customerInfo, name: e.target.value})} placeholder="Enter your full name" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-phone"></i> Phone *</label>
                  <input type="tel" value={customerInfo.phone} onChange={(e) => setCustomerInfo({...customerInfo, phone: e.target.value})} placeholder="e.g. 03001234567" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-envelope"></i> Email</label>
                  <input type="email" value={customerInfo.email} onChange={(e) => setCustomerInfo({...customerInfo, email: e.target.value})} placeholder="your@email.com (optional)" />
                </div>
                <div className="form-group">
                  <label><i className="fas fa-tag"></i> Order Type</label>
                  <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                    <option value="delivery">Delivery</option>
                    <option value="pickup">Pickup</option>
                  </select>
                </div>
                {formData.type === 'delivery' && (
                  <>
                    <div className="form-group">
                      <label><i className="fas fa-map-marker-alt"></i> Delivery Address *</label>
                      <input type="text" value={customerInfo.address} onChange={(e) => setCustomerInfo({...customerInfo, address: e.target.value})} placeholder="Your delivery address" />
                    </div>
                    <div className="form-group">
                      <label><i className="fas fa-city"></i> City</label>
                      <input type="text" value={customerInfo.city} onChange={(e) => setCustomerInfo({...customerInfo, city: e.target.value})} placeholder="City" />
                    </div>
                  </>
                )}
                <div className="form-group">
                  <label><i className="fas fa-credit-card"></i> Payment Method</label>
                  <div style={{display: 'flex', gap: '12px', marginTop: '4px'}}>
                    <label style={{flex: 1, display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '18px', border: formData.payment_method === 'cash' ? '2px solid var(--navy-accent)' : '1px solid rgba(34,27,24,0.1)', background: formData.payment_method === 'cash' ? 'rgba(181,77,45,0.08)' : 'rgba(255,248,239,0.6)', cursor: 'pointer', transition: 'all 0.2s'}}>
                      <input type="radio" name="payment" value="cash" checked={formData.payment_method === 'cash'} onChange={() => setFormData({...formData, payment_method: 'cash'})} style={{display: 'none'}} />
                      <i className="fas fa-money-bill-wave" style={{fontSize: '20px', color: formData.payment_method === 'cash' ? '#2e7d32' : '#a89888'}}></i>
                      <span style={{fontWeight: '600', color: formData.payment_method === 'cash' ? 'var(--navy-primary)' : 'var(--warm-muted)'}}>Cash</span>
                    </label>
                    <label style={{flex: 1, display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '18px', border: formData.payment_method === 'paypal' ? '2px solid var(--navy-accent)' : '1px solid rgba(34,27,24,0.1)', background: formData.payment_method === 'paypal' ? 'rgba(181,77,45,0.08)' : 'rgba(255,248,239,0.6)', cursor: 'pointer', transition: 'all 0.2s'}}>
                      <input type="radio" name="payment" value="paypal" checked={formData.payment_method === 'paypal'} onChange={() => setFormData({...formData, payment_method: 'paypal'})} style={{display: 'none'}} />
                      <i className="fab fa-paypal" style={{fontSize: '20px', color: formData.payment_method === 'paypal' ? '#003087' : '#a89888'}}></i>
                      <span style={{fontWeight: '600', color: formData.payment_method === 'paypal' ? 'var(--navy-primary)' : 'var(--warm-muted)'}}>PayPal</span>
                    </label>
                  </div>
                </div>
                <div className="form-group" style={{gridColumn: '1 / -1'}}>
                  <label><i className="fas fa-sticky-note"></i> Notes (optional)</label>
                  <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions" />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== CUSTOMER DASHBOARD ====================

    function CustomerDashboard({ user, onLogout, initialCart, clearHomeCart, theme, toggleTheme }) {
      const hasInitialCart = initialCart && initialCart.length > 0;
      const [activeTab, setActiveTab] = useState(hasInitialCart ? 'order' : 'dashboard');
      const [stats, setStats] = useState(null);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [menuItems, setMenuItems] = useState([]);
      const [posCategory, setPosCategory] = useState('all');
      const [formItems, setFormItems] = useState(hasInitialCart ? initialCart : []);
      const [formData, setFormData] = useState({ type: 'delivery', address: '', city: '', notes: '' });
      const [submitting, setSubmitting] = useState(false);
      const [expandedOrder, setExpandedOrder] = useState(null);

      // Change password state
      const [oldPass, setOldPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmNewPass, setConfirmNewPass] = useState('');

      useEffect(() => { loadData(); if (clearHomeCart) clearHomeCart(); }, []);

      const loadData = async () => {
        setLoading(true);
        try {
          const [statsRes, ordersRes] = await Promise.all([
            serverCall('getDashboardStats', user.id, user.role),
            serverCall('getOrders', user.id, user.role)
          ]);
          if (statsRes.success) setStats(statsRes.data);
          if (ordersRes.success) setOrders(ordersRes.data);
        } catch(e) {}
        setLoading(false);
      };

      const loadMenu = async () => {
        try {
          const res = await serverCall('getMenuItems', user.id, user.role);
          if (res.success) setMenuItems(res.data.filter(i => i.is_active === 'active'));
        } catch(e) {}
      };

      useEffect(() => { if (activeTab === 'order') loadMenu(); }, [activeTab]);

      // Auto-refresh orders
      useEffect(() => {
        const iv = setInterval(() => {
          serverCall('getOrders', user.id, user.role).then(r => { if (r.success) setOrders(r.data); }).catch(() => {});
        }, 20000);
        return () => clearInterval(iv);
      }, []);

      // POS functions
      const posAddItem = (menuItem) => {
        const existing = formItems.find(fi => fi.item_id === menuItem.item_id);
        if (existing) {
          setFormItems(formItems.map(fi => fi.item_id === menuItem.item_id ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems([...formItems, { item_id: menuItem.item_id, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), total_price: parseFloat(menuItem.price), extras: [] }]);
        }
      };
      const posUpdateQty = (itemId, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi.item_id !== itemId) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          return { ...fi, qty: newQty, total_price: newQty * fi.unit_price };
        }).filter(Boolean));
      };
      const removeItem = (itemId) => setFormItems(formItems.filter(fi => fi.item_id !== itemId));
      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge;

      const submitOrder = async () => {
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add items to your order' }); return; }
        setSubmitting(true);
        try {
          const payload = {
            customer_name: user.name,
            phone: user.username,
            email: '',
            type: formData.type,
            address: formData.address.trim(),
            city: formData.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            payment_method: 'cash'
          };
          const res = await serverCall('addOrder', payload, user.id, user.role);
          setSubmitting(false);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Order Placed!', text: 'Order ID: ' + res.data.order_id, timer: 2500, showConfirmButton: false });
            setFormItems([]);
            setFormData({ type: 'delivery', address: '', city: '', notes: '' });
            setActiveTab('orders');
            loadData();
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to place order' });
        }
      };

      const handleChangePassword = async () => {
        if (!oldPass || !newPass) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Fill in all password fields' }); return; }
        if (newPass.length < 6) { Swal.fire({ icon: 'warning', title: 'Too Short', text: 'New password must be at least 6 characters' }); return; }
        if (newPass !== confirmNewPass) { Swal.fire({ icon: 'warning', title: 'Mismatch', text: 'New passwords do not match' }); return; }
        try {
          const res = await serverCall('changePassword', user.id, oldPass, newPass);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Changed!', text: res.message, timer: 1500, showConfirmButton: false });
            setOldPass(''); setNewPass(''); setConfirmNewPass('');
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to change password' }); }
      };

      const handleLogout = () => {
        Swal.fire({
          icon: 'question', title: 'Logout?', text: 'Are you sure?', showCancelButton: true,
          confirmButtonColor: '#ea4335', confirmButtonText: '<i class="fas fa-sign-out-alt"></i> Logout'
        }).then(r => { if (r.isConfirmed) onLogout(); });
      };

      // Status progress bar
      const statusSteps = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
      const statusStepLabels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'On the Way', delivered: 'Delivered' };
      const statusStepIcons = { pending: 'fa-clock', confirmed: 'fa-check', preparing: 'fa-fire', ready: 'fa-box', out_for_delivery: 'fa-motorcycle', delivered: 'fa-check-double' };

      const renderStatusProgress = (orderStatus) => {
        if (orderStatus === 'cancelled') {
          return <div style={{color: 'var(--danger)', fontWeight: '600', fontSize: '14px'}}><i className="fas fa-ban"></i> Order Cancelled</div>;
        }
        const currentIdx = statusSteps.indexOf(orderStatus);
        return (
          <div className="status-progress">
            {statusSteps.map((step, idx) => (
              <div key={step} className="status-progress-step">
                {idx < statusSteps.length - 1 && <div className={'status-progress-line' + (idx < currentIdx ? ' done' : '')}></div>}
                <div className={'status-progress-dot' + (idx < currentIdx ? ' done' : '') + (idx === currentIdx ? ' active' : '')}>
                  <i className={'fas ' + statusStepIcons[step]}></i>
                </div>
                <div className={'status-progress-label' + (idx === currentIdx ? ' active' : '')}>{statusStepLabels[step]}</div>
              </div>
            ))}
          </div>
        );
      };

      const categories = ['all', ...new Set(menuItems.map(m => m.category))];
      const filteredMenu = posCategory === 'all' ? menuItems : menuItems.filter(m => m.category === posCategory);
      const cartItemIds = formItems.map(fi => fi.item_id);

      return (
        <div className="customer-layout">
          {/* Top Navbar */}
          <nav className="customer-nav">
            <div className="customer-nav-logo">
              <img src={LOGO_URL} alt="" />
              <span>Chop Fast Lagos</span>
            </div>
            <div className="customer-nav-tabs">
              {[
                { id: 'dashboard', icon: 'fa-home', label: 'Home' },
                { id: 'order', icon: 'fa-plus-circle', label: 'Place Order' },
                { id: 'orders', icon: 'fa-shopping-bag', label: 'My Orders' },
                { id: 'account', icon: 'fa-user-circle', label: 'Account' }
              ].map(tab => (
                <button key={tab.id} className={'customer-nav-tab' + (activeTab === tab.id ? ' active' : '')} onClick={() => setActiveTab(tab.id)}>
                  <i className={'fas ' + tab.icon}></i> {tab.label}
                </button>
              ))}
            </div>
            <div className="customer-nav-right">
              <ThemeToggleButton theme={theme} toggleTheme={toggleTheme} />
              <span className="customer-nav-user"><i className="fas fa-user"></i> {user.name}</span>
              <button className="customer-nav-logout" onClick={handleLogout}><i className="fas fa-sign-out-alt"></i></button>
            </div>
          </nav>

          <div className="customer-content">
            {/* Dashboard Tab */}
            {activeTab === 'dashboard' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <h2 style={{color: 'var(--navy-primary)', marginBottom: '24px'}}><i className="fas fa-hand-wave"></i> Welcome, {user.name}!</h2>
                {loading ? <TableSkeleton rows={3} columns={3} /> : stats && (
                  <div className="dashboard-grid-3">
                    <div className="stat-card"><div className="stat-card-icon icon-blue"><i className="fas fa-shopping-bag"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.totalOrders}</div><div className="stat-card-label">Total Orders</div></div></div>
                    <div className="stat-card"><div className="stat-card-icon icon-orange"><i className="fas fa-clock"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.activeOrders}</div><div className="stat-card-label">Active Orders</div></div></div>
                    <div className="stat-card"><div className="stat-card-icon icon-green"><i className="fas fa-check-double"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.deliveredOrders}</div><div className="stat-card-label">Delivered</div></div></div>
                  </div>
                )}

                {/* Recent active orders */}
                <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px'}}><i className="fas fa-clock"></i> Active Orders</h3>
                {orders.filter(o => !['delivered', 'cancelled'].includes(o.status)).length === 0 ? (
                  <div className="data-section" style={{textAlign: 'center', padding: '40px', color: '#c4b5a5'}}>
                    <i className="fas fa-shopping-bag" style={{fontSize: '48px', marginBottom: '12px', display: 'block'}}></i>
                    <p>No active orders. <a href="#" style={{color: 'var(--navy-accent)'}} onClick={(e) => { e.preventDefault(); setActiveTab('order'); }}>Place an order!</a></p>
                  </div>
                ) : (
                  orders.filter(o => !['delivered', 'cancelled'].includes(o.status)).map(order => (
                    <div className="customer-order-card" key={order.order_id}>
                      <div className="customer-order-header">
                        <strong style={{color: 'var(--navy-primary)', fontSize: '16px'}}>{order.order_id}</strong>
                        <span className={'order-status order-' + order.status}>{order.status.replace('_', ' ')}</span>
                      </div>
                      {renderStatusProgress(order.status)}
                      <div className="customer-order-items">
                        {(order.items || []).map((it, idx) => <span key={idx}>{idx > 0 ? ', ' : ''}{it.qty}x {it.item_name}</span>)}
                      </div>
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span style={{fontWeight: '700', color: 'var(--navy-primary)'}}>{formatPrice(order.total)}</span>
                        <span style={{fontSize: '12px', color: '#999'}}>{formatDate(order.timestamp)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* Place Order Tab */}
            {activeTab === 'order' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <h2 style={{color: 'var(--navy-primary)', marginBottom: '20px'}}><i className="fas fa-plus-circle"></i> Place Order</h2>

                {/* Order Type + Address */}
                <div className="data-section" style={{marginBottom: '20px', padding: '20px'}}>
                  <div className="form-grid">
                    <div className="form-group">
                      <label><i className="fas fa-tag"></i> Order Type</label>
                      <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                        <option value="delivery">Delivery</option>
                        <option value="pickup">Pickup</option>
                      </select>
                    </div>
                    {formData.type === 'delivery' && (
                      <>
                        <div className="form-group">
                          <label><i className="fas fa-map-marker-alt"></i> Delivery Address</label>
                          <input type="text" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} placeholder="Your delivery address" />
                        </div>
                        <div className="form-group">
                          <label><i className="fas fa-city"></i> City</label>
                          <input type="text" value={formData.city} onChange={(e) => setFormData({...formData, city: e.target.value})} placeholder="City" />
                        </div>
                      </>
                    )}
                    <div className="form-group" style={{gridColumn: '1 / -1'}}>
                      <label><i className="fas fa-sticky-note"></i> Notes (optional)</label>
                      <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions" />
                    </div>
                  </div>
                </div>

                {/* POS Grid + Cart */}
                <div className="pos-container">
                  <div className="pos-grid-section">
                    <div className="category-tabs" style={{marginBottom: '16px'}}>
                      {categories.map(cat => (
                        <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>
                          {cat === 'all' ? 'All Items' : cat}
                        </button>
                      ))}
                    </div>
                    <div className="pos-grid">
                      {filteredMenu.map(item => {
                        const inCart = cartItemIds.includes(item.item_id);
                        const cartItem = formItems.find(fi => fi.item_id === item.item_id);
                        return (
                          <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddItem(item)}>
                            {inCart && <span className="pos-item-badge">{cartItem.qty}</span>}
                            {item.image_url ? (
                              <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} />
                            ) : (
                              <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}>
                                <i className="fas fa-utensils" style={{fontSize: '24px'}}></i>
                              </div>
                            )}
                            <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px'}}>{item.name}</div>
                            <div style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                          </div>
                        );
                      })}
                      {filteredMenu.length === 0 && <p style={{color: '#c4b5a5', gridColumn: '1/-1', textAlign: 'center', padding: '30px'}}>No items</p>}
                    </div>
                  </div>

                  {/* Cart */}
                  <div className="pos-cart-section">
                    <div className="pos-cart">
                      <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>
                      {formItems.length === 0 && (
                        <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                          <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                          <p style={{fontSize: '13px'}}>Click items to add</p>
                        </div>
                      )}
                      {formItems.map(fi => (
                        <div key={fi.item_id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                          <div style={{flex: 1, minWidth: 0}}>
                            <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                            <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                          </div>
                          <div className="pos-qty-controls">
                            <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, -1); }}>-</button>
                            <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                            <button className="pos-qty-btn" type="button" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, 1); }}>+</button>
                          </div>
                          <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                          <button type="button" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px'}} onClick={() => removeItem(fi.item_id)}><i className="fas fa-trash"></i></button>
                        </div>
                      ))}
                      {formItems.length > 0 && (
                        <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                          <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                          {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                          <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>
                          <button className="btn btn-success" style={{width: '100%', marginTop: '12px', padding: '14px'}} onClick={submitOrder} disabled={submitting}>
                            {submitting ? <><i className="fas fa-spinner fa-spin"></i> Placing...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* My Orders Tab */}
            {activeTab === 'orders' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                  <h2 style={{color: 'var(--navy-primary)'}}><i className="fas fa-shopping-bag"></i> My Orders</h2>
                  <button className="btn btn-success" onClick={() => setActiveTab('order')}><i className="fas fa-plus"></i> New Order</button>
                </div>
                {loading ? <TableSkeleton rows={4} columns={4} /> : orders.length === 0 ? (
                  <div className="data-section" style={{textAlign: 'center', padding: '60px', color: '#c4b5a5'}}>
                    <i className="fas fa-shopping-bag" style={{fontSize: '48px', marginBottom: '12px', display: 'block'}}></i>
                    <p>No orders yet. Place your first order!</p>
                  </div>
                ) : (
                  orders.map(order => (
                    <div className="customer-order-card" key={order.order_id} style={{cursor: 'pointer'}} onClick={() => setExpandedOrder(expandedOrder === order.order_id ? null : order.order_id)}>
                      <div className="customer-order-header">
                        <div>
                          <strong style={{color: 'var(--navy-primary)', fontSize: '16px'}}>{order.order_id}</strong>
                          <span className={'type-badge type-' + order.type.replace('_', '')} style={{marginLeft: '8px'}}>{order.type.replace('_', ' ')}</span>
                        </div>
                        <span className={'order-status order-' + order.status}>{order.status.replace('_', ' ')}</span>
                      </div>
                      {renderStatusProgress(order.status)}
                      <div className="customer-order-items">
                        {(order.items || []).map((it, idx) => <span key={idx}>{idx > 0 ? ', ' : ''}{it.qty}x {it.item_name}</span>)}
                      </div>
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span style={{fontWeight: '700', color: 'var(--navy-primary)'}}>{formatPrice(order.total)}</span>
                        <span style={{fontSize: '12px', color: '#999'}}>{formatDate(order.timestamp)}</span>
                      </div>
                      {/* Expanded details */}
                      {expandedOrder === order.order_id && (
                        <div style={{marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #eee'}} onClick={(e) => e.stopPropagation()}>
                          <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', fontSize: '13px'}}>
                            {order.phone && <div><strong>Phone:</strong> {order.phone}</div>}

                  <div className="order-detail-row"><span className="label">Phone</span><span className="value">{user.username}</span></div>
                  <div className="order-detail-row"><span className="label">Role</span><span className="role-badge role-customer">Customer</span></div>

                  <div className="form-group"><label>New Password</label><input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="New password (min 6)" /></div>
                  <div className="form-group"><label>Confirm New Password</label><input type="password" value={confirmNewPass} onChange={(e) => setConfirmNewPass(e.target.value)} placeholder="Confirm new password" /></div>
                  <button className="btn btn-primary" onClick={handleChangePassword}><i className="fas fa-save"></i> Change Password</button>
                </div>
              </div>

          {/* Customer Bottom Nav (mobile) */}
          <nav className="bottom-nav customer-bottom-nav">
            <div className="bottom-nav-items">
              {[
                { id: 'dashboard', icon: 'fa-home', label: 'Home' },
                { id: 'order', icon: 'fa-plus-circle', label: 'Order' },
                { id: 'orders', icon: 'fa-shopping-bag', label: 'My Orders' },
                { id: 'account', icon: 'fa-user-circle', label: 'Account' }
              ].map(tab => (
                <button key={tab.id} className={'bottom-nav-item' + (activeTab === tab.id ? ' active' : '')} onClick={() => setActiveTab(tab.id)}>
                  <i className={'fas ' + tab.icon}></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    // ==================== LOGIN PAGE ====================

    function LoginPage({ onLogin, onBack, onRegister, theme, toggleTheme }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const result = await serverCall('login', username, password);
          setLoading(false);
          if (result.success) {
            onLogin(result.data);
          } else {
            setError(result.message);
          }
        } catch (err) {
          setLoading(false);
          setError('Connection error. Please try again.');
        }
      };

      return (
        <div className="login-container">
          <div className="login-box">
            <div style={{display: 'flex', justifyContent: 'flex-end'}}><ThemeToggleButton theme={theme} toggleTheme={toggleTheme} /></div>
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhV0q9dJ-42e6g7EzB6GLU7O_fOt-mTxyv3VvE98oHsC4L_Bkmy9dcs3stw_ksy9JGcGQy1uT8fpVQemlNJsqLDzb1RZKq1nDbOx0qeHMh0JdJx97h93Di6MxSYJPHYCn3m-K_fBmoFT57wVSov8LeKyPj8AfM0xIG4xEQNb6CtqOBefk4/s1600/WhatsApp%20Image%202026-05-14%20at%204.19.28%20PM.jpeg" alt="Logo" className="login-logo" />
            <h2><i className="fas fa-utensils"></i> Chop Fast Lagos</h2>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label><i className="fas fa-user"></i> Username</label>
                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Enter username" required />
              </div>
              <div className="form-group">
                <label><i className="fas fa-lock"></i> Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Enter password" required />
              </div>
              <button type="submit" className="btn btn-primary" disabled={loading} style={{width: '100%'}}>
                {loading ? <><i className="fas fa-spinner fa-spin"></i> Logging in...</> : <><i className="fas fa-sign-in-alt"></i> Login</>}
              </button>
              {error && <div className="error"><i className="fas fa-exclamation-circle"></i> {error}</div>}
            </form>
            <div style={{textAlign: 'center', marginTop: '16px', fontSize: '14px'}}>
              {onRegister && <p style={{marginBottom: '8px', color: 'var(--warm-muted)'}}>Want to order? <a href="#" style={{color: 'var(--navy-accent)', fontWeight: '600'}} onClick={(e) => { e.preventDefault(); onRegister(); }}>Order Food</a></p>}
              {onBack && <a href="#" style={{color: '#a89888', fontSize: '13px'}} onClick={(e) => { e.preventDefault(); onBack(); }}><i className="fas fa-arrow-left"></i> Back to Home</a>}
            </div>
          </div>
        </div>
      );
    }

    // ==================== SIDEBAR ====================

      const [badgeCount, setBadgeCount] = useState(0);

      const menuItems = [
        { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard', roles: ['admin', 'chef', 'rider'] },
        { id: 'menu', icon: 'fa-utensils', label: 'Menu', roles: ['admin', 'chef'] },
        { id: 'orders', icon: 'fa-shopping-bag', label: 'Orders', roles: ['admin', 'chef', 'rider'], showBadge: true },
        { id: 'promos', icon: 'fa-tags', label: 'Promo Codes', roles: ['admin'] },
        { id: 'combos', icon: 'fa-layer-group', label: 'Combos', roles: ['admin'] },
        { id: 'daily', icon: 'fa-calendar-day', label: 'Daily Summary', roles: ['admin'] },
        { id: 'reports', icon: 'fa-file-alt', label: 'Reports', roles: ['admin'] },
        { id: 'users', icon: 'fa-users', label: 'Users', roles: ['admin'] },
        { id: 'logs', icon: 'fa-history', label: 'Activity Logs', roles: ['admin'] },

      useEffect(() => {

            <div style={{color: 'white', fontSize: '20px', fontWeight: '700'}}>
              <i className="fas fa-utensils"></i> Chop Fast Lagos

          </div>
          <div className="sidebar-user-info">
            <div className="sidebar-user-name">{user.name}</div>

          <div className="sidebar-menu-section">

              {menuItems.filter(item => item.roles.includes(user.role)).map(item => (
                <li key={item.id}>
                  <button className={activeMenu === item.id ? 'active' : ''} onClick={() => setActiveMenu(item.id)}>

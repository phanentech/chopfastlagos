  <style>
    :root {
  --navy-primary: #1c1c1c; --navy-dark: #141414; --navy-light: #2e2e2e;

}
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }

    input, select, textarea { font-size: 16px !important; touch-action: manipulation; }

    /* Login */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at top left, rgba(213,162,66,0.22), transparent 28%), radial-gradient(circle at top right, rgba(181,77,45,0.18), transparent 24%), linear-gradient(145deg, #fbf5eb 0%, #f5e8d2 48%, #ecd9bb 100%); }
    .login-box { background: rgba(255,248,239,0.82); backdrop-filter: blur(16px); padding: 50px 40px; border-radius: 28px; box-shadow: 0 24px 70px rgba(96,52,25,0.18); border: 1px solid rgba(255,255,255,0.45); width: 100%; max-width: 420px; text-align: center; }
    .login-logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 25px; border: 3px solid var(--navy-accent); box-shadow: 0 8px 24px rgba(181,77,45,0.2); }
    .login-box h2 { margin-bottom: 35px; color: var(--navy-primary); font-size: 26px; font-weight: 600; font-family: 'Cormorant Garamond', serif; }

    /* Layout */
    .app-container { display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar { width: 260px; background: linear-gradient(180deg, var(--navy-primary) 0%, var(--navy-dark) 100%); color: var(--warm-cream); overflow-y: auto; height: 100vh; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(34,27,24,0.15); }
    .sidebar-user-info { padding: 24px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,248,239,0.1); text-align: center; }
    .sidebar-user-name { font-weight: 600; font-size: 18px; margin-bottom: 8px; }
    .sidebar-user-role { font-size: 13px; color: rgba(255,248,239,0.9); padding: 5px 12px; background: rgba(181,77,45,0.4); border-radius: 999px; display: inline-block; text-transform: capitalize; }
    .sidebar-menu-section { flex: 1; padding: 20px 16px; }
    .sidebar-menu-title { margin-bottom: 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,248,239,0.5); padding: 0 12px; }

    .sidebar-logout { padding: 16px 20px; border-top: 1px solid rgba(255,248,239,0.1); background: rgba(0,0,0,0.15); }
    .sidebar-logout button { width: 100%; padding: 14px 16px; background: linear-gradient(135deg, rgba(234,67,53,0.2) 0%, rgba(234,67,53,0.3) 100%); border: 1px solid rgba(234,67,53,0.4); color: var(--warm-cream); cursor: pointer; border-radius: 14px; font-size: 15px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; }
    .sidebar-logout button:hover { background: linear-gradient(135deg, rgba(234,67,53,0.4) 0%, rgba(234,67,53,0.5) 100%); transform: translateY(-2px); }

    /* Main Content */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; background: #f7efe3; }
    .breadcrumb { padding: 12px 20px; background: rgba(255,248,239,0.82); backdrop-filter: blur(12px); border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 16px rgba(96,52,25,0.06); font-size: 14px; display: flex; align-items: center; gap: 8px; color: var(--warm-muted); border: 1px solid rgba(255,255,255,0.45); }
    .breadcrumb a { color: var(--navy-accent); text-decoration: none; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .breadcrumb a:hover { color: var(--navy-hover); }
    .breadcrumb-sep { color: #c4b5a5; font-size: 12px; }
    .breadcrumb-right { margin-left: auto; }
    .notif-bell { background: none; border: none; cursor: pointer; position: relative; padding: 6px 8px; border-radius: 12px; transition: all 0.3s; color: var(--navy-primary); font-size: 18px; }
    .notif-bell:hover { background: rgba(181,77,45,0.1); }
    .notif-bell .notif-count { position: absolute; top: 0; right: 0; background: #ea4335; color: white; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid rgba(255,248,239,0.9); animation: notifPulse 2s ease-in-out infinite; }
    @keyframes notifPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .notif-dropdown { position: fixed; width: 360px; max-height: 440px; background: rgba(255,248,239,0.98); backdrop-filter: blur(16px); border-radius: 18px; box-shadow: 0 12px 48px rgba(96,52,25,0.22), 0 0 0 1px rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.5); z-index: 10000; overflow: hidden; animation: notifSlide 0.2s ease-out; }
    @keyframes notifSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .notif-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid rgba(34,27,24,0.08); background: rgba(255,248,239,0.95); border-radius: 18px 18px 0 0; }
    .notif-dropdown-header h4 { font-size: 16px; color: var(--navy-primary); font-family: 'Cormorant Garamond', serif; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .notif-mark-read { background: none; border: none; color: var(--navy-accent); font-size: 12px; cursor: pointer; font-weight: 600; padding: 4px 8px; border-radius: 8px; transition: all 0.2s; }
    .notif-mark-read:hover { background: rgba(181,77,45,0.1); }
    .notif-list { max-height: 370px; overflow-y: auto; }
    .notif-list::-webkit-scrollbar { width: 4px; }
    .notif-list::-webkit-scrollbar-thumb { background: rgba(34,27,24,0.15); border-radius: 4px; }
    .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; cursor: pointer; transition: all 0.2s; border-bottom: 1px solid rgba(34,27,24,0.04); }
    .notif-item:hover { background: rgba(181,77,45,0.06); }
    .notif-item.unread { background: rgba(181,77,45,0.08); }
    .notif-item.unread:hover { background: rgba(181,77,45,0.12); }
    .notif-item-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .notif-item-icon.type-order { background: linear-gradient(135deg, rgba(181,77,45,0.15), rgba(181,77,45,0.25)); color: var(--navy-accent); }
    .notif-item-icon.type-stock { background: linear-gradient(135deg, rgba(251,188,4,0.15), rgba(251,188,4,0.3)); color: #e69500; }
    .notif-item-icon.type-system { background: linear-gradient(135deg, rgba(52,168,83,0.15), rgba(52,168,83,0.25)); color: var(--success); }
    .notif-item-content { flex: 1; min-width: 0; }
    .notif-item-title { font-size: 13px; font-weight: 600; color: var(--navy-primary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notif-item-message { font-size: 12px; color: var(--warm-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notif-item-time { font-size: 11px; color: #b5a99a; margin-top: 4px; }
    .notif-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy-accent); flex-shrink: 0; margin-top: 6px; }
    .notif-empty { padding: 40px 20px; text-align: center; color: var(--warm-muted); }
    .notif-empty i { font-size: 36px; margin-bottom: 12px; opacity: 0.3; display: block; }
    .notif-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; }
    .header { background: rgba(255,248,239,0.82); backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(96,52,25,0.06); display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.45); }
    .header h1 { font-size: 24px; color: var(--navy-primary); display: flex; align-items: center; gap: 10px; font-family: 'Cormorant Garamond', serif; }

    /* Data Section */
    .data-section { background: rgba(255,248,239,0.82); backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(96,52,25,0.06); border: 1px solid rgba(255,255,255,0.45); }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-header h2 { font-size: 20px; color: var(--navy-primary); display: flex; align-items: center; gap: 10px; font-family: 'Cormorant Garamond', serif; }

    /* Skeleton Loaders */
    .skeleton { background: linear-gradient(90deg, #f0e6d8 25%, #e4d5c2 50%, #f0e6d8 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s ease-in-out infinite; border-radius: 14px; }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-table { width: 100%; background: rgba(255,248,239,0.82); padding: 20px; border-radius: 16px; }
    .skeleton-table-row { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid rgba(34,27,24,0.06); }
    .skeleton-table-cell { height: 20px; border-radius: 10px; }
    .skeleton-card { background: rgba(255,248,239,0.82); padding: 24px; border-radius: 22px; box-shadow: 0 4px 16px rgba(96,52,25,0.08); border: 1px solid rgba(255,255,255,0.45); border-left: 4px solid var(--navy-accent); }
    .skeleton-icon { width: 60px; height: 60px; border-radius: 16px; margin-bottom: 16px; }
    .skeleton-text { height: 16px; margin-bottom: 12px; border-radius: 10px; }
    .skeleton-text-large { height: 32px; margin-bottom: 8px; border-radius: 10px; }
    .skeleton-chart { width: 100%; height: 300px; border-radius: 14px; }

    /* Stat Cards */
    .stat-card { background: rgba(255,248,239,0.82); backdrop-filter: blur(12px); padding: 24px; border-radius: 22px; box-shadow: 0 4px 16px rgba(96,52,25,0.08); border: 1px solid rgba(255,255,255,0.45); transition: all 0.3s; }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(96,52,25,0.14); }
    .stat-card-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; background: linear-gradient(135deg, var(--navy-accent) 0%, #d8733f 100%); color: var(--warm-cream); }
    .stat-card-value { font-size: 32px; font-weight: 700; color: var(--navy-primary); margin-bottom: 8px; }
    .stat-card-label { font-size: 14px; color: var(--warm-muted); font-weight: 500; text-transform: uppercase; }

    /* Charts */
    .chart-card { background: rgba(255,248,239,0.82); backdrop-filter: blur(12px); padding: 24px; border-radius: 22px; box-shadow: 0 4px 16px rgba(96,52,25,0.08); border: 1px solid rgba(255,255,255,0.45); }
    .chart-card h3 { color: var(--navy-primary); font-size: 18px; margin-bottom: 20px; font-weight: 600; font-family: 'Cormorant Garamond', serif; }
    .chart-container { position: relative; height: 300px; }

    /* Grids */
    .dashboard-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .dashboard-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }

    /* DataTable */
    table.dataTable { width: 100% !important; border-collapse: collapse; background: rgba(255,248,239,0.9); border-radius: 14px; overflow: hidden; }
    table.dataTable thead th { background: var(--navy-primary) !important; color: var(--warm-cream) !important; padding: 14px !important; text-align: left; font-weight: 600; font-size: 14px; }
    table.dataTable tbody td { padding: 12px 14px !important; font-size: 14px; color: #4a3f37; }
    table.dataTable tbody tr:hover { background: rgba(181,77,45,0.06) !important; }
    .dt-buttons { margin-bottom: 15px; }

    .dt-button:hover { background: var(--navy-hover) !important; }

    /* Action Icons */
    .action-icon { background: transparent; border: none; cursor: pointer; font-size: 18px; padding: 6px 10px; margin: 0 4px; border-radius: 2px; transition: all 0.3s; }
    .action-icon.edit-icon { color: #fbbc04; }
    .action-icon.edit-icon:hover { background: rgba(251,188,4,0.1); transform: scale(1.15); }
    .action-icon.delete-icon { color: #ea4335; }
    .action-icon.delete-icon:hover { background: rgba(234,67,53,0.1); transform: scale(1.15); }

    /* Status Badge */
    .status-badge { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; display: inline-block; }
    .status-active { background: #d4edda; color: #155724; }
    .status-inactive { background: #f8d7da; color: #721c24; }

    /* Role Badges */
    .role-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .role-admin { background: #d4edda; color: #155724; }
    .role-chef { background: #fff3e0; color: #e65100; }
    .role-rider { background: #e3f2fd; color: #1565c0; }

    /* Buttons */
    .btn { padding: 10px 20px; border: none; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .btn-primary { background: linear-gradient(135deg, var(--navy-accent) 0%, #d8733f 100%); color: var(--warm-cream); box-shadow: 0 8px 20px rgba(181,77,45,0.2); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(181,77,45,0.3); }
    .btn-success { background: #34a853; color: white; }
    .btn-success:hover { background: #2d8f47; transform: translateY(-2px); }
    .btn-danger { background: #ea4335; color: white; }
    .btn-secondary { background: var(--warm-muted); color: white; }
    .btn:disabled { background: #c4b5a5; cursor: not-allowed; }
    .btn-sm { padding: 8px 16px; font-size: 13px; font-weight: 600; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #4a3f37; font-weight: 500; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px 16px; border: 1px solid rgba(34,27,24,0.15); border-radius: 14px; font-size: 16px; transition: all 0.3s; font-family: inherit; background: rgba(255,248,239,0.6); }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--navy-accent); box-shadow: 0 0 0 3px rgba(181,77,45,0.12); }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .form-actions { display: flex; gap: 10px; margin-top: 30px; }
    .error { margin-top: 15px; color: #ea4335; font-size: 14px; }

    /* Filters */
    .filters-section { background: rgba(255,248,239,0.6); border: 1px solid rgba(255,255,255,0.45); border-radius: 22px; padding: 20px; margin-bottom: 25px; backdrop-filter: blur(8px); }

    .filters-header h3 { font-size: 18px; color: var(--navy-primary); font-weight: 600; display: flex; align-items: center; gap: 10px; margin: 0; }
    .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }

    .filter-group label { font-size: 13px; font-weight: 600; color: var(--navy-primary); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .filter-input { width: 100%; padding: 10px 12px; border: 1px solid rgba(34,27,24,0.12); border-radius: 14px; font-size: 16px; transition: all 0.3s; font-family: inherit; background: rgba(255,248,239,0.8); touch-action: manipulation; }
    .filter-input:focus { outline: none; border-color: var(--navy-accent); box-shadow: 0 0 0 3px rgba(181,77,45,0.12); }

    /* SweetAlert2 Form Styles */
    .swal-form { text-align: left; padding: 0 5px; }
    .swal-form .form-group { margin-bottom: 15px; }

    .swal-form .form-group input,
    .swal-form .form-group select { width: 100%; padding: 11px 14px; border: 1px solid rgba(34,27,24,0.15); border-radius: 14px; font-size: 16px; font-family: inherit; transition: all 0.3s; margin: 0; background: rgba(255,248,239,0.6); }
    .swal-form .form-group input:focus,

    .swal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    /* Account Section */

    .about-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding: 25px; background: linear-gradient(135deg, var(--navy-primary) 0%, var(--navy-light) 100%); border-radius: 22px; color: var(--warm-cream); }
    .about-logo img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(255,248,239,0.3); object-fit: cover; }

<body>
  <div id="root"></div>

  <script>
  // ─── BACKEND CONFIG ───────────────────────────────────
  // Leave this set to your Apps Script /exec URL. This is the
  // only line you touch if you ever redeploy the backend.
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwActm2DhQY8_cyQDpmje-mpSGFfpP2bbakD2NoaAHzN6WfQ3X9pfUGtJT705dKJMnT/exec';
</script>

  <script type="text/babel">
    /**
     * Developed by Fanen Iorwuese
     * WhatsApp: https://wa.me/8108076212 (For Custom Projects)
     * YouTube: https://www.youtube.com/@PuzzlePonder724/ (Subscribe for more!)
     */

    const { useState, useEffect, useRef } = React;

    // ==================== HELPERS ====================


 const serverCall = (functionName, ...args) => {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        [functionName](...args);
    });
  }

  const base = (typeof BACKEND_URL !== 'undefined' && BACKEND_URL)
    ? BACKEND_URL
    : window.location.href.split('?')[0];

  // GET (not POST) — Apps Script only adds the CORS header reliably on GET.
  const payload = encodeURIComponent(JSON.stringify({ fn: functionName, args }));
  const url = base + '?payload=' + payload;

  return fetch(url, { method: 'GET' })
    .then((res) => {
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      return res.json();
    })
    .then((data) => {
      if (data && typeof data === 'object' && data.__error) {
        throw new Error(data.__error);
      }
      return data;
    });
};
    const escapeHtml = (str) => {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };

    let APP_CURRENCY = (() => { try { return localStorage.getItem('food_app_currency') || '€'; } catch(e) { return '€'; } })();
    const formatPrice = (v) => APP_CURRENCY + parseFloat(v || 0).toLocaleString();

    const formatDate = (isoString) => {
      if (!isoString) return '-';
      return new Date(isoString).toLocaleString('en-US', { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    };

    const getTimeAgo = (isoString) => {
      if (!isoString) return '-';
      const seconds = Math.floor((new Date() - new Date(isoString)) / 1000);
      if (seconds < 60) return seconds + 's ago';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      return Math.floor(seconds / 86400) + 'd ago';
    };
    const slugifyCategory = (cat) => {
      if (!cat) return '';
      return String(cat)
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    };
    // ==================== DARK MODE ====================
    function useDarkMode() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('food_app_theme') || 'light'; } catch(e) { return 'light'; }
      });
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('food_app_theme', theme); } catch(e) {}
      }, [theme]);
      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      return [theme, toggleTheme];
    }

    function ThemeToggleButton({ theme, toggleTheme, style }) {
      return (
        <button className="theme-toggle-btn" onClick={toggleTheme} style={style} title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
          <i className={'fas ' + (theme === 'dark' ? 'fa-sun' : 'fa-moon')}></i>
        </button>
      );
    }

    // ==================== SEARCHABLE DROPDOWN ====================

    function SearchableDropdown({ options, value, onChange, placeholder = 'Select...', label, icon, required = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const dropdownRef = useRef(null);

      const selectedLabel = options.find(o => o.value === value)?.label || '';

      const filtered = options.filter(o =>
        o.label.toLowerCase().includes(search.toLowerCase())
      );

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
            setSearch('');
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const handleSelect = (option) => {
        onChange(option.value);
        setIsOpen(false);
        setSearch('');
      };

      const handleInputChange = (e) => {
        setSearch(e.target.value);
        if (!isOpen) setIsOpen(true);
      };

      const handleInputClick = () => {
        setIsOpen(!isOpen);
        if (!isOpen) setSearch('');
      };

      return (
        <div className="form-group">
          {label && <label>{icon && <i className={icon}></i>} {label}{required && ' *'}</label>}
          <div className="searchable-dropdown" ref={dropdownRef}>
            <input
              type="text"
              className="searchable-dropdown-input"
              placeholder={placeholder}
              value={isOpen ? search : selectedLabel}
              onChange={handleInputChange}
              onClick={handleInputClick}
              required={required && !value}
            />
            <span className={'searchable-dropdown-arrow ' + (isOpen ? 'open' : '')}>
              <i className="fas fa-chevron-down"></i>
            </span>
            {isOpen && (
              <div className="searchable-dropdown-list">
                <div
                  className={'searchable-dropdown-item ' + (!value ? 'selected' : '')}
                  onClick={() => handleSelect({ value: '', label: '' })}
                >
                  {placeholder}
                </div>
                {filtered.length > 0 ? (
                  filtered.map((option, idx) => (
                    <div
                      key={idx}
                      className={'searchable-dropdown-item ' + (value === option.value ? 'selected' : '')}
                      onClick={() => handleSelect(option)}
                    >
                      {option.label}
                    </div>
                  ))
                ) : (
                  <div className="searchable-dropdown-item no-results">No results found</div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== SKELETONS ====================

    function TableSkeleton({ rows = 5, columns = 6 }) {
      return (
        <div className="skeleton-table">
          <div className="skeleton-table-row">{[...Array(columns)].map((_, i) => <div key={i} className="skeleton skeleton-table-cell" style={{flex: 1}}></div>)}</div>
          {[...Array(rows)].map((_, r) => <div key={r} className="skeleton-table-row">{[...Array(columns)].map((_, c) => <div key={c} className="skeleton skeleton-table-cell" style={{flex: 1}}></div>)}</div>)}
        </div>
      );
    }

    function DashboardCardSkeleton() {
      return (
        <div className="skeleton-card">
          <div className="skeleton skeleton-icon"></div>
          <div className="skeleton skeleton-text-large" style={{width: '60%'}}></div>
          <div className="skeleton skeleton-text" style={{width: '80%'}}></div>
        </div>
      );
    }

    function ChartSkeleton() {
      return <div className="chart-card"><div className="skeleton skeleton-chart"></div></div>;
    }

    // ==================== HOMEPAGE ====================

    const LOGO_URL = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhV0q9dJ-42e6g7EzB6GLU7O_fOt-mTxyv3VvE98oHsC4L_Bkmy9dcs3stw_ksy9JGcGQy1uT8fpVQemlNJsqLDzb1RZKq1nDbOx0qeHMh0JdJx97h93Di6MxSYJPHYCn3m-K_fBmoFT57wVSov8LeKyPj8AfM0xIG4xEQNb6CtqOBefk4/s1600/WhatsApp%20Image%202026-05-14%20at%204.19.28%20PM.jpeg';

    function HomePage({ onStaffLogin, onOrderFood, onTrackOrder, cart, setCart, theme, toggleTheme }) {
      const [menuItems, setMenuItems] = useState([]);
      const [combos, setCombos] = useState([]);
      const [activeCategory, setActiveCategory] = useState('all');
      const [menuLoading, setMenuLoading] = useState(true);
      const [extrasCache, setExtrasCache] = useState({});
      const [recentlyAdded, setRecentlyAdded] = useState('');
      const [cartPulse, setCartPulse] = useState(false);
      const filtersRef = useRef(null);
      const scrollFilters = (dir) => {
    if (filtersRef.current) filtersRef.current.scrollBy({ left: dir * 240, behavior: 'smooth' });
  };

      useEffect(() => {
        Promise.all([
          serverCall('getPublicMenu'),
          serverCall('getPublicCombos'),
          serverCall('getAllPublicExtras')
        ]).then(([menuRes, comboRes, extrasRes]) => {
          if (menuRes.success) setMenuItems(menuRes.data);
          if (comboRes.success) setCombos(comboRes.data);
          if (extrasRes.success && extrasRes.data) setExtrasCache(extrasRes.data);
          setMenuLoading(false);
        }).catch(() => setMenuLoading(false));
      }, []);

      useEffect(() => {
        if (!recentlyAdded) return;
        const t = setTimeout(() => setRecentlyAdded(''), 1800);
        return () => clearTimeout(t);
      }, [recentlyAdded]);

      useEffect(() => {
        if (!cartPulse) return;
        const t = setTimeout(() => setCartPulse(false), 500);
        return () => clearTimeout(t);
      }, [cartPulse]);

      // Cart helpers
      const triggerCartFeedback = (msg) => {
        setCartPulse(false);
        requestAnimationFrame(() => setCartPulse(true));
        if (msg) setRecentlyAdded(msg);
      };
      const addToCart = (item) => {
        const itemExtras = extrasCache[item.item_id];
        if (itemExtras && itemExtras.length > 0) {
            const extrasHtml = itemExtras.map((ex, idx) =>
              '<label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,248,239,0.6);margin-bottom:8px;cursor:pointer;border:1px solid rgba(34,27,24,0.06)"><input type="checkbox" class="swal-extra-check" data-idx="' + idx + '" style="width:18px;height:18px" /><span style="flex:1;font-weight:500">' + escapeHtml(ex.extra_name) + '</span><span style="color:var(--navy-accent);font-weight:700">+' + formatPrice(ex.extra_price) + '</span></label>'
            ).join('');
            Swal.fire({
              title: '<i class="fas fa-plus-circle" style="color:#221b18"></i> ' + escapeHtml(item.name),
              html: '<div class="swal-form"><p style="color:var(--warm-muted);margin-bottom:12px;font-size:13px">Select add-ons (optional):</p>' + extrasHtml + '</div>',
              width: 420,
              showCancelButton: true,
              confirmButtonText: '<i class="fas fa-cart-plus"></i> Add to Cart',
              confirmButtonColor: '#b54d2d',
              cancelButtonText: 'Skip Extras',
              preConfirm: () => {
                const selectedExtras = [];
                document.querySelectorAll('.swal-extra-check:checked').forEach(cb => {
                  const idx = parseInt(cb.dataset.idx);
                  selectedExtras.push({ extra_name: itemExtras[idx].extra_name, extra_price: parseFloat(itemExtras[idx].extra_price) });
                });
                return selectedExtras;
              }
            }).then((result) => {
              if (result.isConfirmed || result.dismiss === Swal.DismissReason.cancel) {
                const selectedExtras = result.isConfirmed ? result.value : [];
                addToCartWithExtras(item, selectedExtras);
              }
            });
        } else {
            addToCartWithExtras(item, []);
        }
      };

      const addToCartWithExtras = (item, extras) => {
        const extrasKey = extras.map(e => e.extra_name).sort().join(',');
        const cartKey = item.item_id + '_' + extrasKey;
        const extrasTotal = extras.reduce((s, e) => s + e.extra_price, 0);
        const existing = cart.find(c => c._cartKey === cartKey);
        if (existing) {
          setCart(cart.map(c => c._cartKey === cartKey ? { ...c, qty: c.qty + 1, total_price: (c.qty + 1) * (c.unit_price + extrasTotal) } : c));
        } else {
          setCart([...cart, { item_id: item.item_id, _cartKey: cartKey, item_name: item.name, qty: 1, unit_price: parseFloat(item.price), extras: extras, total_price: parseFloat(item.price) + extrasTotal }]);
        }
        triggerCartFeedback(item.name + ' added to cart');
      };
      const updateCartQty = (cartKey, delta) => {
        setCart(cart.map(c => {
          if ((c._cartKey || c.item_id) !== cartKey) return c;
          const newQty = c.qty + delta;
          if (newQty <= 0) return null;
          const extrasTotal = c.extras ? c.extras.reduce((s, e) => s + e.extra_price, 0) : 0;
          return { ...c, qty: newQty, total_price: newQty * (c.unit_price + extrasTotal) };
        }).filter(Boolean));
        triggerCartFeedback();
      };
      const removeCartItem = (cartKey) => {
        setCart(cart.filter(c => (c._cartKey || c.item_id) !== cartKey));
        triggerCartFeedback();
      };
      const addComboToCart = (combo) => {
        const cartKey = 'combo_' + combo.combo_id;
        const existing = cart.find(c => c._cartKey === cartKey);
        if (existing) {
          setCart(cart.map(c => c._cartKey === cartKey ? { ...c, qty: c.qty + 1, total_price: (c.qty + 1) * c.unit_price } : c));
        } else {
          setCart([...cart, {
            item_id: combo.combo_id, _cartKey: cartKey, item_name: combo.name + ' (Combo)',
            qty: 1, unit_price: combo.combo_price, total_price: combo.combo_price,
            extras: combo.items.map(it => ({ item_id: it.item_id, item_name: it.item_name, qty: it.qty, extra_price: 0 })),
            is_combo: true, combo_id: combo.combo_id
          }]);
        }
        triggerCartFeedback(combo.name + ' added to cart');
      };
      const cartTotal = cart.reduce((s, c) => s + c.total_price, 0);
      const cartCount = cart.reduce((s, c) => s + c.qty, 0);
      const deliveryFee = cartTotal > 0 ? 2.50 : 0;
      const grandTotal = cartTotal + deliveryFee;

      const categories = ['all', ...new Set(menuItems.map(m => m.category))];
      const filteredMenu = activeCategory === 'all' ? menuItems : menuItems.filter(m => m.category === activeCategory);

      // Featured items (first 3 menu items)
      const featuredItems = menuItems.slice(0, 3);

      const scrollToCart = () => {
        const el = document.getElementById('hp-cart-panel');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      return (
        <div className="homepage">
          {/* Toast notification */}
          {recentlyAdded && (
            <div className="hp-toast">
              <strong>Cart updated</strong>
              <span>{recentlyAdded}</span>
            </div>
          )}

          <div className="hp-shell">
            {/* Topbar */}
            <header className="hp-topbar">
              <a href="#" className="hp-brand" onClick={(e) => { e.preventDefault(); window.scrollTo({top: 0, behavior: 'smooth'}); }}>
                <div className="hp-brand-mark"><img src={LOGO_URL} alt="Logo" /></div>
                <div className="hp-brand-copy">
                  <strong>Chop Fast Lagos</strong>
                  <span>Delicious food, delivered warm.</span>
                </div>
              </a>
              <div className="hp-topbar-meta">
                <div className="hp-pill"><i className="fas fa-clock"></i> Open: 10AM - 11PM</div>
                <div className="hp-pill"><i className="fas fa-truck"></i> Delivery & Pickup</div>

                              <div key={eidx} style={{fontSize: '11px', color: 'var(--navy-accent)', marginTop: '2px'}}>+ {ex.extra_name} (+{formatPrice(ex.extra_price)})</div>

                        <div className="hp-stepper-row">

                <div className="hp-cart-summary">
                  <div className="hp-summary-row">
                    <span>Subtotal</span>

          {/* Footer */}

            <div className="hp-footer-content">

                <p>Delicious food, delivered fast. Experience the best local cuisine from the comfort of your home.</p>
                <div className="hp-footer-social">
                  <a href="https://wa.me/8108076212" target="_blank" className="wa-btn"><i className="fab fa-whatsapp"></i></a>
                  <a href="https://www.youtube.com/@PuzzlePonder724" target="_blank" className="yt-btn"><i className="fab fa-youtube"></i></a>
                </div>

                <a href="#" onClick={(e) => { e.preventDefault(); window.scrollTo({top: 0, behavior: 'smooth'}); }}>Home</a>

              <p>Developed with <i className="fas fa-heart" style={{color: '#ea4335'}}></i> by <strong>Fanen Iorwuese</strong> | v3.0.0</p>

                  <div className="order-detail-row"><span className="label">Order ID</span><span className="value" style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '16px'}}>{orderResult.order_id}</span></div>
                  <div className="order-detail-row"><span className="label">Name</span><span className="value">{orderResult.customer_name}</span></div>
                  <div className="order-detail-row"><span className="label">Phone</span><span className="value">{orderResult.phone}</span></div>
                  {orderResult.email && <div className="order-detail-row"><span className="label">Email</span><span className="value">{orderResult.email}</span></div>}
                  <div className="order-detail-row"><span className="label">Order Type</span><span className={'type-badge type-' + orderResult.type.replace('_', '')}>{orderResult.type.replace('_', ' ')}</span></div>
                  <div className="order-detail-row"><span className="label">Payment</span><span className="value"><i className={(orderResult.payment_method === 'paystack' ? 'fas fa-credit-card' : 'fas fa-money-bill-wave')} style={{marginRight: '6px'}}></i>{orderResult.payment_method === 'paystack' ? 'Paystack (Paid)' : 'Cash on Delivery'}</span></div>
                </div>

                <h4 style={{color: 'var(--navy-primary)', marginBottom: '12px'}}><i className="fas fa-shopping-bag"></i> Order Items</h4>
                <div className="about-table-wrapper">
                  <table className="about-roles-table" style={{fontSize: '13px'}}>
                    <thead><tr><th style={{textAlign: 'left'}}>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                    <tbody>
                      {orderResult.items.map((it, idx) => (
                        <tr key={idx}><td style={{textAlign: 'left', fontWeight: 500}}>{it.item_name}</td><td>{it.qty}</td><td>{formatPrice(it.unit_price)}</td><td><strong>{formatPrice(it.total_price)}</strong></td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div style={{marginTop: '16px'}}>
                  <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(orderResult.subtotal)}</span></div>
                  {orderResult.delivery_charge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(orderResult.delivery_charge)}</span></div>}
                  {orderResult.discount > 0 && <div className="order-detail-row"><span className="label" style={{color: 'var(--success)'}}>Discount {orderResult.promo_code ? '(' + orderResult.promo_code + ')' : ''}</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(orderResult.discount)}</span></div>}
                  <div className="order-total-row"><span>Total</span><span>{formatPrice(orderResult.total)}</span></div>
                </div>

                <button className="btn btn-primary" style={{width: '100%', marginTop: '24px', padding: '14px', fontSize: '16px', background: 'linear-gradient(135deg, #221b18, #3a2f2a)', border: 'none', color: '#fff', borderRadius: '999px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', fontWeight: '600', fontFamily: 'inherit', boxShadow: '0 4px 16px rgba(34,27,24,0.2)'}} onClick={printReceipt}>
                  <i className="fas fa-receipt"></i> Print Receipt
                </button>
                <button className="btn btn-primary" style={{width: '100%', marginTop: '10px', padding: '14px', fontSize: '16px'}} onClick={onBack}>
                  <i className="fas fa-home"></i> Back to Home
                </button>
                {onTrackOrder && (
                  <button className="btn btn-secondary" style={{width: '100%', marginTop: '10px', padding: '14px', fontSize: '16px', borderRadius: '999px'}} onClick={onTrackOrder}>
                    <i className="fas fa-search-location"></i> Track My Order
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ---- CHECKOUT FORM ----
      const categories = ['all', ...new Set(menuItems.map(m => m.category)), ...(combos.length > 0 ? ['COMBO'] : [])];
      const filteredMenu = posCategory === 'COMBO' ? [] : (posCategory === 'all' ? menuItems : menuItems.filter(m => m.category === posCategory));
      const cartItemIds = formItems.map(fi => fi.item_id);
      const moreSection = (
            <section className="data-section checkout-more" id="checkout-more" style={{padding: '16px 20px'}}>
              <button type="button" className="checkout-more-toggle" aria-expanded={moreOpen} aria-controls="checkout-more-body" onClick={() => setMoreOpen(o => !o)}>
                <span>
                  <span className="checkout-more-title"><i className="fas fa-utensils"></i> {formItems.length > 0 ? 'Add more items' : 'Choose your items'}</span>
                  <small>{moreOpen ? 'Tap a dish to add it to your cart' : 'Forgot something? Open the menu'}</small>
                </span>
                <i className={'fas fa-chevron-' + (moreOpen ? 'up' : 'down')} aria-hidden="true"></i>
              </button>
              {moreOpen && (
                <div id="checkout-more-body" style={{marginTop: '12px'}}>
                    <div className="category-tabs" style={{marginBottom: '16px'}}>
                      {categories.map(cat => (
                        <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>
                          {cat === 'all' ? 'All Items' : cat}
                        </button>
                      ))}
                    </div>
                    {menuLoading ? (
                      <div style={{textAlign: 'center', padding: '40px', color: '#c4b5a5'}}>
                        <i className="fas fa-spinner fa-spin" style={{fontSize: '24px'}}></i>
                        <p style={{marginTop: '8px'}}>Loading menu...</p>
                      </div>
                    ) : (
                      <div className="pos-grid">
                        {filteredMenu.map(item => {
                          const inCart = cartItemIds.includes(item.item_id);
                          const cartItemQty = formItems.filter(fi => fi.item_id === item.item_id).reduce((s, fi) => s + fi.qty, 0);
                          return (
                            <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '') + (item.out_of_stock ? ' out-of-stock' : '')} onClick={() => !item.out_of_stock && posAddItemSimple(item)}>
                              {inCart && <span className="pos-item-badge">{cartItemQty}</span>}
                              {item.image_url ? (
                                <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} />
                              ) : (
                                <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}>
                                  <i className="fas fa-utensils" style={{fontSize: '24px'}}></i>
                                </div>
                              )}
                              <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', color: 'var(--navy-primary)'}}>{item.name}</div>
                              <div style={{fontWeight: '700', color: 'var(--navy-accent)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                            </div>
                          );
                        })}
                        {(posCategory === 'COMBO' || posCategory === 'all') && combos.map(combo => {
                          const inCart = cartItemIds.includes(combo.combo_id);
                          const cartQty = formItems.filter(fi => fi.combo_id === combo.combo_id).reduce((s, fi) => s + fi.qty, 0);
                          return (
                            <div key={combo.combo_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddCombo(combo)} style={{borderColor: '#d5a242'}}>
                              {inCart && <span className="pos-item-badge">{cartQty}</span>}
                              <div style={{width: '100%', height: '80px', background: 'linear-gradient(135deg, #f0c7a1, #f7efe3)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#d5a242'}}>
                                <i className="fas fa-layer-group" style={{fontSize: '24px'}}></i>
                              </div>
                              <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px', color: 'var(--navy-primary)'}}>{combo.name}</div>
                              <div style={{fontWeight: '700', color: '#2e7d32', fontSize: '12px'}}>Save {combo.savings_percent}%</div>
                              <div style={{fontWeight: '700', color: 'var(--navy-accent)', fontSize: '14px'}}>{formatPrice(combo.combo_price)}</div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                </div>
              )}
            </section>
      );

      return (
        <div style={{minHeight: '100vh', background: '#f7efe3'}}>
          <nav className="checkout-topnav" style={{background: 'var(--navy-primary)', color: 'var(--warm-cream)', padding: '14px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, zIndex: 100, borderRadius: '0 0 22px 22px', boxShadow: '0 4px 20px rgba(34,27,24,0.15)'}}>
            <button type="button" className="nav-link-btn" onClick={onBack} aria-label="Chop Fast Lagos home" style={{gap: '12px'}}>
              <img src={LOGO_URL} alt="" style={{width: '36px', height: '36px', borderRadius: '50%'}} />
              <span style={{fontWeight: '700', fontSize: '18px'}}>Checkout</span>
            </button>
            <button type="button" className="nav-link-btn" style={{color: 'var(--warm-cream)', fontSize: '14px'}} onClick={onBack} aria-label="Back to menu">
              <i className="fas fa-arrow-left"></i> Back to Menu
            </button>
          </nav>

          <div style={{maxWidth: '1200px', margin: '0 auto', padding: '20px'}}>
            {menuFirst && moreSection}
            <div className="checkout-layout">
              <div className="checkout-main">
                <div className="data-section" style={{padding: '20px'}}>
                  <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-user"></i> Your Details</h3>
                  {customer ? (
                    <div className="auth-alert success" role="status"><i className="fas fa-user-check"></i><span>Signed in as <strong>{customer.email}</strong>. This order will be saved to your order history.</span></div>
                  ) : onSignIn ? (
                    <div className="auth-alert info"><i className="fas fa-info-circle"></i><span>Have an account? <button type="button" className="auth-link" style={{minHeight: 0, padding: 0}} onClick={onSignIn}>Sign in</button> to fill in your details and save this order to your history. Or just continue as a guest.</span></div>
                  ) : null}
                  <div className="form-grid">
                    <div className="form-group">
                      <label><i className="fas fa-user"></i> Full Name *</label>
                      <input type="text" value={customerInfo.name} onChange={(e) => setCustomerInfo({...customerInfo, name: e.target.value})} placeholder="Enter your full name" />
                    </div>
                    <div className="form-group">
                      <label><i className="fas fa-phone"></i> Phone *</label>
                      <input type="tel" value={customerInfo.phone} onChange={(e) => setCustomerInfo({...customerInfo, phone: e.target.value})} placeholder="e.g. 08108076212" />
                    </div>
                    <div className="form-group">
                      <label><i className="fas fa-envelope"></i> Email</label>
                      <input type="email" value={customerInfo.email} onChange={(e) => setCustomerInfo({...customerInfo, email: e.target.value})} placeholder="your@email.com (required for Paystack)" />
                    </div>
                    <div className="form-group">
                      <label><i className="fas fa-tag"></i> Order Type</label>
                      <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                        <option value="delivery">Delivery</option>
                        <option value="pickup">Pickup</option>
                      </select>
                    </div>
                    {formData.type === 'delivery' && (
                      <>
                        <div className="form-group">
                          <label><i className="fas fa-map-marker-alt"></i> Delivery Address *</label>
                          <input type="text" value={customerInfo.address} onChange={(e) => setCustomerInfo({...customerInfo, address: e.target.value})} placeholder="Your delivery address" />
                        </div>
                        <div className="form-group">
                          <label><i className="fas fa-city"></i> City</label>
                          <input type="text" value={customerInfo.city} onChange={(e) => setCustomerInfo({...customerInfo, city: e.target.value})} placeholder="City" />
                        </div>
                      </>
                    )}
                    <div className="form-group">
                      <label><i className="fas fa-credit-card"></i> Payment Method</label>
                      <div className="pay-options" style={{display: 'flex', gap: '12px', marginTop: '4px'}}>
                        <label style={{flex: 1, display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '18px', border: formData.payment_method === 'cash' ? '2px solid var(--navy-accent)' : '1px solid rgba(34,27,24,0.1)', background: formData.payment_method === 'cash' ? 'rgba(181,77,45,0.08)' : 'rgba(255,248,239,0.6)', cursor: 'pointer', transition: 'all 0.2s'}}>
                          <input type="radio" name="payment" value="cash" checked={formData.payment_method === 'cash'} onChange={() => setFormData({...formData, payment_method: 'cash'})} style={{display: 'none'}} />
                          <i className="fas fa-money-bill-wave" style={{fontSize: '20px', color: formData.payment_method === 'cash' ? '#2e7d32' : '#a89888'}}></i>
                          <span style={{fontWeight: '600', color: formData.payment_method === 'cash' ? 'var(--navy-primary)' : 'var(--warm-muted)'}}>Cash on Delivery</span>
                        </label>
                        <label style={{flex: 1, display: 'flex', alignItems: 'center', gap: '10px', padding: '12px 16px', borderRadius: '18px', border: formData.payment_method === 'paystack' ? '2px solid var(--navy-accent)' : '1px solid rgba(34,27,24,0.1)', background: formData.payment_method === 'paystack' ? 'rgba(181,77,45,0.08)' : 'rgba(255,248,239,0.6)', cursor: 'pointer', transition: 'all 0.2s'}}>
                          <input type="radio" name="payment" value="paystack" checked={formData.payment_method === 'paystack'} onChange={() => setFormData({...formData, payment_method: 'paystack'})} style={{display: 'none'}} />
                          <i className="fas fa-credit-card" style={{fontSize: '20px', color: formData.payment_method === 'paystack' ? '#0ba4db' : '#a89888'}}></i>
                          <span style={{fontWeight: '600', color: formData.payment_method === 'paystack' ? 'var(--navy-primary)' : 'var(--warm-muted)'}}>Pay Online</span>
                        </label>
                      </div>
                    </div>
                    <div className="form-group" style={{gridColumn: '1 / -1'}}>
                      <label><i className="fas fa-sticky-note"></i> Notes (optional)</label>
                      <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions" />
                    </div>
                  </div>
                  {formItems.length > 0 && (
                    <div className="mobile-only checkout-mobile-submit">
                      <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>
                      <button type="button" className="btn btn-success" style={{width: '100%', marginTop: '10px', padding: '14px'}} onClick={submitOrder} disabled={submitting}>
                        {submitting ? <><i className="fas fa-spinner fa-spin"></i> Placing Order...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                      </button>
                    </div>
                  )}
                </div>
              </div>
              <div className="checkout-side">
                  <div className="pos-cart-section">
                    <div className="pos-cart">
                      <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>
                      {formItems.length === 0 && (
                        <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                          <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                          <p style={{fontSize: '13px', marginBottom: '12px'}}>Your cart is empty</p>
                          <button type="button" className="btn btn-primary btn-sm" onClick={openMore}><i className="fas fa-utensils"></i> Choose items</button>
                        </div>
                      )}
                      {formItems.map(fi => (
                        <div key={fi._cartKey || fi.item_id} className="pos-cart-row" style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                          <div style={{flex: 1, minWidth: 0}}>
                            <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                            <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                            {fi.is_combo && fi.extras && fi.extras.length > 0 && fi.extras.map((ci, cidx) => (
                              <div key={cidx} style={{fontSize: '11px', color: '#2e7d32', paddingLeft: '8px'}}>{ci.qty}x {ci.item_name}</div>
                            ))}
                            {!fi.is_combo && fi.extras && fi.extras.length > 0 && fi.extras.map((ex, eidx) => (
                              <div key={eidx} style={{fontSize: '11px', color: 'var(--navy-accent)', paddingLeft: '8px'}}>+ {ex.extra_name} (+{formatPrice(ex.extra_price)})</div>
                            ))}
                          </div>
                          <div className="pos-qty-controls">
                            <button className="pos-qty-btn" type="button" aria-label="Decrease quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi._cartKey || fi.item_id, -1); }}>-</button>
                            <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                            <button className="pos-qty-btn" type="button" aria-label="Increase quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi._cartKey || fi.item_id, 1); }}>+</button>
                          </div>
                          <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                          <button type="button" aria-label="Remove item" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px'}} onClick={() => removeItem(fi._cartKey || fi.item_id)}><i className="fas fa-trash"></i></button>
                        </div>
                      ))}
                      {formItems.length > 0 && (
                        <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                          <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                          {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                          {promoDiscount > 0 && <div className="order-detail-row"><span className="label" style={{color: 'var(--success)'}}>Promo ({promoApplied.code})</span><span className="value" style={{color: 'var(--success)'}}>-{formatPrice(promoDiscount)}</span></div>}
                          <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>

                          <div style={{marginTop: '12px', marginBottom: '12px'}}>
                            {!promoApplied ? (
                              <div style={{display: 'flex', gap: '8px'}}>
                                <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value.toUpperCase())} placeholder="Promo code" style={{flex: 1, padding: '10px 14px', border: '1px solid rgba(34,27,24,0.15)', borderRadius: '999px', fontSize: '14px', fontFamily: 'inherit', background: 'rgba(255,248,239,0.6)', letterSpacing: '1px'}} onKeyPress={(e) => e.key === 'Enter' && applyPromo()} />
                                <button className="btn btn-primary btn-sm" onClick={applyPromo} disabled={promoLoading} style={{borderRadius: '999px', whiteSpace: 'nowrap'}}>
                                  {promoLoading ? <i className="fas fa-spinner fa-spin"></i> : <><i className="fas fa-tag"></i> Apply</>}
                                </button>
                              </div>
                            ) : (
                              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 14px', background: 'rgba(52,168,83,0.1)', borderRadius: '999px', border: '1px solid rgba(52,168,83,0.2)'}}>
                                <span style={{color: 'var(--success)', fontWeight: '600', fontSize: '13px'}}><i className="fas fa-check-circle"></i> {promoApplied.code} applied</span>
                                <button onClick={removePromo} style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', fontSize: '13px', fontWeight: '600'}}><i className="fas fa-times"></i> Remove</button>
                              </div>
                            )}
                          </div>

                          <button className="btn btn-success hide-mobile" style={{width: '100%', marginTop: '4px', padding: '14px'}} onClick={submitOrder} disabled={submitting}>
                            {submitting ? <><i className="fas fa-spinner fa-spin"></i> Placing Order...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
              </div>
            </div>
            {!menuFirst && moreSection}
          </div>
        </div>
      );
    }
    // ==================== CUSTOMER DASHBOARD ====================
    function CustomerDashboard({ user, onLogout, initialCart, clearHomeCart, theme, toggleTheme }) {
      const hasInitialCart = initialCart && initialCart.length > 0;
      const [activeTab, setActiveTab] = useState(hasInitialCart ? 'order' : 'dashboard');
      const [stats, setStats] = useState(null);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [menuItems, setMenuItems] = useState([]);
      const [posCategory, setPosCategory] = useState('all');
      const [formItems, setFormItems] = useState(hasInitialCart ? initialCart : []);
      const [formData, setFormData] = useState({ type: 'delivery', address: '', city: '', notes: '' });
      const [submitting, setSubmitting] = useState(false);
      const [expandedOrder, setExpandedOrder] = useState(null);
      const [oldPass, setOldPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmNewPass, setConfirmNewPass] = useState('');

      useEffect(() => { loadData(); if (clearHomeCart) clearHomeCart(); }, []);

      const loadData = async () => {
        setLoading(true);
        try {
          const [statsRes, ordersRes] = await Promise.all([
            serverCall('getDashboardStats', user.id, user.role),
            serverCall('getOrders', user.id, user.role)
          ]);
          if (statsRes.success) setStats(statsRes.data);
          if (ordersRes.success) setOrders(ordersRes.data);
        } catch(e) {}
        setLoading(false);
      };

      const loadMenu = async () => {
        try {
          // getMenuItems is staff-only on the server; customers use the public menu
          const res = await serverCall('getPublicMenu');
          if (res.success) setMenuItems(res.data.filter(i => !i.out_of_stock));
        } catch(e) {}
      };

      useEffect(() => { if (activeTab === 'order') loadMenu(); }, [activeTab]);

      useEffect(() => {
        const iv = setInterval(() => {
          serverCall('getOrders', user.id, user.role).then(r => { if (r.success) setOrders(r.data); }).catch(() => {});
        }, 20000);
        return () => clearInterval(iv);
      }, []);

      const posAddItem = (menuItem) => {
        const existing = formItems.find(fi => fi.item_id === menuItem.item_id);
        if (existing) {
          setFormItems(formItems.map(fi => fi.item_id === menuItem.item_id ? { ...fi, qty: fi.qty + 1, total_price: (fi.qty + 1) * fi.unit_price } : fi));
        } else {
          setFormItems([...formItems, { item_id: menuItem.item_id, item_name: menuItem.name, qty: 1, unit_price: parseFloat(menuItem.price), total_price: parseFloat(menuItem.price), extras: [] }]);
        }
      };
      const posUpdateQty = (itemId, delta) => {
        setFormItems(prev => prev.map(fi => {
          if (fi.item_id !== itemId) return fi;
          const newQty = fi.qty + delta;
          if (newQty <= 0) return null;
          return { ...fi, qty: newQty, total_price: newQty * fi.unit_price };
        }).filter(Boolean));
      };
      const removeItem = (itemId) => setFormItems(formItems.filter(fi => fi.item_id !== itemId));
      const formSubtotal = formItems.reduce((s, i) => s + i.total_price, 0);
      const formDeliveryCharge = formData.type === 'delivery' ? 200 : 0;
      const formTotal = formSubtotal + formDeliveryCharge;

      const submitOrder = async () => {
        if (formItems.length === 0) { Swal.fire({ icon: 'warning', title: 'No Items', text: 'Please add items to your order' }); return; }
        setSubmitting(true);
        try {
          const payload = {
            customer_name: user.name,
            phone: user.username,
            email: '',
            type: formData.type,
            address: formData.address.trim(),
            city: formData.city.trim(),
            notes: formData.notes.trim(),
            items: formItems,
            payment_method: 'cash'
          };
          const res = await serverCall('addOrder', payload, user.id, user.role);
          setSubmitting(false);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Order Placed!', text: 'Order ID: ' + res.data.order_id, timer: 2500, showConfirmButton: false });
            setFormItems([]);
            setFormData({ type: 'delivery', address: '', city: '', notes: '' });
            setActiveTab('orders');
            loadData();
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) {
          setSubmitting(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to place order' });
        }
      };

      const handleChangePassword = async () => {
        if (!oldPass || !newPass) { Swal.fire({ icon: 'warning', title: 'Required', text: 'Fill in all password fields' }); return; }
        if (newPass.length < 6) { Swal.fire({ icon: 'warning', title: 'Too Short', text: 'New password must be at least 6 characters' }); return; }
        if (newPass !== confirmNewPass) { Swal.fire({ icon: 'warning', title: 'Mismatch', text: 'New passwords do not match' }); return; }
        try {
          const res = await serverCall('changePassword', user.id, oldPass, newPass);
          if (res.success) {
            Swal.fire({ icon: 'success', title: 'Changed!', text: res.message, timer: 1500, showConfirmButton: false });
            setOldPass(''); setNewPass(''); setConfirmNewPass('');
          } else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
        } catch(e) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to change password' }); }
      };

      const handleLogout = () => {
        Swal.fire({
          icon: 'question', title: 'Logout?', text: 'Are you sure?', showCancelButton: true,
          confirmButtonColor: '#ea4335', confirmButtonText: '<i class="fas fa-sign-out-alt"></i> Logout'
        }).then(r => { if (r.isConfirmed) onLogout(); });
      };

      const statusSteps = ['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered'];
      const statusStepLabels = { pending: 'Pending', confirmed: 'Confirmed', preparing: 'Preparing', ready: 'Ready', out_for_delivery: 'On the Way', delivered: 'Delivered' };
      const statusStepIcons = { pending: 'fa-clock', confirmed: 'fa-check', preparing: 'fa-fire', ready: 'fa-box', out_for_delivery: 'fa-motorcycle', delivered: 'fa-check-double' };

      const renderStatusProgress = (orderStatus) => {
        if (orderStatus === 'cancelled') {
          return <div style={{color: 'var(--danger)', fontWeight: '600', fontSize: '14px'}}><i className="fas fa-ban"></i> Order Cancelled</div>;
        }
        const currentIdx = statusSteps.indexOf(orderStatus);
        return (
          <div className="status-progress">
            {statusSteps.map((step, idx) => (
              <div key={step} className="status-progress-step">
                {idx < statusSteps.length - 1 && <div className={'status-progress-line' + (idx < currentIdx ? ' done' : '')}></div>}
                <div className={'status-progress-dot' + (idx < currentIdx ? ' done' : '') + (idx === currentIdx ? ' active' : '')}>
                  <i className={'fas ' + statusStepIcons[step]}></i>
                </div>
                <div className={'status-progress-label' + (idx === currentIdx ? ' active' : '')}>{statusStepLabels[step]}</div>
              </div>
            ))}
          </div>
        );
      };

      const categories = ['all', ...new Set(menuItems.map(m => m.category))];
      const filteredMenu = posCategory === 'all' ? menuItems : menuItems.filter(m => m.category === posCategory);
      const cartItemIds = formItems.map(fi => fi.item_id);

      return (
        <div className="customer-layout">
          <nav className="customer-nav">
            <button type="button" className="customer-nav-logo nav-link-btn" onClick={() => setActiveTab('dashboard')} aria-label="Chop Fast Lagos home">
              <img src={LOGO_URL} alt="" />
              <span>Chop Fast Lagos</span>
            </button>
            <div className="customer-nav-tabs">
              {[
                { id: 'dashboard', icon: 'fa-home', label: 'Home' },
                { id: 'order', icon: 'fa-plus-circle', label: 'Place Order' },
                { id: 'orders', icon: 'fa-shopping-bag', label: 'My Orders' },
                { id: 'account', icon: 'fa-user-circle', label: 'Account' }
              ].map(tab => (
                <button key={tab.id} className={'customer-nav-tab' + (activeTab === tab.id ? ' active' : '')} onClick={() => setActiveTab(tab.id)}>
                  <i className={'fas ' + tab.icon}></i> {tab.label}
                </button>
              ))}
            </div>
            <div className="customer-nav-right">
              <ThemeToggleButton theme={theme} toggleTheme={toggleTheme} />
              <span className="customer-nav-user"><i className="fas fa-user"></i> {user.name}</span>
              <button type="button" className="customer-nav-logout" aria-label="Log out" onClick={handleLogout}><i className="fas fa-sign-out-alt"></i></button>
            </div>
          </nav>

          <div className="customer-content">
            {activeTab === 'dashboard' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <h2 style={{color: 'var(--navy-primary)', marginBottom: '24px'}}><i className="fas fa-hand-wave"></i> Welcome, {user.name}!</h2>
                {loading ? <TableSkeleton rows={3} columns={3} /> : stats && (
                  <div className="dashboard-grid-3">
                    <div className="stat-card"><div className="stat-card-icon icon-blue"><i className="fas fa-shopping-bag"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.totalOrders}</div><div className="stat-card-label">Total Orders</div></div></div>
                    <div className="stat-card"><div className="stat-card-icon icon-orange"><i className="fas fa-clock"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.activeOrders}</div><div className="stat-card-label">Active Orders</div></div></div>
                    <div className="stat-card"><div className="stat-card-icon icon-green"><i className="fas fa-check-double"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats.deliveredOrders}</div><div className="stat-card-label">Delivered</div></div></div>
                  </div>
                )}
                <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px'}}><i className="fas fa-clock"></i> Active Orders</h3>
                {orders.filter(o => !['delivered', 'cancelled'].includes(o.status)).length === 0 ? (
                  <div className="data-section" style={{textAlign: 'center', padding: '40px', color: '#c4b5a5'}}>
                    <i className="fas fa-shopping-bag" style={{fontSize: '48px', marginBottom: '12px', display: 'block'}}></i>
                    <p>No active orders. <a href="#" style={{color: 'var(--navy-accent)'}} onClick={(e) => { e.preventDefault(); setActiveTab('order'); }}>Place an order!</a></p>
                  </div>
                ) : (
                  orders.filter(o => !['delivered', 'cancelled'].includes(o.status)).map(order => (
                    <div className="customer-order-card" key={order.order_id}>
                      <div className="customer-order-header">
                        <strong style={{color: 'var(--navy-primary)', fontSize: '16px'}}>{order.order_id}</strong>
                        <span className={'order-status order-' + order.status}>{order.status.replace('_', ' ')}</span>
                      </div>
                      {renderStatusProgress(order.status)}
                      <div className="customer-order-items">
                        {(order.items || []).map((it, idx) => <span key={idx}>{idx > 0 ? ', ' : ''}{it.qty}x {it.item_name}</span>)}
                      </div>
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span style={{fontWeight: '700', color: 'var(--navy-primary)'}}>{formatPrice(order.total)}</span>
                        <span style={{fontSize: '12px', color: '#999'}}>{formatDate(order.timestamp)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'order' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <h2 style={{color: 'var(--navy-primary)', marginBottom: '20px'}}><i className="fas fa-plus-circle"></i> Place Order</h2>
                <div className="data-section" style={{marginBottom: '20px', padding: '20px'}}>
                  <div className="form-grid">
                    <div className="form-group">
                      <label><i className="fas fa-tag"></i> Order Type</label>
                      <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})}>
                        <option value="delivery">Delivery</option>
                        <option value="pickup">Pickup</option>
                      </select>
                    </div>
                    {formData.type === 'delivery' && (
                      <>
                        <div className="form-group">
                          <label><i className="fas fa-map-marker-alt"></i> Delivery Address</label>
                          <input type="text" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} placeholder="Your delivery address" />
                        </div>
                        <div className="form-group">
                          <label><i className="fas fa-city"></i> City</label>
                          <input type="text" value={formData.city} onChange={(e) => setFormData({...formData, city: e.target.value})} placeholder="City" />
                        </div>
                      </>
                    )}
                    <div className="form-group" style={{gridColumn: '1 / -1'}}>
                      <label><i className="fas fa-sticky-note"></i> Notes (optional)</label>
                      <input type="text" value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} placeholder="Special instructions" />
                    </div>
                  </div>
                </div>

                <div className="pos-container">
                  <div className="pos-grid-section">
                    <div className="category-tabs" style={{marginBottom: '16px'}}>
                      {categories.map(cat => (
                        <button key={cat} className={'category-tab' + (posCategory === cat ? ' active' : '')} onClick={() => setPosCategory(cat)}>
                          {cat === 'all' ? 'All Items' : cat}
                        </button>
                      ))}
                    </div>
                    <div className="pos-grid">
                      {filteredMenu.map(item => {
                        const inCart = cartItemIds.includes(item.item_id);
                        const cartItem = formItems.find(fi => fi.item_id === item.item_id);
                        return (
                          <div key={item.item_id} className={'pos-item' + (inCart ? ' in-cart' : '')} onClick={() => posAddItem(item)}>
                            {inCart && <span className="pos-item-badge">{cartItem.qty}</span>}
                            {item.image_url ? (
                              <img src={item.image_url} alt="" style={{width: '100%', height: '80px', objectFit: 'cover', borderRadius: '14px', marginBottom: '8px'}} />
                            ) : (
                              <div style={{width: '100%', height: '80px', background: 'rgba(247,239,227,0.8)', borderRadius: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#c4b5a5'}}>
                                <i className="fas fa-utensils" style={{fontSize: '24px'}}></i>
                              </div>
                            )}
                            <div style={{fontWeight: '600', fontSize: '13px', marginBottom: '4px'}}>{item.name}</div>
                            <div style={{fontWeight: '700', color: 'var(--navy-primary)', fontSize: '14px'}}>{formatPrice(item.price)}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="pos-cart-section">
                    <div className="pos-cart">
                      <h3 style={{margin: '0 0 16px', color: 'var(--navy-primary)', fontSize: '16px', fontWeight: '700'}}><i className="fas fa-shopping-cart"></i> Cart ({formItems.length})</h3>
                      {formItems.length === 0 && (
                        <div style={{textAlign: 'center', padding: '30px 10px', color: '#c4b5a5'}}>
                          <i className="fas fa-shopping-cart" style={{fontSize: '32px', marginBottom: '10px', display: 'block'}}></i>
                          <p style={{fontSize: '13px'}}>Click items to add</p>
                        </div>
                      )}
                      {formItems.map(fi => (
                        <div key={fi.item_id} className="pos-cart-row" style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid rgba(34,27,24,0.06)'}}>
                          <div style={{flex: 1, minWidth: 0}}>
                            <div style={{fontWeight: '600', fontSize: '13px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'}}>{fi.item_name}</div>
                            <div style={{fontSize: '12px', color: 'var(--warm-muted)'}}>{formatPrice(fi.unit_price)} each</div>
                          </div>
                          <div className="pos-qty-controls">
                            <button className="pos-qty-btn" type="button" aria-label="Decrease quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, -1); }}>-</button>
                            <span style={{fontWeight: '700', minWidth: '20px', textAlign: 'center'}}>{fi.qty}</span>
                            <button className="pos-qty-btn" type="button" aria-label="Increase quantity" onClick={(e) => { e.stopPropagation(); posUpdateQty(fi.item_id, 1); }}>+</button>
                          </div>
                          <div style={{fontWeight: '700', minWidth: '60px', textAlign: 'right', fontSize: '13px'}}>{formatPrice(fi.total_price)}</div>
                          <button type="button" aria-label="Remove item" style={{background: 'none', border: 'none', color: '#ea4335', cursor: 'pointer', padding: '4px 8px'}} onClick={() => removeItem(fi.item_id)}><i className="fas fa-trash"></i></button>
                        </div>
                      ))}
                      {formItems.length > 0 && (
                        <div style={{marginTop: '16px', borderTop: '2px solid var(--navy-accent)', paddingTop: '12px'}}>
                          <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(formSubtotal)}</span></div>
                          {formDeliveryCharge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(formDeliveryCharge)}</span></div>}
                          <div className="order-total-row"><span>Total</span><span>{formatPrice(formTotal)}</span></div>
                          <button className="btn btn-success" style={{width: '100%', marginTop: '12px', padding: '14px'}} onClick={submitOrder} disabled={submitting}>
                            {submitting ? <><i className="fas fa-spinner fa-spin"></i> Placing...</> : <><i className="fas fa-check"></i> Place Order — {formatPrice(formTotal)}</>}
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'orders' && (
              <div style={{animation: 'fadeInUp 0.4s ease'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                  <h2 style={{color: 'var(--navy-primary)'}}><i className="fas fa-shopping-bag"></i> My Orders</h2>
                  <button className="btn btn-success" onClick={() => setActiveTab('order')}><i className="fas fa-plus"></i> New Order</button>
                </div>
                {loading ? <TableSkeleton rows={4} columns={4} /> : orders.length === 0 ? (
                  <div className="data-section" style={{textAlign: 'center', padding: '60px', color: '#c4b5a5'}}>
                    <i className="fas fa-shopping-bag" style={{fontSize: '48px', marginBottom: '12px', display: 'block'}}></i>
                    <p>No orders yet. Place your first order!</p>
                  </div>
                ) : (
                  orders.map(order => (
                    <div className="customer-order-card" key={order.order_id} style={{cursor: 'pointer'}} onClick={() => setExpandedOrder(expandedOrder === order.order_id ? null : order.order_id)}>
                      <div className="customer-order-header">
                        <div>
                          <strong style={{color: 'var(--navy-primary)', fontSize: '16px'}}>{order.order_id}</strong>
                          <span className={'type-badge type-' + order.type.replace('_', '')} style={{marginLeft: '8px'}}>{order.type.replace('_', ' ')}</span>
                        </div>
                        <span className={'order-status order-' + order.status}>{order.status.replace('_', ' ')}</span>
                      </div>
                      {renderStatusProgress(order.status)}
                      <div className="customer-order-items">
                        {(order.items || []).map((it, idx) => <span key={idx}>{idx > 0 ? ', ' : ''}{it.qty}x {it.item_name}</span>)}
                      </div>
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                        <span style={{fontWeight: '700', color: 'var(--navy-primary)'}}>{formatPrice(order.total)}</span>
                        <span style={{fontSize: '12px', color: '#999'}}>{formatDate(order.timestamp)}</span>
                      </div>
                      {expandedOrder === order.order_id && (
                        <div style={{marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #eee'}} onClick={(e) => e.stopPropagation()}>
                          <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', fontSize: '13px'}}>
                            {order.phone && <div><strong>Phone:</strong> {order.phone}</div>}
                            {order.address && <div><strong>Address:</strong> {order.address}</div>}
                            {order.city && <div><strong>City:</strong> {order.city}</div>}
                            {order.notes && <div style={{gridColumn: '1/-1'}}><strong>Notes:</strong> <span style={{color: '#e65100'}}>{order.notes}</span></div>}
                          </div>
                          <div className="about-table-wrapper" style={{marginTop: '12px'}}>
                            <table className="about-roles-table" style={{fontSize: '13px'}}>
                              <thead><tr><th style={{textAlign: 'left'}}>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                              <tbody>
                                {(order.items || []).map((it, idx) => (
                                  <tr key={idx}><td style={{textAlign: 'left', fontWeight: 500, background: 'rgba(255,248,239,0.6)'}}>{it.item_name}</td><td>{it.qty}</td><td>{formatPrice(it.unit_price)}</td><td><strong>{formatPrice(it.total_price)}</strong></td></tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                          <div style={{marginTop: '8px', fontSize: '13px'}}>
                            <div className="order-detail-row"><span className="label">Subtotal</span><span className="value">{formatPrice(order.subtotal)}</span></div>
                            {order.delivery_charge > 0 && <div className="order-detail-row"><span className="label">Delivery</span><span className="value">{formatPrice(order.delivery_charge)}</span></div>}
                            <div className="order-total-row"><span>Total</span><span>{formatPrice(order.total)}</span></div>
                          </div>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab === 'account' && (
              <div style={{animation: 'fadeInUp 0.4s ease', maxWidth: '500px'}}>
                <h2 style={{color: 'var(--navy-primary)', marginBottom: '20px'}}><i className="fas fa-user-circle"></i> My Account</h2>
                <div className="data-section" style={{padding: '20px', marginBottom: '20px'}}>
                  <div className="order-detail-row"><span className="label">Name</span><span className="value">{user.name}</span></div>
                  <div className="order-detail-row"><span className="label">Phone</span><span className="value">{user.username}</span></div>
                  <div className="order-detail-row"><span className="label">Role</span><span className="role-badge role-customer">Customer</span></div>
                </div>
                <div className="data-section" style={{padding: '20px'}}>
                  <h3 style={{color: 'var(--navy-primary)', marginBottom: '16px', fontSize: '16px'}}><i className="fas fa-lock"></i> Change Password</h3>
                  <div className="form-group"><label>Current Password</label><input type="password" value={oldPass} onChange={(e) => setOldPass(e.target.value)} placeholder="Current password" /></div>
                  <div className="form-group"><label>New Password</label><input type="password" value={newPass} onChange={(e) => setNewPass(e.target.value)} placeholder="New password (min 6)" /></div>
                  <div className="form-group"><label>Confirm New Password</label><input type="password" value={confirmNewPass} onChange={(e) => setConfirmNewPass(e.target.value)} placeholder="Confirm new password" /></div>
                  <button className="btn btn-primary" onClick={handleChangePassword}><i className="fas fa-save"></i> Change Password</button>
                </div>
              </div>
            )}
          </div>

          <nav className="bottom-nav customer-bottom-nav">
            <div className="bottom-nav-items">
              {[
                { id: 'dashboard', icon: 'fa-home', label: 'Home' },
                { id: 'order', icon: 'fa-plus-circle', label: 'Order' },
                { id: 'orders', icon: 'fa-shopping-bag', label: 'My Orders' },
                { id: 'account', icon: 'fa-user-circle', label: 'Account' }
              ].map(tab => (
                <button key={tab.id} className={'bottom-nav-item' + (activeTab === tab.id ? ' active' : '')} onClick={() => setActiveTab(tab.id)}>
                  <i className={'fas ' + tab.icon}></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    // ==================== LOGIN PAGE ====================
    function LoginPage({ onLogin, onBack, onRegister, theme, toggleTheme }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const result = await serverCall('login', username, password);
          setLoading(false);
          if (result.success) {
            onLogin(result.data);
          } else {
            setError(result.message);
          }
        } catch (err) {
          setLoading(false);
          setError('Connection error. Please try again.');
        }
      };

      return (
        <div className="login-container">
          <div className="login-box">
            <div style={{display: 'flex', justifyContent: onBack ? 'space-between' : 'flex-end', alignItems: 'center'}}>
              {onBack && <button type="button" className="page-back-btn" onClick={onBack} aria-label="Back to home"><i className="fas fa-arrow-left"></i> Back</button>}
              <ThemeToggleButton theme={theme} toggleTheme={toggleTheme} />
            </div>
            {onBack ? (
              <button type="button" className="logo-home-btn" onClick={onBack} aria-label="Chop Fast Lagos home" style={{marginBottom: '25px'}}>
                <img src={LOGO_URL} alt="Chop Fast Lagos" className="login-logo" style={{marginBottom: 0}} />
              </button>
            ) : <img src={LOGO_URL} alt="Logo" className="login-logo" />}
            <h2><i className="fas fa-utensils"></i> Chop Fast Lagos</h2>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label><i className="fas fa-user"></i> Username</label>
                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="Enter username" required />
              </div>
              <div className="form-group">
                <label><i className="fas fa-lock"></i> Password</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Enter password" required />
              </div>
              <button type="submit" className="btn btn-primary" disabled={loading} style={{width: '100%'}}>
                {loading ? <><i className="fas fa-spinner fa-spin"></i> Logging in...</> : <><i className="fas fa-sign-in-alt"></i> Login</>}
              </button>
              {error && <div className="error"><i className="fas fa-exclamation-circle"></i> {error}</div>}
            </form>
            <div style={{textAlign: 'center', marginTop: '16px', fontSize: '14px'}}>
              {onRegister && <p style={{marginBottom: '8px', color: 'var(--warm-muted)'}}>Want to order? <a href="#" style={{color: 'var(--navy-accent)', fontWeight: '600'}} onClick={(e) => { e.preventDefault(); onRegister(); }}>Order Food</a></p>}
              {onBack && <a href="#" style={{color: '#a89888', fontSize: '13px'}} onClick={(e) => { e.preventDefault(); onBack(); }}><i className="fas fa-arrow-left"></i> Back to Home</a>}
            </div>
          </div>
        </div>
      );
    }

    // ==================== SIDEBAR ====================
    function Sidebar({ activeMenu, setActiveMenu, user, onLogout, sidebarOpen, theme, toggleTheme }) {
      const [badgeCount, setBadgeCount] = useState(0);

      const menuItems = [
        { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard', roles: ['admin', 'chef', 'rider'] },
        { id: 'menu', icon: 'fa-utensils', label: 'Menu', roles: ['admin', 'chef'] },
        { id: 'orders', icon: 'fa-shopping-bag', label: 'Orders', roles: ['admin', 'chef', 'rider'], showBadge: true },
        { id: 'promos', icon: 'fa-tags', label: 'Promo Codes', roles: ['admin'] },
        { id: 'combos', icon: 'fa-layer-group', label: 'Combos', roles: ['admin'] },
        { id: 'daily', icon: 'fa-calendar-day', label: 'Daily Summary', roles: ['admin'] },
        { id: 'reports', icon: 'fa-file-alt', label: 'Reports', roles: ['admin'] },
        { id: 'users', icon: 'fa-users', label: 'Users', roles: ['admin'] },
        { id: 'logs', icon: 'fa-history', label: 'Activity Logs', roles: ['admin'] },
        { id: 'account', icon: 'fa-user-circle', label: 'My Account', roles: ['admin', 'chef', 'rider'] },
        { id: 'about', icon: 'fa-info-circle', label: 'About App', roles: ['admin', 'chef', 'rider'] }
      ];

      useEffect(() => {
        const fetchBadge = async () => {
          try {
            const res = await serverCall('getPendingOrderCount', user.id, user.role);
            if (res.success) setBadgeCount(res.data.count);
          } catch (e) {}
        };
        fetchBadge();
        const interval = setInterval(fetchBadge, 30000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className={'sidebar' + (sidebarOpen ? ' open' : '')}>
          <div style={{padding: '24px', borderBottom: '1px solid rgba(255, 255, 255, 0.1)', textAlign: 'center'}}>
            <div style={{color: 'white', fontSize: '20px', fontWeight: '700'}}>
              <i className="fas fa-utensils"></i> Chop Fast Lagos
            </div>
          </div>
          <div className="sidebar-user-info">
            <div className="sidebar-user-name">{user.name}</div>
            <div className="sidebar-user-role">{user.role}</div>
          </div>
          <div className="sidebar-menu-section">
            <div className="sidebar-menu-title">Navigation</div>
            <ul className="sidebar-menu">
              {menuItems.filter(item => item.roles.includes(user.role)).map(item => (
                <li key={item.id}>
                  <button className={activeMenu === item.id ? 'active' : ''} onClick={() => setActiveMenu(item.id)}>
                    <i className={'fas ' + item.icon}></i>
                    <span>{item.label}</span>
                    {item.showBadge && badgeCount > 0 && <span className="sidebar-badge">{badgeCount}</span>}
                  </button>
                </li>
              ))}
            </ul>
          </div>
          <div className="sidebar-logout">
            <ThemeToggleButton theme={theme} toggleTheme={toggleTheme} style={{marginBottom: '8px'}} />
            <button onClick={() => {
              Swal.fire({ icon: 'question', title: 'Logout?', text: 'Are you sure?', showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: '<i class="fas fa-sign-out-alt"></i> Logout' }).then(r => { if (r.isConfirmed) onLogout(); });

          </div>

    // ==================== BREADCRUMB WITH NOTIFICATIONS ====================
    function Breadcrumb({ activeMenu, setActiveMenu, role, user }) {
      const menuLabels = { dashboard: 'Dashboard', menu: 'Menu', orders: 'Orders', promos: 'Promo Codes', combos: 'Combos', daily: 'Daily Summary', reports: 'Reports', users: 'Users', logs: 'Activity Logs', account: 'My Account', about: 'About App' };
      const [notifications, setNotifications] = useState([]);
      const [showDropdown, setShowDropdown] = useState(false);
      const [readIds, setReadIds] = useState(() => {
        try { return JSON.parse(localStorage.getItem('food_app_notif_read_' + user.id) || '[]'); } catch(e) { return []; }
      });
      const prevCountRef = useRef(0);
      const bellRef = useRef(null);
      const [dropdownPos, setDropdownPos] = useState({ top: 0, right: 0 });

      const fetchNotifications = async () => {
        try {
          const res = await serverCall('getNotifications', user.id, user.role);
          if (res.success) {
            const newNotifs = res.data;
            if (newNotifs.length > prevCountRef.current && prevCountRef.current > 0) {
              try { if (navigator.vibrate) navigator.vibrate(200); } catch(e) {}
            }
            prevCountRef.current = newNotifs.length;
            setNotifications(newNotifs);
          }
        } catch(e) {}
      };

      useEffect(() => {
        fetchNotifications();
        const interval = setInterval(fetchNotifications, 3000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        try { localStorage.setItem('food_app_notif_read_' + user.id, JSON.stringify(readIds)); } catch(e) {}
      }, [readIds]);

      const unreadCount = notifications.filter(n => !readIds.includes(n.id)).length;

      const getTimeAgoLocal = (isoString) => {
        const seconds = Math.floor((new Date() - new Date(isoString)) / 1000);
        if (seconds < 60) return 'Just now';
        if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
        if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
        return Math.floor(seconds / 86400) + 'd ago';
      };

      const handleMarkAllRead = () => {
        setReadIds(notifications.map(n => n.id));
      };

      const handleNotifClick = (notif) => {
        if (!readIds.includes(notif.id)) {
          setReadIds(prev => [...prev, notif.id]);
        }
        if (notif.link) setActiveMenu(notif.link);
        setShowDropdown(false);
      };

      const toggleDropdown = () => {
        if (!showDropdown && bellRef.current) {
          const rect = bellRef.current.getBoundingClientRect();
          const dropW = Math.min(360, window.innerWidth - 32);
          let rightPos = window.innerWidth - rect.right;
          if (rightPos + dropW > window.innerWidth - 16) rightPos = 16;
          setDropdownPos({ top: rect.bottom + 8, right: Math.max(rightPos, 16) });
        }
        setShowDropdown(!showDropdown);
      };

      return (
        <div className="breadcrumb">
          <a href="#" role="button" onClick={(e) => { e.preventDefault(); setActiveMenu('dashboard'); }}><i className="fas fa-home"></i> Home</a>
          <span className="breadcrumb-sep">/</span>
          <span>{menuLabels[activeMenu] || 'Page'}</span>

          <div className="breadcrumb-right">
            <button type="button" ref={bellRef} className="notif-bell" aria-label={'Notifications' + (unreadCount > 0 ? ', ' + unreadCount + ' unread' : '')} onClick={toggleDropdown}>
              <i className="fas fa-bell"></i>
              {unreadCount > 0 && <span className="notif-count">{unreadCount > 99 ? '99+' : unreadCount}</span>}
            </button>

            {showDropdown && ReactDOM.createPortal(
              <React.Fragment>
                <div className="notif-overlay" onClick={() => setShowDropdown(false)}></div>
                <div className="notif-dropdown" style={{ top: dropdownPos.top + 'px', right: dropdownPos.right + 'px' }}>
                  <div className="notif-dropdown-header">
                    <h4><i className="fas fa-bell"></i> Notifications</h4>
                    {unreadCount > 0 && (
                      <button className="notif-mark-read" onClick={handleMarkAllRead}>
                        <i className="fas fa-check-double"></i> Mark all read
                      </button>
                    )}
                  </div>
                  <div className="notif-list">
                    {notifications.length === 0 ? (
                      <div className="notif-empty">
                        <i className="fas fa-bell-slash"></i>
                        <p>No notifications</p>
                      </div>
                    ) : (
                      notifications.map(notif => {
                        const isUnread = !readIds.includes(notif.id);
                        return (
                          <div key={notif.id} className={'notif-item' + (isUnread ? ' unread' : '')} onClick={() => handleNotifClick(notif)}>
                            <div className={'notif-item-icon type-' + notif.type}>
                              <i className={'fas ' + notif.icon}></i>
                            </div>
                            <div className="notif-item-content">
                              <div className="notif-item-title">{notif.title}</div>
                              <div className="notif-item-message">{notif.message}</div>
                              <div className="notif-item-time">{getTimeAgoLocal(notif.timestamp)}</div>
                            </div>
                            {isUnread && <div className="notif-unread-dot"></div>}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </React.Fragment>,
              document.body
            )}
          </div>
        </div>
      );
    }

    // ==================== DASHBOARD VIEW ====================

                <div className="stat-card-icon icon-green"><i className="fas fa-naira-sign"></i></div>

                <Sparkline color="#2e7d32" />

                <div className="stat-card-info"><div className="stat-card-value">{formatPrice(stats?.todayRevenue || 0)}</div><div className="stat-card-label">Today's Revenue</div></div>

              <div className="stat-card"><div className="stat-card-icon icon-purple"><i className="fas fa-fire"></i></div><div className="stat-card-info"><div className="stat-card-value">{stats?.preparingCount || 0}</div><div className="stat-card-label">Preparing Now</div></div><Sparkline color="#6a1b9a" /></div>

    // ==================== USERS VIEW ====================
    function UsersView({ user }) {
      const [loading, setLoading] = useState(true);
      const [users, setUsers] = useState([]);
      const tableInstanceRef = useRef(null);
      const [filters, setFilters] = useState({ role: '', status: '' });

      useEffect(() => {
        loadUsers();
        return () => {
          if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {} }
        };
      }, []);

      const loadUsers = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getUsers', user.id, user.role);
          setLoading(false);
          if (result.success) {
            setUsers(result.data);
            initializeDataTable(result.data);
          } else {
            Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }
        } catch (err) {
          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load users' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#usersTable').empty(); } catch (e) {} }
        setTimeout(() => {
          try {
            const table = $('#usersTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'user_id', title: 'ID' },
                { data: 'username', title: 'Username', render: (d) => escapeHtml(d) },
                { data: 'name', title: 'Name', render: (d) => escapeHtml(d) },
                { data: 'role', title: 'Role', render: (d) => '<span class="role-badge role-' + escapeHtml(d) + '">' + escapeHtml(d.charAt(0).toUpperCase() + d.slice(1)) + '</span>' },
                { data: 'contact', title: 'Contact', render: (d) => escapeHtml(d) || '-' },
                { data: 'is_active', title: 'Status', render: (d) => '<span class="status-badge ' + (d === 'active' ? 'status-active' : 'status-inactive') + '">' + d.charAt(0).toUpperCase() + d.slice(1) + '</span>' },
                { data: 'last_login', title: 'Last Login', render: (d) => d ? formatDate(d) : 'Never' },
                { data: null, title: 'Actions', orderable: false, render: () => '<button class="action-icon edit-icon" data-action="edit"><i class="fas fa-edit"></i></button><button class="action-icon delete-icon" data-action="delete"><i class="fas fa-trash"></i></button>' }
              ],
              pageLength: 10, lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "All"]], responsive: true, dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV', exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF', exportOptions: { columns: ':not(:last-child)' } },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print', exportOptions: { columns: ':not(:last-child)' } }
              ],
              order: [[0, 'desc']]
            });

            $('#usersTable').off('click', '.action-icon');
            $('#usersTable').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              const rowData = table.row($(this).parents('tr')).data();
              if (action === 'edit') handleEditUser(rowData);
              else handleDeleteUser(rowData);
            });

            tableInstanceRef.current = table;
          } catch (e) { console.error('DataTable init error:', e); }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        const dt = tableInstanceRef.current;
        dt.columns().search('').draw();
        if (filters.role) dt.column(3).search(filters.role).draw(false);
        if (filters.status) dt.column(5).search(filters.status).draw(false);
        dt.draw();
      };

      const clearFilters = () => {
        setFilters({ role: '', status: '' });
        if (tableInstanceRef.current) { tableInstanceRef.current.columns().search('').draw(); }
      };

      useEffect(() => { if (tableInstanceRef.current && users.length > 0) applyFilters(); }, [filters]);

      const handleAddUser = () => {
        Swal.fire({
          title: '<i class="fas fa-user-plus" style="color:#221b18"></i> Add New User',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Username *</label><input type="text" id="swal-username" placeholder="Enter username"></div>' +
            '<div class="form-group"><label>Password *</label><input type="password" id="swal-password" placeholder="Min 6 characters"></div>' +
            '<div class="form-group"><label>Display Name *</label><input type="text" id="swal-name" placeholder="Enter name"></div>' +
            '<div class="form-group"><label>Role</label><select id="swal-role"><option value="admin">Admin</option><option value="chef" selected>Chef</option><option value="rider">Rider</option></select></div>' +
            '<div class="form-group"><label>Contact</label><input type="tel" id="swal-contact" placeholder="Phone number"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600, showCancelButton: true, confirmButtonText: '<i class="fas fa-save"></i> Save',
          confirmButtonColor: '#b54d2d', cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          focusConfirm: false,
          preConfirm: () => {
            const username = document.getElementById('swal-username').value.trim();
            const password = document.getElementById('swal-password').value;
            const name = document.getElementById('swal-name').value.trim();
            if (!username || !password || !name) { Swal.showValidationMessage('Username, password and name are required'); return false; }
            if (password.length < 6) { Swal.showValidationMessage('Password must be at least 6 characters'); return false; }
            return {
              username, password, name,
              userRole: document.getElementById('swal-role').value,
              contact: document.getElementById('swal-contact').value.trim(),
              is_active: document.getElementById('swal-status').value
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Saving...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('addUser', result.value, user.id, user.role);
              if (res.success) { Swal.fire({ icon: 'success', title: 'Success!', text: res.message, timer: 2000, showConfirmButton: false }); setTimeout(() => loadUsers(), 100); }
              else Swal.fire({ icon: 'error', title: 'Error', text: res.message });
            } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to add user' }); }
          }
        });
      };

      const handleEditUser = (userData) => {
        Swal.fire({
          title: '<i class="fas fa-user-edit" style="color:#221b18"></i> Edit User',
          html: '<div class="swal-form"><div class="swal-form-grid">' +
            '<div class="form-group"><label>Username *</label><input type="text" id="swal-username" value="' + escapeHtml(userData.username) + '"></div>' +
            '<div class="form-group"><label>Password</label><input type="password" id="swal-password" placeholder="Leave blank to keep"></div>' +
            '<div class="form-group"><label>Display Name *</label><input type="text" id="swal-name" value="' + escapeHtml(userData.name) + '"></div>' +
            '<div class="form-group"><label>Role</label><select id="swal-role"><option value="admin">Admin</option><option value="chef">Chef</option><option value="rider">Rider</option></select></div>' +
            '<div class="form-group"><label>Contact</label><input type="tel" id="swal-contact" value="' + escapeHtml(userData.contact) + '"></div>' +
            '<div class="form-group"><label>Status</label><select id="swal-status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>' +
            '</div></div>',
          width: 600, showCancelButton: true, confirmButtonText: '<i class="fas fa-save"></i> Update',
          confirmButtonColor: '#b54d2d', cancelButtonText: '<i class="fas fa-times"></i> Cancel',
          focusConfirm: false,
          didOpen: () => {
            document.getElementById('swal-role').value = userData.role;

              userRole: document.getElementById('swal-role').value,
              contact: document.getElementById('swal-contact').value.trim(),
              is_active: document.getElementById('swal-status').value
            };
          }
        }).then(async (result) => {
          if (result.isConfirmed) {
            Swal.fire({ title: 'Updating...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
              const res = await serverCall('updateUser', result.value, user.id, user.role);

              else Swal.fire({ icon: 'error', title: 'Error', text: res.message });

          cancelButtonText: '<i class="fas fa-times"></i> Cancel'
        }).then(async (result) => {

              const res = await serverCall('deleteUser', userData.user_id, user.id, user.role);

              else Swal.fire({ icon: 'error', title: 'Error', text: res.message });

    // ==================== MENU ITEMS VIEW (ADMIN) ====================
    function MenuItemsView({ user }) {
      const [loading, setLoading] = useState(true);
      const [items, setItems] = useState([]);
      const [activeCategory, setActiveCategory] = useState('ALL');
      const tableInstanceRef = useRef(null);
      const categories = [
        'ALL',
        'SOFT DRINK','GIN & VODKA','SWALLOW','BREAKFAST','PROTEIN','CLASSIC PEPPER SOUP','RR KITCHEN NIGERIAN SOUP','SALAD','SHOTS','SIDES (EXTRAS)','KEBAB','MAIN COURSE','RR KITCHEN CHINESE DISH','RR KITCHEN CONTINENTAL DISH - STARTER','WHISKEY','WHITE WINE','SHOT BEVERAGES','MILKSHAKES','TEQUILA','RED WINE','ROSE WINE','NON-ALCOHOLIC DRINK','RR KITCHEN SANDWICH AND BURGER','RR CHICKEN COMBOS','PASTA','RICE DISHES','SPECIAL COCKTAILS','JUICES/SMOOTHIES','BEER','OTHERS','DESSERT','NIGERIAN RICE DISHES','PLATTER','RR GRILLED SECTION','LIGHT MEALS','CLASSIC COCKTAILS','COGNAC','CHAMPAGNE'
      ];

      useEffect(() => {
        loadItems();
        return () => { if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); } catch(e){} } };
      }, []);

      const loadItems = async () => {
        setLoading(true);
        try {
          const result = await serverCall('getMenuItems', user.id, user.role);

            setItems(result.data);
            initializeDataTable(result.data);
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });

          setLoading(false);
          Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load menu items' });
        }
      };

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) { try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#menuTable').empty(); } catch(e){} }
        setTimeout(() => {
          try {
            const table = $('#menuTable').DataTable({
              data: data, destroy: true,
              columns: [
                { data: 'item_id', title: 'ID' },
